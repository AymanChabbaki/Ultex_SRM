version: '3.8'

services:
  ubos-postgres:
    image: postgres:16-alpine
    container_name: ubos_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_pass_2026
      POSTGRES_DB: ubos_db
    ports:
      - '5434:5432'
    volumes:
      - ubos_postgres_prod_data:/var/lib/postgresql/data
    networks:
      - ubos-net

  ubos-backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ubos_backend_prod
    restart: always
    environment:
      PORT: 5000
      DATABASE_URL: "postgresql://postgres:postgres_secure_pass_2026@ubos-postgres:5432/ubos_db?schema=public"
      JWT_SECRET: "ubos_prod_jwt_secret_98765"
    ports:
      - '5050:5000'
    depends_on:
      - ubos-postgres
    networks:
      - ubos-net

  ubos-frontend:
    build:
      context: ./ubos-react
      dockerfile: Dockerfile
    container_name: ubos_frontend_prod
    restart: always
    ports:
      - '8080:80'
    depends_on:
      - ubos-backend
    networks:
      - ubos-net

networks:
  ubos-net:
    driver: bridge

volumes:
  ubos_postgres_prod_data:
