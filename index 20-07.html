<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UBOS — ULTEx Business Operating System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --vert:#1E4D3B; --vert-fonce:#14382B; --vert-nuit:#0E2A20;
  --or:#9A7B2D; --or-clair:#C8A954; --ivoire:#F7F5F0; --carte:#FFFFFF;
  --encre:#26312B; --gris:#6C7A72; --bord:#E2E7E1; --vert-pale:#EAF2EE;
  --rouge:#A33B2E; --ambre:#B07A1E; --ok:#2E7D4F;
  --ombre:0 1px 3px rgba(20,56,43,.08),0 8px 24px rgba(20,56,43,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--ivoire);color:var(--encre);font-size:14px;line-height:1.5}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}

/* ---------- Structure ---------- */
#app{display:flex;min-height:100vh}
aside{width:248px;background:linear-gradient(180deg,var(--vert-fonce),var(--vert-nuit));color:#E8EFE9;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50;transition:transform .25s ease}
main{flex:1;margin-left:248px;padding:22px 26px 60px;min-width:0}
.logo{padding:20px 20px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
.logo h1{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;letter-spacing:.04em;color:#fff}
.logo h1 span{color:var(--or-clair)}
.logo small{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#9DB4A7;margin-top:2px}
nav{flex:1;overflow-y:auto;padding:10px 0}
nav .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:#7E9C8C;padding:14px 20px 6px}
nav a{display:flex;align-items:center;gap:10px;padding:8px 20px;color:#D6E2D9;text-decoration:none;font-size:13.5px;border-left:3px solid transparent}
nav a .ic{width:18px;text-align:center;color:var(--or-clair);font-size:12px}
nav a:hover{background:rgba(255,255,255,.06)}
nav a.on{background:rgba(200,169,84,.14);border-left-color:var(--or-clair);color:#fff;font-weight:600}
nav a .bulle{margin-left:auto;background:var(--or);color:#fff;border-radius:99px;font-size:10.5px;padding:1px 7px;font-weight:600}
.aside-pied{padding:14px 20px;border-top:1px solid rgba(255,255,255,.12);display:flex;gap:8px}
.aside-pied button{flex:1;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:#E8EFE9;border-radius:8px;padding:7px 4px;font-size:12px}
.aside-pied button:hover{background:rgba(255,255,255,.16)}

/* ---------- Topbar ---------- */
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top h2{font-family:'Cormorant Garamond',serif;font-size:30px;font-weight:700;color:var(--vert);flex:1;min-width:180px}
.burger{display:none;background:var(--vert);color:#fff;border:none;border-radius:8px;width:38px;height:38px;font-size:17px}
.user-box{display:flex;align-items:center;gap:8px;background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:6px 10px;box-shadow:var(--ombre)}
.user-box label{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.08em}
.user-box select{border:none;background:none;font-weight:600;color:var(--vert);outline:none}
.cloche{position:relative;background:var(--carte);border:1px solid var(--bord);border-radius:10px;width:38px;height:38px;font-size:16px;box-shadow:var(--ombre)}
.cloche em{position:absolute;top:-6px;right:-6px;background:var(--rouge);color:#fff;font-style:normal;font-size:10px;font-weight:700;border-radius:99px;padding:1px 6px;display:none}

/* ---------- Cartes stats ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:14px 16px;box-shadow:var(--ombre)}
.stat b{display:block;font-size:24px;color:var(--vert);font-weight:700}
.stat span{font-size:12px;color:var(--gris)}
.stat.alerte b{color:var(--rouge)}

/* ---------- Chemin du dossier (signature) ---------- */
.chemin{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:16px;box-shadow:var(--ombre);margin-bottom:18px;overflow-x:auto}
.chemin h3{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--vert);margin-bottom:12px}
.chemin .ligne{display:flex;align-items:flex-end;gap:0;min-width:760px}
.chemin .pas{flex:1;text-align:center;position:relative;padding-top:6px}
.chemin .pas::before{content:"";position:absolute;top:18px;left:0;right:0;height:2px;background:var(--bord)}
.chemin .pas:first-child::before{left:50%}.chemin .pas:last-child::before{right:50%}
.chemin .pt{width:26px;height:26px;border-radius:50%;background:var(--vert-pale);border:2px solid var(--bord);color:var(--vert);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;margin:0 auto;position:relative;z-index:1}
.chemin .pas.actif .pt{background:var(--or);border-color:var(--or);color:#fff}
.chemin .pas small{display:block;font-size:10px;color:var(--gris);margin-top:6px;line-height:1.25}
.chemin .pas.actif small{color:var(--or);font-weight:600}

/* ---------- Barre outils ---------- */
.outils{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.outils input[type=search]{flex:1;min-width:170px;padding:9px 12px;border:1px solid var(--bord);border-radius:10px;background:var(--carte)}
.outils select{padding:9px 12px;border:1px solid var(--bord);border-radius:10px;background:var(--carte)}
.btn{background:var(--vert);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--vert-fonce)}
.btn.or{background:var(--or)}.btn.or:hover{background:#7E641F}
.btn.doux{background:var(--vert-pale);color:var(--vert)}
.btn.mini{padding:4px 9px;font-size:12px;border-radius:8px}
.btn.rouge{background:#F6E7E4;color:var(--rouge)}

/* ---------- Tables ---------- */
.panneau{background:var(--carte);border:1px solid var(--bord);border-radius:12px;box-shadow:var(--ombre);overflow:hidden}
.defile{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:var(--vert);color:#fff;text-align:left;padding:9px 12px;font-weight:600;white-space:nowrap;font-size:12px;letter-spacing:.02em}
td{padding:8px 12px;border-top:1px solid var(--bord);vertical-align:top}
tr:nth-child(even) td{background:#FAFBF9}
td.code{font-family:'DM Mono',monospace;font-size:12px;color:var(--or);font-weight:500;white-space:nowrap}
td .acts{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-vert{background:#E3F1E8;color:var(--ok)}.p-or{background:#F5EBD4;color:var(--or)}
.p-gris{background:#EEF1EE;color:var(--gris)}.p-rouge{background:#F6E7E4;color:var(--rouge)}
.p-ambre{background:#F7EEDD;color:var(--ambre)}
.vide{padding:34px;text-align:center;color:var(--gris)}
.vide b{display:block;color:var(--vert);font-size:15px;margin-bottom:4px}

/* ---------- Modale ---------- */
.voile{position:fixed;inset:0;background:rgba(14,42,32,.45);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:30px 14px;overflow-y:auto}
.voile.on{display:flex}
.modale{background:var(--carte);border-radius:14px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modale.large{max-width:940px}
.modale header{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bord)}
.modale header h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--vert)}
.modale header button{background:none;border:none;font-size:20px;color:var(--gris)}
.modale .corps{padding:18px 20px;display:grid;gap:12px;grid-template-columns:1fr 1fr}
.champ{display:flex;flex-direction:column;gap:4px}
.champ.large{grid-column:1/-1}
.champ label{font-size:11.5px;font-weight:600;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.champ input,.champ select,.champ textarea{padding:9px 11px;border:1px solid var(--bord);border-radius:9px;background:#FDFDFC}
.champ textarea{min-height:64px;resize:vertical}
/* ---------- Assistant (Wizard) ---------- */
.assistant{background:var(--carte);border-radius:14px;max-width:680px;margin:0 auto;box-shadow:var(--ombre)}
.assist-barre{display:flex;gap:4px;padding:16px 20px 0}
.assist-pas{flex:1;height:5px;border-radius:3px;background:var(--bord)}
.assist-pas.fait{background:var(--vert)}
.assist-pas.actif{background:var(--or)}
.assist-etapes{display:flex;justify-content:space-between;padding:8px 20px 0;font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.05em}
.assist-etapes span{flex:1;text-align:center}
.assist-etapes span.actif{color:var(--vert);font-weight:700}
.assist-corps{padding:22px 24px;min-height:260px}
.assist-corps h3{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--vert);margin-bottom:4px}
.assist-corps .sous{font-size:12px;color:var(--gris);margin-bottom:16px}
.assist-grille{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.assist-pied{display:flex;justify-content:space-between;align-items:center;padding:14px 24px;border-top:1px solid var(--bord)}
.assist-err{background:#F6E7E4;color:var(--rouge);border-radius:8px;padding:8px 12px;font-size:12.5px;margin-top:8px}
.aide-champ{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:var(--bord);color:var(--gris);font-size:10px;font-weight:700;margin-left:5px;cursor:help;position:relative}
.aide-champ .bulle{display:none;position:absolute;bottom:20px;left:0;background:var(--vert-fonce);color:#fff;padding:8px 10px;border-radius:8px;font-size:11.5px;font-weight:400;text-transform:none;letter-spacing:0;width:220px;z-index:20;line-height:1.4;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.aide-champ:hover .bulle{display:block}
.champ label{display:flex;align-items:center}
.champ .btn-info{border:none;background:none;color:var(--or);font-size:11px;font-weight:700;cursor:pointer;margin-left:6px;text-decoration:underline}
.banniere-brouillon{background:#FBF6E9;border:1px solid #E9D9A6;border-radius:10px;padding:12px 16px;margin-bottom:14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pastille-doublon{background:#FBEDEA;border:1px solid #EBC5BC;border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:13px}
.modale footer{padding:14px 20px;border-top:1px solid var(--bord);display:flex;justify-content:flex-end;gap:10px}

/* ---------- Notifications / audit / divers ---------- */
.liste-notif{display:flex;flex-direction:column}
.notif{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--bord);align-items:flex-start}
.notif:first-child{border-top:none}
.notif.nonlu{background:#FBF6E9}
.notif .pt-n{width:9px;height:9px;border-radius:50%;background:var(--or);margin-top:6px;flex-shrink:0}
.notif.lu .pt-n{background:var(--bord)}
.notif .qui{font-size:11.5px;color:var(--gris)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--vert-fonce);color:#fff;padding:11px 20px;border-radius:10px;box-shadow:var(--ombre);z-index:200;display:none;font-size:13.5px}
.deux-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
h3.titre-sec{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--vert);margin:0 0 10px}
.note-verrou{padding:40px;text-align:center;color:var(--gris)}
.note-verrou b{display:block;font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--vert);margin-bottom:6px}

/* ---------- Connexion & utilisateurs ---------- */
#ecranLogin{position:fixed;inset:0;background:linear-gradient(150deg,var(--vert-fonce),var(--vert-nuit));display:flex;align-items:center;justify-content:center;z-index:500;padding:16px}
.carte-login{background:var(--carte);border-radius:16px;padding:34px 34px 28px;width:100%;max-width:400px;box-shadow:0 24px 70px rgba(0,0,0,.4)}
.carte-login h1{font-family:'Cormorant Garamond',serif;font-size:40px;color:var(--vert);text-align:center}
.carte-login h1 span{color:var(--or)}
.carte-login .sous{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris);text-align:center;margin:2px 0 22px}
.carte-login .champ{margin-bottom:14px}
.carte-login .btn{width:100%;padding:11px;font-size:14.5px;margin-top:4px}
.login-err{background:#F6E7E4;color:var(--rouge);border-radius:9px;padding:9px 12px;font-size:12.5px;margin-bottom:12px;display:none}
.login-note{font-size:11.5px;color:var(--gris);text-align:center;margin-top:16px;line-height:1.5}
.grille-cases{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;border:1px solid var(--bord);border-radius:9px;padding:10px;background:#FDFDFC;max-height:170px;overflow-y:auto}
.grille-cases label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;color:var(--encre);text-transform:none;letter-spacing:0}
.badge-user{display:flex;align-items:center;gap:9px;background:var(--carte);border:1px solid var(--bord);border-radius:10px;padding:6px 12px;box-shadow:var(--ombre)}
.badge-user .rond{width:30px;height:30px;border-radius:50%;background:var(--vert);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.badge-user b{font-size:13px;color:var(--vert);display:block;line-height:1.1}
.badge-user small{font-size:10.5px;color:var(--gris)}
.agenda-jour{margin-bottom:14px}
.agenda-jour h4{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--vert);margin-bottom:6px}

/* ---------- Recherche globale ---------- */
.gsearch{width:210px;padding:9px 12px;border:1px solid var(--bord);border-radius:10px;background:var(--carte);box-shadow:var(--ombre)}
.res-grp{margin-bottom:16px}
.res-grp h3{font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--vert);margin-bottom:8px}

/* ---------- Fiches ---------- */
.fiche-grille{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.bloc-fiche{background:var(--carte);border:1px solid var(--bord);border-radius:12px;box-shadow:var(--ombre);overflow:hidden}
.bloc-fiche.large{grid-column:1/-1}
.bloc-fiche h4{font-family:'Cormorant Garamond',serif;font-size:18px;color:var(--vert);padding:12px 16px;border-bottom:1px solid var(--bord);background:#FBFCFA}
.kv{display:grid;grid-template-columns:170px 1fr;font-size:13px}
.kv div{padding:8px 16px;border-top:1px solid var(--bord)}
.kv div:nth-child(-n+2){border-top:none}
.kv div:nth-child(odd){color:var(--gris);font-weight:600;background:#FBFCFA}
a.lien{color:var(--vert);font-weight:600;text-decoration:none;border-bottom:1px dotted var(--or)}
a.lien:hover{color:var(--or)}
td.code a{color:inherit;text-decoration:none;border-bottom:1px dotted var(--or)}
.entete-impression{display:none}
.sauve-info{font-size:10.5px;color:#8FAE9D;text-align:center;padding:6px 10px 10px}

@media print{
  aside,.top,.outils,.btn,.cloche,.burger,.acts,.toast{display:none!important}
  main{margin:0!important;padding:0!important}
  body{background:#fff}
  .bloc-fiche,.panneau,.chemin{box-shadow:none;border:1px solid #ccc;break-inside:avoid}
  .fiche-grille{display:block}
  .bloc-fiche{margin-bottom:12px}
  .entete-impression{display:block;text-align:center;margin-bottom:14px}
  .entete-impression b{font-family:'Cormorant Garamond',serif;font-size:24px;color:var(--vert)}
  .entete-impression small{display:block;color:#777}
}

@media(max-width:900px){
  .gsearch{width:100%;order:9}
  aside{transform:translateX(-100%)}
  aside.ouvert{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  main{margin-left:0;padding:14px 12px 60px}
  .burger{display:block}
  .modale .corps{grid-template-columns:1fr}
  .deux-col{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<aside id="aside">
  <div class="logo"><h1>UB<span>O</span>S</h1><small>ULTEx Business Operating System</small></div>
  <nav id="nav"></nav>
  <div class="aside-pied">
    <button onclick="exporterJSON()" title="Télécharger la sauvegarde complète (JSON)">⭳ Télécharger sauvegarde</button>
    <button onclick="document.getElementById('fimport').click()" title="Restaurer une sauvegarde JSON">⭱ Restaurer</button>
    <input type="file" id="fimport" accept=".json" style="display:none" onchange="importerJSON(this)">
  </div>
  <div class="sauve-info" id="sauveInfo">Sauvegarde automatique active</div>
</aside>
<main id="main"></main>
</div>
<div class="voile" id="voile"><div class="modale" id="modale"></div></div>
<div class="toast" id="toast"></div>
<div id="ecranLogin" style="display:none">
  <div class="carte-login">
    <h1>UB<span>O</span>S</h1>
    <div class="sous">ULTEx Business Operating System</div>
    <div class="login-err" id="loginErr"></div>
    <div class="champ"><label>Identifiant</label><input id="logId" autocomplete="username" onkeydown="if(event.key==='Enter')document.getElementById('logMdp').focus()"></div>
    <div class="champ"><label>Mot de passe</label><input id="logMdp" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')connecter()"></div>
    <button class="btn" onclick="connecter()">Se connecter</button>
    <div class="login-note" id="loginNote"></div>
  </div>
</div>

<script>
"use strict";
/* ================= UBOS — MVP monofichier ================= */

const ETAPES = ["Sourcing","Études & Chiffrage","Closing","Paiement","Analyse Dossier","Transport","Transit & Douane","Certification","Livraison","Suivi Client","Clôturé"];
const SERVICE_ETAPE = {"Sourcing":"Sourcing","Études & Chiffrage":"Études & Chiffrage","Closing":"Closing","Paiement":"Finance","Analyse Dossier":"Analyse Dossiers","Transport":"Transport","Transit & Douane":"Transit & Douane","Certification":"Analyse Dossiers","Livraison":"Transport","Suivi Client":"Suivi Client","Clôturé":"Direction"};
const USERS = ["Direction","Data","Sourcing","Études & Chiffrage","Closing","Finance","Analyse Dossiers","Transport","Transit & Douane","Suivi Client","Digital"];
function PERSONNES(){ return (DB.utilisateurs||[]).filter(u=>u.actif).map(u=>u.nomComplet); }
function PERS_ET_SERVICES(){ return PERSONNES().concat(USERS.filter(s=>!PERSONNES().includes(s))); }

const CLE = "ubos_mvp_v1";
let DB = charger();
/* ---------- Utilisateurs & session ---------- */
if(!DB.utilisateurs) DB.utilisateurs = [];
if(DB.utilisateurs.length <= 1){
  const P_BASE = {voir:1,ajouter:1,modifier:1};
  const P_VALID = {voir:1,ajouter:1,modifier:1,valider:1};
  const MODELES = [
    ["Oumaima","oumaima","Gérante","Direction",["Direction"],[],{voir:1,ajouter:1,modifier:1,supprimer:1,valider:1,exporter:1}],
    ["Imane","imane","Transport international & Études","Opérations Internationales",["Transport","Études & Chiffrage"],["transports","transportsNat","etudes","documents","taches","dossiers"],P_BASE],
    ["Mansouri","mansouri","Closing & Suivi Client","Commercial",["Closing","Suivi Client"],["offres","reclamations","clients","dossiers","taches","documents"],P_VALID],
    ["Ouiam","ouiam","Data & Demandes","Commercial",["Data"],["demandes","clients","contacts","dossiers","taches"],P_VALID],
    ["Zoubida","zoubida","Analyse, Transit & Certification","Opérations Internationales",["Analyse Dossiers","Transit & Douane"],["analyses","transits","certifs","documents","dossiers","taches"],P_VALID],
    ["Yasser","yasser","Sourcing & PortNet","Études Commerciales",["Sourcing","Transit & Douane"],["sourcings","fournisseurs","produits","transits","documents","dossiers","taches"],P_BASE],
    ["Mohammed Digital","mohammed","Digital","Digital",["Digital","Data"],["leads","taches"],P_BASE],
    ["Nisrine","nisrine","Documents & Stockage","Administration",[],["documents","stockage","taches","dossiers"],P_BASE]
  ];
  MODELES.forEach(m=>{
    if(!DB.utilisateurs.some(u=>u.identifiant===m[1])){
      DB.seq["USR"] = Math.max(DB.seq["USR"]||0, DB.utilisateurs.length) + 1;
      DB.utilisateurs.push({code:"USR"+String(DB.seq["USR"]).padStart(6,"0"), nomComplet:m[0], identifiant:m[1], motDePasse:"ubos2026",
        poste:m[2], departement:m[3], services:m[4], modules:m[5], permissions:m[6], actif:true, ts:Date.now()});
    }
  });
}

function migrerEtapesDossiers(){
  if(DB._migrationEtapesFaite) return;

  DB.dossiers.forEach(d=>{
    if(d.etape==="Lead / Data"){
      audit("Dossiers","Migration étape (Lead / Data supprimée du workflow)",d.code,"etape","Lead / Data","Sourcing",d.code);
      d.etape = "Sourcing";
      n++;
    }
  });
  const ouiam = DB.utilisateurs.find(u=>u.identifiant==="ouiam");
  if(ouiam){
    if(ouiam.poste==="Data & Leads"){ audit("Utilisateurs","Poste mis à jour",ouiam.code,"poste","Data & Leads","Data & Demandes"); ouiam.poste = "Data & Demandes"; n++; }
    if((ouiam.modules||[]).includes("leads")){ audit("Utilisateurs","Modules mis à jour",ouiam.code,"modules","leads","demandes"); ouiam.modules = ouiam.modules.filter(m=>m!=="leads").concat(ouiam.modules.includes("demandes")?[]:["demandes"]); n++; }
  }
  DB._migrationEtapesFaite = true;
  if(n) sauver();
}
function migrerAnciensLeads(){
  if(DB._migrationLeadsFaite) return;
  if(!DB.leads || !DB.leads.length){ DB._migrationLeadsFaite = true; return; }
  let n = 0;
  DB.leads.forEach(l=>{
    if(l._migre) return;
    let ct = DB.contacts.find(c=>c.telephone && l.telephone && normTel(c.telephone)===normTel(l.telephone));
    if(!ct){
      ct = {code:genCode("CT"), nom:l.nom||l.telephone||"Contact historique", telephone:l.telephone, source:l.source||"Migration Leads",
        statut:"Nouveau", remarque:"Donnée historique migrée — ancien lead "+l.code, ancienCodeLead:l.code, par:"Migration automatique", ts:l.ts||Date.now()};
      DB.contacts.push(ct);
    }
    if(l.client){
      const cl = DB.clients.find(c=>c.code===l.client);
      if(cl && !ct.codeClientAssocie) ct.codeClientAssocie = cl.code;
    }
    const dm = {code:genCode("DMD"), client:l.client||"", dateDemande:(l.ts?new Date(l.ts):new Date()).toISOString().slice(0,10),
      responsableData:"Migration automatique", source:l.source||"Migration Leads", objectifGeneral:"Donnée historique migrée — ancien lead "+l.code,
      urgence:"Normale", statut:l.statut==="Qualifié"?"Confirmée":"En cours d'étude",
      remarqueGenerale:"Migré automatiquement depuis l'ancien module Leads / Data. Ancien code : "+l.code, migrationHistorique:true, ancienCodeLead:l.code,
      lignes:[], _seqLigne:0, par:"Migration automatique", ts:l.ts||Date.now()};
    dm.lignes.push({id:"dl1_"+dm.code, code:genCodeLigneDemande(dm.code, dm), produitService:(l.besoin||"Besoin non précisé").slice(0,200),

      statutConfirmation:l.statut==="Qualifié"?"Confirmée":"Non confirmée", ts:l.ts||Date.now()});
    DB.demandes.push(dm);

function genCode(pfx){
  const annee = new Date().getFullYear();
  const avecAnnee = PFX_ANNEE.includes(pfx);
  const cle = avecAnnee ? pfx+annee : pfx;
  let code;
  do{
    DB.seq[cle] = (DB.seq[cle]||0) + 1;
    const n = String(DB.seq[cle]).padStart(6,"0");
    code = avecAnnee ? `${pfx}${annee}-${n}` : pfx + n;
  } while(codeExiste(code));
  return code;
}

function changerCode(ancien, nouveau){
  // Propager le nouveau code dans toutes les références liées
  const refs = ["dossier","client","fournisseur"];
  for(const c of COLLS){
    for(const o of (DB[c]||[])){
      for(const r of refs){
        if(o[r] === ancien){
          o[r] = nouveau;
          audit(MODS_PAR_COLL[c]||c,"Modification (propagation code)",o.code,r,ancien,nouveau, o.dossier);
        }
      }
    }
  }
}

/* ---------- Audit ---------- */
function audit(module, action, objet, champ, avant, apres, dossier){
  const t = new Date();
  if(!dossier && /^DOS\d{4}-/.test(String(objet||""))) dossier = objet;
  DB.audit.unshift({
    date: t.toLocaleDateString("fr-FR"), heure: t.toLocaleTimeString("fr-FR"),
    utilisateur: userCourant, module, action, objet: objet||"—",
    champ: champ||"—", avant: (avant===undefined||avant==="")?"—":String(avant),
    apres: (apres===undefined||apres==="")?"—":String(apres),
    dossier: dossier||"—", ts: t.getTime()
  });
  if(DB.audit.length > 20000) DB.audit.length = 20000;
}
/* ---------- Mentions @collègue ---------- */
function detecterMentions(texte, contexte){
  if(!texte || !texte.includes("@")) return;
  const cibles = new Set();
  for(const u of (DB.utilisateurs||[])){
    if(u.nomComplet!==userCourant && (texte.includes("@"+u.nomComplet) || texte.includes("@"+u.identifiant))) cibles.add(u.nomComplet);
  }
  for(const s of USERS){ if(texte.includes("@"+s)) cibles.add(s); }
  cibles.forEach(c=>notifier(c, `${userCourant} vous a mentionné${contexte?" sur "+contexte:""} : « ${texte.slice(0,140)} »`, "Mention"));
}

function pillStatut(s){
  const ok=["Payé","Validée","Validé","Acceptée","Qualifié","Terminée","Livré","Livraison","Clôturé","Actif","Émis"];
  const bad=["En retard","Rejeté","Perdue","Bloqué","Blacklisté","Non qualifié","Suspendu","Annulé"];
  const amb=["En attente","Prévu","En vérification","En cours","Négociation","Nouveau","À faire","En transit","En évaluation","Contacté"];
  if(ok.includes(s)) return pill(s,"p-vert");
  if(bad.includes(s)) return pill(s,"p-rouge");
  if(amb.includes(s)) return pill(s,"p-ambre");
  return pill(s||"—","p-gris");
}

function apercuPossible(url){ return url && /\.(pdf|jpg|jpeg|png|webp|gif)(\?|$)/i.test(url); }
function peutVoirDocument(doc){
  if(estDirection()) return true;
  if(!doc.confidentialite || doc.confidentialite.startsWith("Public")) return true;
  if(doc.confidentialite.startsWith("Finance")) return (SESSION.services||[]).includes("Finance");
  if(doc.confidentialite==="Juridique restreint") return false;
  return false; // "Direction uniquement"
}
function labelObjet(type){
  return {dossier:"Dossier", demande:"Demande", arrivage:"Arrivage", commande:"Commande", client:"Client", tache:"Tâche", reclamation:"Réclamation", document:"Document"}[type] || type;
}
function ficheHashPour(objetType, objetCode){
  const map = {dossier:"ficheDossier", demande:"ficheDemande", arrivage:"ficheArrivage", commande:"ficheCommande", client:"ficheClient", document:"ficheDocument"};
  return map[objetType] ? map[objetType]+":"+objetCode : "";
}

 avantSauve:o=>{
   const fob=+o.fob||0, fret=+o.fret||0, port=+o.fraisPort||0, tn=+o.transportNat||0;
   const droits=(fob+fret)*((+o.droitsPct||0)/100);
   const tva=(fob+fret+droits)*((+o.tvaPct||0)/100);
   o.coutTotal=Math.round(fob+fret+droits+tva+port+tn);
   o.marge=Math.round((+o.prixVente||0)-o.coutTotal);
   o.margePct=o.prixVente? Math.round(o.marge/(+o.prixVente)*1000)/10 : 0;
 },

function qualifierLead(code){
  if(!peut("valider")){ toast("Permission refusée : la qualification exige le droit Valider."); return; }
  const l = DB.leads.find(x=>x.code===code); if(!l) return;
  if(l.statut==="Qualifié"){ toast("Ce lead a déjà été converti."); return; }
  l.statut = "Qualifié";
  let ct = DB.contacts.find(c=>c.telephone && l.telephone && normTel(c.telephone)===normTel(l.telephone));
  if(!ct){
    ct = {code:genCode("CT"), nom:l.nom||l.telephone||"Contact", telephone:l.telephone, source:l.source||"Leads / Data",
      statut:"Nouveau", remarque:"Converti depuis l'archive Leads / Data ("+l.code+")", ancienCodeLead:l.code, par:userCourant, ts:Date.now()};
    DB.contacts.push(ct);
    audit("Contacts","Création",ct.code,"—","—",l.nom);
  }
  let cl = DB.clients.find(c => c.telephone && l.telephone && normTel(c.telephone)===normTel(l.telephone));
  if(!cl){
    cl = {code: genCode("C"), nom: l.nom, telephone: l.telephone, segment:"Prospect", remarque:"Converti depuis le contact "+ct.code, ts: Date.now()};
    DB.clients.push(cl);
    audit("Clients","Création",cl.code,"—","—", l.nom);
  }
  ct.codeClientAssocie = cl.code;
  const dm = {code:genCode("DMD"), client:cl.code, dateDemande:new Date().toISOString().slice(0,10), responsableData:userCourant,
    source:l.source||"Leads / Data", objectifGeneral:"Converti depuis l'archive Leads / Data ("+l.code+")", urgence:"Normale",
    statut:"En cours d'étude", remarqueGenerale:"Contact d'origine : "+ct.code, ancienCodeLead:l.code,
    lignes:[], _seqLigne:0, par:userCourant, ts:Date.now()};
  dm.lignes.push({id:"dl1_"+dm.code, code:genCodeLigneDemande(dm.code, dm), produitService:(l.besoin||"Besoin à préciser").slice(0,200),
    statut:"Nouvelle", route:[], fournisseurConnu:"Non", proformaDisponible:"Non", consultationsFournisseurs:[], selection:null,
    statutConfirmation:"Non confirmée", ts:Date.now()});
  DB.demandes.push(dm);
  l.demande = dm.code;
  audit("Leads / Data","Converti en Contact + Demande",l.code,"statut","—","Contact "+ct.code+" · Client "+cl.code+" · Demande "+dm.code);
  audit("Demandes","Création",dm.code,"—","—","Depuis lead archivé "+l.code);
  notifier("Data", `Lead ${l.code} converti → Contact ${ct.code}, Client ${cl.code}, Demande ${dm.code}. Un dossier pourra être créé une fois la demande confirmée en commande.`, "Leads / Data");
  sauver(); rendre(); location.hash="ficheDemande:"+dm.code;
  toast(`Converti : ${ct.code} · ${cl.code} · ${dm.code}`);
}
function avancerDossier(code){
  if(!peut("valider")){ toast("Permission refusée : la validation d'étape ne vous est pas autorisée."); return; }
  const d = DB.dossiers.find(x=>x.code===code); if(!d) return;
  const i = ETAPES.indexOf(d.etape);
  if(i >= ETAPES.length-1) return;
  const av = d.etape; d.etape = ETAPES[i+1];
  if(d.etape==="Clôturé") d.statut = d.statut==="Actif" ? "Livré" : d.statut;
  audit("Dossiers","Transfert d'étape",d.code,"etape",av,d.etape);
  // Action suivante réinitialisée automatiquement à chaque transfert
  const avAction = d.actionSuivante;
  d.actionSuivante = "À définir — étape "+d.etape;
  d.respActionSuivante = d.responsable || SERVICE_ETAPE[d.etape] || "";
  d.echeanceActionSuivante = new Date(Date.now()+2*864e5).toISOString().slice(0,10);
  audit("Dossiers","Modification",d.code,"actionSuivante",avAction||"—",d.actionSuivante);
  const svc = SERVICE_ETAPE[d.etape];
  if(svc) notifier(svc, `Dossier ${d.code} transféré à l'étape « ${d.etape} ».`, "Dossiers");
  if(d.respActionSuivante && d.respActionSuivante!==svc) notifier(d.respActionSuivante, `Action suivante à définir sur ${d.code} (étape ${d.etape}) — échéance ${d.echeanceActionSuivante}.`, "Dossiers");
  sauver(); rendre(); toast(`${d.code} → ${d.etape}`);
}

  } else if(f.t==="ref"){

      <select id="f__modeCode" onchange="document.getElementById('boiteCodeManuel').style.display=this.value==='Manuel'?'flex':'none'">

function fermer(){ document.getElementById("voile").classList.remove("on"); document.getElementById("modale").classList.remove("large"); }
function sauverForm(modId, code){
  const M = MODS[modId];
  if(code && !peut("modifier")){ toast("Permission refusée : modification non autorisée."); return; }
  if(!code && !peut("ajouter")){ toast("Permission refusée : ajout non autorisé."); return; }
  const nouv = {};
  for(const f of M.champs){
    const el = document.getElementById("f_"+f.k);
    nouv[f.k] = el ? el.value.trim() : "";
    if(f.req && !nouv[f.k]){ toast("Champ obligatoire : "+f.l); return; }
  }
  if(modId==="clients" && !code){
    const matches = rechercherDoublonsClient(nouv);
    if(matches.length){ PENDING_CLIENT_NOUV = nouv; afficherChoixDoublon(modId, matches); return; }
  }
  if(modId==="documents" && nouv.url && nouv.url.length>2000){
    toast("⚠ Le champ URL est trop volumineux (>2000 caractères) — UBOS ne stocke pas de fichier en base64. Utilisez un lien (Drive/OneDrive/Dropbox) plutôt qu'un fichier collé directement.");
    return;
  }
  if(modId==="arrivages" && code && nouv.statut==="Clôturé"){
    const arr = DB.arrivages.find(x=>x.code===code);
    if(arr && arr.statut!=="Clôturé"){
      const pb = verifierClotureArrivage(arr);
      if(pb.length){ afficherBlocageClotureArrivage(code, pb); return; }
    }
  }
  if(modId==="arrivages"){
    for(const k of ["transitaire","transporteur","compagnie","agentDestination"]){
      if(nouv[k] && !peutSelectionnerPartenaire(nouv[k])){
        const p = DB.partenaires.find(x=>x.code===nouv[k]);
        toast("⛔ "+(p?p.nom:nouv[k])+" est "+(p?p.statut.toLowerCase():"restreint")+" — sélection réservée à la Direction.");
        return;
      }
    }
  }
  if(M.avantSauve && M.avantSauve(nouv) === false) return;
  const doss = nouv.dossier || (modId==="dossiers" ? (code||"") : "");
  if(code){
    const obj = DB[M.coll].find(x=>x.code===code);
    const ancien = Object.assign({}, obj);
    // Changement de code : réservé à la Direction, unicité vérifiée, références propagées
    const elCode = document.getElementById("f__code");
    if(elCode && !elCode.disabled && estDirection()){
      const nc = elCode.value.trim();
      if(!nc){ toast("Le code ne peut pas être vide."); return; }
      if(nc !== code){
        if(codeExiste(nc)){ toast("Le code "+nc+" existe déjà."); return; }
        audit(M.label,"Changement de code",code,"code",code,nc, modId==="dossiers"? nc : obj.dossier);
        obj.code = nc;
        changerCode(code, nc);
        code = nc;
      }
    }
    for(const k in nouv){
      if(String(obj[k]??"") !== String(nouv[k]??"")){
        audit(M.label,"Modification",obj.code, k, obj[k], nouv[k], doss||obj.dossier);
      }
      obj[k] = nouv[k];
    }
    if(M.apresSauve) M.apresSauve(obj, ancien);
    toast(obj.code+" mis à jour");
  } else {
    // Code automatique ou manuel
    const mode = document.getElementById("f__modeCode");
    if(mode && mode.value === "Manuel"){
      const mc = (document.getElementById("f__code").value||"").trim();
      if(!mc){ toast("Saisissez le code manuel."); return; }
      if(codeExiste(mc)){ toast("Le code "+mc+" existe déjà — il doit être unique."); return; }
      nouv.code = mc;
      nouv.codeManuel = true;
    } else {
      nouv.code = genCode(M.pfx);
    }
    nouv.ts = Date.now(); nouv.par = userCourant;
    DB[M.coll].push(nouv);
    audit(M.label,"Création",nouv.code, nouv.codeManuel?"code":"—", "—", nouv.codeManuel? "code manuel" : (M.champs[0]? String(nouv[M.champs[0].k]||"") : ""), modId==="dossiers"? nouv.code : doss);
    if(M.apresSauve) M.apresSauve(nouv, null);
    toast(nouv.code+" créé");
  }
  for(const f of M.champs){ if(f.t==="textarea") detecterMentions(nouv[f.k], (code||nouv.code)); }
  sauver(); fermer(); rendre();
}
function supprimer(modId, code){
  if(!peut("supprimer")){ toast("Permission refusée : suppression réservée."); return; }
  if(modId==="documents"){ archiverDocument(code); return; }
  const M = MODS[modId];
  const obj = DB[M.coll].find(x=>x.code===code); if(!obj) return;
  if(!confirm(`Supprimer ${code} ?\nL'action restera visible dans le journal d'audit.`)) return;
  DB[M.coll] = DB[M.coll].filter(x=>x.code!==code);
  audit(M.label,"Suppression",code,"—", M.champs && obj[M.champs[0].k] || code, "supprimé");
  sauver(); rendre(); toast(code+" supprimé");
}

/* ---------- Export Excel / CSV ---------- */
function exporterCSV(modId){
  if(!peut("exporter")){ toast("Permission refusée : export non autorisé."); return; }
  const M = MODS[modId];
  let lignes = DB[M.coll].slice().sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(recherche){ const q=recherche.toLowerCase(); lignes = lignes.filter(o=>Object.values(o).some(v=>String(v??"").toLowerCase().includes(q))); }
  if(filtreStatut && M.statut) lignes = lignes.filter(o=>o[M.statut]===filtreStatut);
  const sep = ";";
  const q = v => `"${String(v??"").replace(/"/g,'""').replace(/\r?\n/g," ")}"`;
  let csv = "\uFEFF" + ["Code"].concat(M.champs.map(f=>f.l)).map(q).join(sep) + "\n";
  for(const o of lignes){
    csv += [o.code].concat(M.champs.map(f=>{
      if(f.t==="ref" && o[f.k]) return refLabel(f.coll, o[f.k], f.cle);
      return o[f.k];
    })).map(q).join(sep) + "\n";
  }
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ubos_"+modId+"_"+new Date().toISOString().slice(0,10)+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  audit(M.label,"Export CSV", lignes.length+" lignes","—","—","fichier téléchargé");
  sauver(); toast("Export CSV téléchargé ("+lignes.length+" lignes)");
}

  if(vue==="rechercheGlobale") rendre(); else location.hash = "rechercheGlobale";
}

function rendreRechercheGlobale(){
  let h = topbar("Recherche globale");
  const q = termeGlobal.toLowerCase();
  if(!q){ h += `<div class="panneau"><div class="vide"><b>Recherche globale</b>Tapez un terme en haut de page puis Entrée : clients, dossiers, paiements, documents… tout est parcouru.</div></div>`; document.getElementById("main").innerHTML=h; return; }
  let total = 0, corps = "";
  for(const id in MODS){
    const M = MODS[id];
    if(!M.coll) continue;
    const res = DB[M.coll].filter(o => Object.values(o).some(v => String(v??"").toLowerCase().includes(q)));
    if(!res.length) continue;
    total += res.length;
    corps += `<div class="res-grp"><h3>${esc(M.label)} — ${res.length} résultat${res.length>1?"s":""}</h3>
      <div class="panneau"><div class="defile"><table><tr><th>Code</th><th>Résumé</th><th></th></tr>` +
      res.slice(0,12).map(o=>{
        const resume = M.champs.slice(0,3).map(f=>o[f.k]).filter(Boolean).join(" · ").slice(0,90);
        const lien = M.fiche ? `<a href="#${M.fiche}:${esc(o.code)}">${esc(o.code)}</a>` : esc(o.code);
        return `<tr><td class="code">${lien}</td><td>${esc(resume)||"—"}</td><td><button class="btn mini doux" onclick="ouvrirModuleAvecRecherche('${id}')">Ouvrir dans ${esc(M.label)}</button></td></tr>`;
      }).join("") + `</table></div></div></div>`;
  }
  h += total ? `<p style="color:var(--gris);margin-bottom:14px">${total} résultat${total>1?"s":""} pour « ${esc(termeGlobal)} »</p>` + corps
             : `<div class="panneau"><div class="vide"><b>Aucun résultat</b>Rien ne correspond à « ${esc(termeGlobal)} » dans les ${Object.values(MODS).filter(m=>m.coll).length} modules.</div></div>`;
  document.getElementById("main").innerHTML = h;
}

/* --- Scores automatiques (calcul en direct, non stocké) --- */
function calculerScoresClient(c){
  const doss = DB.dossiers.filter(d=>d.client===c.code);
  const fs2 = DB.facturesFinales.filter(f=>f.client===c.code);
  const calc = fs2.map(f=>calculFF(f));
  const impayesOuverts = DB.impayes.filter(i=>i.client===c.code && i.statut!=="Clos");
  const reclamations = DB.reclamations.filter(r=>r.client===c.code);
  const abandons = DB.abandons.filter(a=>a.client===c.code);
  const ca = doss.reduce((s,d)=>s+(+d.montantVente||0),0);
  const anneesRelation = c.ts ? Math.max(1,(Date.now()-c.ts)/(365*864e5)) : 1;
  const clamp = v => Math.max(0, Math.min(100, Math.round(v)));
  const fidelite = clamp(20 + doss.length*12 + Math.min(anneesRelation,10)*4);
  const retardsMoy = calc.length ? calc.reduce((s,x)=>s+Math.max(0,x.joursRetard),0)/calc.length : 0;
  const financier = clamp(90 - retardsMoy*1.5 - impayesOuverts.length*20 - abandons.length*15);
  const confiance = clamp((financier*0.5) + (reclamations.length?Math.max(0,20-reclamations.length*8):20) + (doss.length?15:0));
  const potentiel = clamp((Math.log10((ca||1)+1))*22 + (+c.caEstime>0?10:0) + (c.niveauImport==="Professionnel"?10:0));
  const commSets = ["communicationPreferee","langue","heurePreferee"].filter(k=>c[k]);
  const communication = clamp(30 + commSets.length*20 + (doss.length?15:0));
  const satisfactionMap = {"Excellente":95,"Bonne":75,"Moyenne":50,"Faible":25};
  const satisfaction = clamp(satisfactionMap[c.satisfactionClient] ?? (reclamations.length? Math.max(20,60-reclamations.length*15) : 65));
  const risque = clamp(100 - financier*0.6 - (impayesOuverts.length?25:0) - (abandons.length?20:0) + (reclamations.length*5));
  const croissance = clamp((doss.length>=2? Math.min(40,doss.length*6):10) + (c.projetFutur?20:0) + (c.frequenceAchat==="Récurrent (mensuel+)"?25:c.frequenceAchat==="Régulier"?15:5));
  return {fidelite, financier, confiance, potentiel, communication, satisfaction, risque, croissance,
    global: clamp((fidelite+financier+confiance+potentiel+communication+satisfaction+(100-risque)+croissance)/8)};
}
function barreScore(label, v){
  const coul = v>=70?"var(--ok)":v>=40?"var(--or)":"var(--rouge)";
  return `<div style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:3px"><span>${esc(label)}</span><b>${v}/100</b></div>

}
/* --- Complétude du profil --- */
function calculerCompletude(c){
  const tous = CHAMPS_IDENTITE.concat(CHAMPS_COMMERCIAL, CHAMPS_IMPORT, CHAMPS_COMPORTEMENTAL).filter(f=>f.k!=="segment");
  const remplis = tous.filter(f=>c[f.k]!==undefined && c[f.k]!==null && String(c[f.k]).trim()!=="");
  const pct = Math.round(remplis.length/tous.length*100);
  const manquants = tous.filter(f=>!remplis.includes(f));
  return {pct, total:tous.length, remplis:remplis.length, manquants};
}
/* --- Timeline évolution client --- */
function collecterEvolutionClient(code){
  const evts = [];
  DB.leads.filter(l=>l.client===code).forEach(l=>evts.push({ts:l.ts, type:"Lead / Demande", libelle:(l.besoin||"Demande").slice(0,70), code:l.code}));
  DB.dossiers.filter(d=>d.client===code).forEach(d=>{ evts.push({ts:d.ts, type:"Dossier créé", libelle:d.produit||d.code, code:d.code});
    if(d.etape!=="Lead / Data") evts.push({ts:(d.ts||0)+1, type:"Étape : "+d.etape, libelle:"Dossier "+d.code, code:d.code}); });
  DB.offres.filter(o=>DB.dossiers.some(d=>d.code===o.dossier&&d.client===code)).forEach(o=>evts.push({ts:o.ts, type:"Devis / Offre", libelle:fmtMAD(o.montant)+" — "+(o.statut||""), code:o.code}));
  DB.paiements.filter(p=>DB.dossiers.some(d=>d.code===p.dossier&&d.client===code)).forEach(p=>evts.push({ts:p.ts, type:"Paiement", libelle:(p.nature||"")+" · "+fmtMAD(p.montant)+" · "+(p.statut||""), code:p.code}));
  DB.transportsNat.filter(t=>DB.dossiers.some(d=>d.code===t.dossier&&d.client===code)).forEach(t=>{ if(t.statut==="Livré") evts.push({ts:t.ts, type:"Livraison", libelle:"Livré à "+(t.villeLivraison||""), code:t.code}); });
  DB.reclamations.filter(r=>r.client===code).forEach(r=>evts.push({ts:r.ts, type:"Réclamation", libelle:(r.motif||"").slice(0,60), code:r.code}));
  DB.facturesFinales.filter(f=>f.client===code).forEach(f=>evts.push({ts:f.ts, type:"Facture finale", libelle:f.code, code:f.code}));
  return evts.filter(e=>e.ts).sort((a,b)=>a.ts-b.ts);
}

let PENDING_CLIENT_NOUV = null;
function rechercherDoublonsClient(nouv){
  const tel = normTel(nouv.telephone);
  const nomN = normCol(nouv.nom);
  const matches = [];
  DB.clients.forEach(c=>{
    const raisons = [];
    if(tel && normTel(c.telephone)===tel) raisons.push("Téléphone");
    if(tel && normTel(c.whatsapp)===tel) raisons.push("WhatsApp");
    if(nouv.email && c.email && c.email.toLowerCase()===nouv.email.toLowerCase()) raisons.push("E-mail");
    if(nomN && normCol(c.nom)===nomN) raisons.push("Nom");
    if(nouv.ice && c.ice && nouv.ice===c.ice) raisons.push("ICE");
    if(nouv.rc && c.rc && nouv.rc===c.rc) raisons.push("RC");
    if(nouv.idFiscal && c.idFiscal && nouv.idFiscal===c.idFiscal) raisons.push("IF");
    if(nouv.remarque && c.remarque && String(c.remarque).includes(String(nouv.remarque).slice(0,20)) && nouv.remarque.length>15) raisons.push("Remarque similaire");
    if(raisons.length) matches.push({c, raisons});
  });
  return matches;
}

function resoudreDoublonFusion(codeExistant){
  if(!PENDING_CLIENT_NOUV) return;
  const c = DB.clients.find(x=>x.code===codeExistant); if(!c){ PENDING_CLIENT_NOUV=null; return; }
  const nouv = PENDING_CLIENT_NOUV;
  let n = 0;
  for(const k in nouv){

    if(!c[k] && nouv[k]){ audit("Clients","Fusion — champ complété",c.code,k,c[k]||"—",nouv[k]); c[k] = nouv[k]; n++; }
  }
  audit("Clients","Fusion de doublon",c.code,"fusion","—",n+" champ(s) complété(s) depuis une saisie en double");
  PENDING_CLIENT_NOUV = null;
  sauver(); fermer(); rendre(); vue="ficheClient:"+c.code; location.hash=vue;

/* ---------- Alertes automatiques ---------- */
function dernierAuditTs(code){
  const a = DB.audit.find(x => x.objet===code || x.dossier===code);
  return a ? a.ts : 0;
}
function calculerAlertes(){
  const al = [];
  const now = Date.now();
  const auj = new Date(new Date().toDateString());
  for(const d of DB.dossiers){
    if(d.statut!=="Actif" || d.etape==="Clôturé") continue;
    const t = Math.max(dernierAuditTs(d.code), d.ts||0);
    if(t && now - t > 864e5) al.push(["p-ambre", `Dossier ${d.code} sans action depuis ${Math.floor((now-t)/864e5)} jour(s) — étape ${d.etape}.`, "ficheDossier:"+d.code]);
    if(!d.responsable) al.push(["p-rouge", `Dossier ${d.code} sans responsable désigné.`, "ficheDossier:"+d.code]);
    if(ETAPES.indexOf(d.etape) >= ETAPES.indexOf("Analyse Dossier") && !DB.documents.some(x=>x.dossier===d.code))
      al.push(["p-rouge", `Document manquant : aucun document lié au dossier ${d.code} (étape ${d.etape}).`, "ficheDossier:"+d.code]);
    if(d.etape==="Certification" && !DB.certifs.some(c=>c.dossier===d.code))
      al.push(["p-rouge", `Certification manquante : ${d.code} est à l'étape Certification sans aucune procédure lancée.`, "ficheDossier:"+d.code]);
  }
  for(const dm of DB.demandes){
    if(["Confirmée","Clôturée"].includes(dm.statut)) continue;
    if(!dm.actionSuivante) al.push(["p-ambre", `Demande ${dm.code} sans action suivante définie.`, "ficheDemande:"+dm.code]);
    (dm.lignes||[]).forEach(l=>{
      if(l.statutConfirmation!=="Confirmée" && l.statut!=="Clôturée" && !l.responsable)
        al.push(["p-ambre", `Ligne ${l.code} (${(l.produitService||"").slice(0,30)}) sans responsable — demande ${dm.code}.`, "ficheDemande:"+dm.code]);
    });
  }
  for(const p of DB.paiements){
    const enRetard = p.statut==="En retard" || (["Prévu","En attente"].includes(p.statut) && p.echeance && new Date(p.echeance) < auj);
    if(enRetard) al.push(["p-rouge", `Paiement en retard : ${p.code} (${p.nature||"—"}, ${fmtMAD(p.montant)}) — dossier ${p.dossier||"—"}.`, "paiements"]);
  }
  for(const s of DB.sourcings){
    if(s.statut==="En cours"){
      const t = Math.max(dernierAuditTs(s.code), s.ts||0);
      if(t && now - t > 3*864e5) al.push(["p-ambre", `Fournisseur silencieux : sourcing ${s.code} sans nouvelle depuis ${Math.floor((now-t)/864e5)} jours — dossier ${s.dossier||"—"}.`, "sourcings"]);
    }
  }
  for(const t of DB.transits){
    if(t.franchiseFin && t.etapeDum!=="Sorti du port"){
      const j = Math.ceil((new Date(t.franchiseFin) - now)/864e5);
      if(j<=2) al.push(["p-rouge", `Franchise port ${j<0?"DÉPASSÉE":"J-"+j} : dossier ${t.dossier||"—"} (${t.code}) — surestaries imminentes.`, "transits"]);
    }
  }
  for(const t of DB.taches){
    if(t.statut!=="Terminée" && t.echeance && new Date(t.echeance) < auj)
      al.push(["p-ambre", `Tâche en retard : ${t.code} « ${t.titre} » (${t.assigne||"—"}), échéance ${t.echeance}.`, "taches"]);
  }
  for(const c of DB.certifs){
    if(!["Obtenue"].includes(c.statut) && c.echeance && new Date(c.echeance) < auj)
      al.push(["p-rouge", `Certification ${c.organisme} en dépassement d'échéance (${c.code}) — dossier ${c.dossier||"—"}.`, "certifs"]);
  }
  for(const f of DB.facturesFinales){
    const c = calculFF(f);
    if(c.soldeDu>0.01 && c.joursRetard>0){
      const palier = [30,15,7,3,1].find(p=>c.joursRetard>=p);
      al.push(["p-rouge", `Facture ${f.code} impayée J+${c.joursRetard} (palier J+${palier}) : ${fmtMAD(Math.round(c.soldeDu))} dus par ${refLabel("clients",f.client,"nom")} — dossier ${f.dossier}.`, "ficheFF:"+f.code]);
    }
    if((f.reductions||[]).some(r=>r.statut==="En attente"))
      al.push(["p-ambre", `Réduction en attente de validation Direction sur ${f.code}.`, "ficheFF:"+f.code]);
  }
  return al;
}

  const lignes = [

    ["Closing", "Closing", ()=>DB.offres.filter(s=>s.dossier===code).map(s=>s.code+" ("+(s.statut||"—")+")").join(", ")],
    ["Paiement", "Finance", ()=>DB.paiements.filter(p=>p.dossier===code && ["Acompte","Solde","Reliquat"].includes(p.nature)).map(p=>p.code+" "+(p.statut||"")).join(", ")],
    ["Analyse dossier", "Analyse Dossiers", ()=>DB.analyses.filter(a=>a.dossier===code).map(a=>a.code+" ("+(a.completude||0)+"%, bon "+(a.bonLancement||"non émis")+")").join(", ")],
    ["Transport", "Transport", ()=>DB.transports.filter(t=>t.dossier===code).map(t=>t.code+" ("+(t.statut||"—")+")").join(", ")],
    ["Transit & Douane", "Transit & Douane", ()=>DB.transits.filter(t=>t.dossier===code).map(t=>t.code+" ("+(t.etapeDum||"—")+")").join(", ")],
    ["Certification", "Analyse Dossiers", ()=>DB.certifs.filter(c=>c.dossier===code).map(c=>c.organisme+" ("+(c.statut||"—")+")").join(", ")],
    ["Livraison", "Transport", ()=>DB.transportsNat.filter(t=>t.dossier===code).map(t=>t.code+" → "+(t.villeLivraison||"")+" ("+(t.statut||"—")+")").join(", ")],
    ["Suivi Client", "Suivi Client", ()=>{ const r=DB.reclamations.filter(x=>x.dossier===code); return r.length? r.length+" réclamation(s)" : (idx>=ETAPES.indexOf("Suivi Client")?"En cours de suivi":""); }]
  ];
  const NOMS_ETAPE = ["Sourcing","Études & Chiffrage","Closing","Paiement","Analyse Dossier","Transport","Transit & Douane","Certification","Livraison","Suivi Client"];
  let h = `<div class="bloc-fiche large"><h4>Processus complet ULTEx — étape actuelle : ${esc(d.etape)} (${idx+1}/${ETAPES.length})

  lignes.forEach((l, i)=>{
    const iEtape = ETAPES.indexOf(NOMS_ETAPE[i]);
    const etat = idx > iEtape ? pill("Terminée","p-vert") : idx === iEtape ? pill("En cours","p-or") : pill("À venir","p-gris");
    const elems = l[2]() || "—";
    h += `<tr><td>${i+1}</td><td><b>${esc(l[0])}</b></td><td>${esc(l[1])}</td><td>${esc(elems)}</td><td>${etat}</td></tr>`;
  });
  h += `</table></div></div>`;
  return h;
}

/* ---------- Résumé financier (fiche dossier) ---------- */
function blocFinancier(d, code){
  const e = DB.etudes.filter(s=>s.dossier===code).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  const fob=e?+e.fob||0:0, fret=e?+e.fret||0:0;
  const douane = e ? Math.round((fob+fret)*((+e.droitsPct||0)/100)) : 0;
  const tva = e ? Math.round((fob+fret+douane)*((+e.tvaPct||0)/100)) : 0;
  const fraisAnnexes = e ? (+e.fraisPort||0)+(+e.transportNat||0) : 0;
  const vente = +d.montantVente||0;
  const recus = DB.paiements.filter(p=>p.dossier===code && p.statut==="Payé" && ["Acompte","Solde","Reliquat"].includes(p.nature)).reduce((s,p)=>s+(+p.montant||0),0);
  const sorties = DB.paiements.filter(p=>p.dossier===code && p.statut==="Payé" && ["Paiement fournisseur","Droits de douane","Fret"].includes(p.nature)).reduce((s,p)=>s+(+p.montant||0),0);
  const intl = DB.pmtIntl.filter(p=>p.dossier===code && p.statut==="Confirmé");
  const margePrevue = e && e.marge!==undefined ? +e.marge : (vente && d.montantAchat ? vente-(+d.montantAchat) : null);
  const margeReelle = recus - sorties;
  const fraisService = e && vente ? Math.max(0, vente - (+e.coutTotal||0) - (margePrevue||0)) : 0;
  return `<div class="bloc-fiche"><h4>Résumé financier</h4><div class="kv">
    <div>Valeur marchandise (vente)</div><div><b>${fmtMAD(vente)}</b></div>
    <div>Coût fournisseur</div><div>${fmtMAD(d.montantAchat || fob)}</div>
    <div>Fret + assurance</div><div>${fmtMAD(fret)}</div>
    <div>Douane estimée (droits)</div><div>${fmtMAD(douane)}</div>
    <div>TVA estimée</div><div>${fmtMAD(tva)}</div>
    <div>Frais port + transport nat. (simulés)</div><div>${fmtMAD(fraisAnnexes)}</div>
    <div>Frais de service</div><div>${fraisService?fmtMAD(fraisService):"—"}</div>
    <div>Marge prévue</div><div>${margePrevue===null?"—":`<b style="color:${margePrevue>=0?"var(--ok)":"var(--rouge)"}">${fmtMAD(margePrevue)}</b>`}</div>
    <div>Paiements reçus (client)</div><div style="color:var(--ok)"><b>${fmtMAD(recus)}</b></div>
    <div>Solde client restant</div><div>${vente? `<b style="color:${vente-recus>0?"var(--ambre)":"var(--ok)"}">${fmtMAD(vente-recus)}</b>` : "—"}</div>
    <div>Paiements fournisseurs & frais payés</div><div>${fmtMAD(sorties)}${intl.length? " + "+intl.map(p=>Number(p.montantDevise||0).toLocaleString("fr-FR")+" "+(p.devise||"")).join(" + ")+" (intl)":""}</div>
    <div>Marge réelle (encaissé − décaissé MAD)</div><div><b style="color:${margeReelle>=0?"var(--ok)":"var(--rouge)"}">${fmtMAD(margeReelle)}</b></div>
  </div></div>`;
}

  h += tableFiche("Tâches en retard", tRetard, [
    ["Code",o=>esc(o.code)],["Titre",o=>esc(String(o.titre||"").slice(0,35))],["Responsable",o=>esc(o.assigne||"—")],["Échéance",o=>esc(o.echeance)]]);
  h += tableFiche("Erreurs récentes", errRec, [
    ["Code",o=>esc(o.code)],["Service",o=>esc(o.service||"—")],["Type",o=>esc(String(o.typeErreur||"").slice(0,30))],["Répétition",o=>o.repetition==="Répétée"?pill("Répétée","p-rouge"):"1ère fois"],["Statut",o=>pillStatut(o.statut)]]);
  h += tableFiche("Notifications importantes (non lues)", notifsImp, [

function sauverUtilisateur(code){
  if(!estDirection()){ toast("Réservé à la Direction."); return; }
  const nom = document.getElementById("u_nom").value.trim();
  const id = document.getElementById("u_id").value.trim();
  const mdp = document.getElementById("u_mdp").value;
  if(!nom || !id){ toast("Nom complet et identifiant obligatoires."); return; }
  if(DB.utilisateurs.some(x=>x.identifiant===id && x.code!==code)){ toast("Cet identifiant existe déjà."); return; }
  const services = [...document.querySelectorAll(".u_srv:checked")].map(c=>c.value);
  const modules = [...document.querySelectorAll(".u_mod:checked")].map(c=>c.value);
  const permissions = {}; [...document.querySelectorAll(".u_perm:checked")].forEach(c=>permissions[c.value]=1);
  const actif = document.getElementById("u_actif").value==="1";
  const dep = document.getElementById("u_dep").value;
  const poste = document.getElementById("u_poste").value.trim();
  if(code){
    const u = DB.utilisateurs.find(x=>x.code===code);
    const champs = {nomComplet:nom, identifiant:id, poste, departement:dep, actif};
    for(const k in champs){ if(String(u[k])!==String(champs[k])){ audit("Utilisateurs","Modification",u.code,k,u[k],champs[k]); u[k]=champs[k]; } }
    if(JSON.stringify(u.services)!==JSON.stringify(services)){ audit("Utilisateurs","Modification",u.code,"services",(u.services||[]).join("/"),services.join("/")); u.services=services; }
    if(JSON.stringify(u.modules)!==JSON.stringify(modules)){ audit("Utilisateurs","Modification",u.code,"modules",(u.modules||[]).length+" module(s)",modules.length+" module(s)"); u.modules=modules; }
    if(JSON.stringify(u.permissions)!==JSON.stringify(permissions)){ audit("Utilisateurs","Modification",u.code,"permissions",Object.keys(u.permissions||{}).join("/"),Object.keys(permissions).join("/")); u.permissions=permissions; }
    if(mdp){ u.motDePasse = mdp; audit("Utilisateurs","Changement de mot de passe",u.code,"motDePasse","••••","••••"); notifier(u.nomComplet, "Votre mot de passe UBOS a été modifié par la Direction.", "Utilisateurs"); }
    if(SESSION.code===u.code) SESSION = u;
    toast(u.code+" mis à jour");
  } else {
    if(!mdp){ toast("Mot de passe obligatoire à la création."); return; }
    const u = {code:genCode("USR"), nomComplet:nom, identifiant:id, motDePasse:mdp, poste, departement:dep, services, modules, permissions, actif, ts:Date.now()};
    DB.utilisateurs.push(u);
    audit("Utilisateurs","Création",u.code,"—","—",nom+" ("+id+")");
    toast(u.code+" créé — "+nom+" peut se connecter");
  }
  sauver(); fermer(); rendre();
}
function basculerActifUser(code){
  if(!estDirection()) return;
  const u = DB.utilisateurs.find(x=>x.code===code); if(!u) return;
  u.actif = !u.actif;
  audit("Utilisateurs", u.actif?"Réactivation":"Désactivation", u.code, "actif", String(!u.actif), String(u.actif));
  sauver(); rendre(); toast(u.nomComplet+" "+(u.actif?"réactivé":"désactivé"));
}

/* ---------- Alertes personnelles & dashboard personnel ---------- */
function servicesRapport(u){
  const map = {"Data":"Data","Sourcing":"Sourcing","Closing":"Closing","Finance":"Finance","Analyse Dossiers":"LIMEX","Transport":"LIMEX","Transit & Douane":"LIMEX","Digital":"Digital"};
  return [...new Set((u.services||[]).map(s=>map[s]).filter(Boolean))];
}
function donneesPerso(u){
  const auj = new Date(new Date().toDateString());
  const aujISO = new Date().toISOString().slice(0,10);
  const mesTaches = DB.taches.filter(t=>(u.services||[]).includes(t.assigne) || t.assigne===u.nomComplet);
  const tJour = mesTaches.filter(t=>t.statut!=="Terminée" && t.echeance===aujISO);
  const tRetard = mesTaches.filter(t=>t.statut!=="Terminée" && t.echeance && new Date(t.echeance) < auj);
  const mesDossiers = DB.dossiers.filter(d=>d.statut==="Actif" && d.etape!=="Clôturé" && ((u.services||[]).includes(d.responsable) || d.responsable===u.nomComplet || d.respActionSuivante===u.nomComplet || (u.services||[]).includes(d.respActionSuivante) || (u.services||[]).includes(SERVICE_ETAPE[d.etape])));
  const nonLues = DB.notifs.filter(n=>!n.lu && (n.dest==="Tous" || (u.services||[]).includes(n.dest) || n.dest===u.nomComplet));
  const validations = [];
  if(estDirectionUser(u) || (u.permissions&&u.permissions.valider)){
    DB.pmtIntl.filter(p=>p.statut==="En attente validation").forEach(p=>validations.push(`Paiement international ${p.code} (${p.type}) — dossier ${p.dossier||"—"}`));
    if((u.services||[]).includes("Finance")||estDirectionUser(u)) DB.paiements.filter(p=>p.statut==="En attente").forEach(p=>validations.push(`Paiement ${p.code} (${p.nature||"—"}) en attente — dossier ${p.dossier||"—"}`));
    if((u.services||[]).includes("Analyse Dossiers")||estDirectionUser(u)) DB.documents.filter(x=>x.statut==="En vérification").forEach(x=>validations.push(`Document ${x.code} « ${x.nom} » à vérifier`));
  }
  const codesMd = mesDossiers.map(d=>d.code);
  const docsCorriger = DB.documents.filter(x=>x.statut==="Rejeté" && (estDirectionUser(u) || codesMd.includes(x.dossier)));
  const rapportsManquants = servicesRapport(u).filter(s=>!DB.rapports.some(r=>r.service===s && r.date===aujISO));
  const actionsRecentes = DB.audit.filter(a=>a.utilisateur===u.nomComplet).slice(0,8);
  return {mesTaches, tJour, tRetard, mesDossiers, nonLues, validations, docsCorriger, rapportsManquants, actionsRecentes};
}
function alertesPerso(u){
  const al = [];
  const now = Date.now();
  const aujISO = new Date().toISOString().slice(0,10);
  const dp = donneesPerso(u);
  dp.tRetard.forEach(t=>al.push(["p-rouge",`Tâche non terminée à l'échéance : ${t.code} « ${t.titre} » (${t.echeance}).`,"taches"]));
  dp.mesDossiers.forEach(d=>{
    const t = Math.max(dernierAuditTs(d.code), d.ts||0);
    if(t && now-t > 864e5) al.push(["p-ambre",`Dossier ${d.code} qui vous est affecté : aucune action depuis ${Math.floor((now-t)/864e5)} jour(s) — prochaine étape à lancer.`,"ficheDossier:"+d.code]);
  });
  dp.docsCorriger.forEach(x=>al.push(["p-ambre",`Document rejeté à corriger : ${x.code} « ${x.nom} » — dossier ${x.dossier||"—"}.`,"documents"]));
  dp.validations.forEach(v=>al.push(["p-or","Validation demandée : "+v,"dashboard"]));
  dp.mesDossiers.forEach(d=>{
    if(!d.actionSuivante) al.push(["p-rouge",`Dossier ${d.code} affecté sans action suivante définie.`,"ficheDossier:"+d.code]);
  });
  const dans7 = new Date(Date.now()+7*864e5);
  DB.certifs.forEach(c=>{
    if(c.statut!=="Obtenue" && c.echeance && new Date(c.echeance) <= dans7 && (estDirectionUser(u) || c.responsable===u.nomComplet || (u.services||[]).includes(c.responsable) || (u.services||[]).includes("Analyse Dossiers")))
      al.push([new Date(c.echeance) < new Date(new Date().toDateString())?"p-rouge":"p-ambre",`Certification ${c.organisme} (${c.code}) ${new Date(c.echeance)<new Date(new Date().toDateString())?"échue":"proche échéance"} : ${c.echeance} — dossier ${c.dossier||"—"}.`,"certifs"]);
  });
  if(estDirectionUser(u) || (u.services||[]).includes("Finance")){
    const aujD = new Date(new Date().toDateString());
    DB.paiements.forEach(p=>{
      if(p.statut==="En retard" || (["Prévu","En attente"].includes(p.statut) && p.echeance && new Date(p.echeance) < aujD))
        al.push(["p-rouge",`Paiement en retard : ${p.code} (${p.nature||"—"}, ${fmtMAD(p.montant)}) — dossier ${p.dossier||"—"}.`,"paiements"]);
    });
  }
  dp.rapportsManquants.forEach(s=>al.push(["p-ambre",`Rapport journalier ${s} non déposé pour aujourd'hui.`,"rapports"]));
  if(dp.nonLues.length) al.push(["p-gris",`${dp.nonLues.length} notification(s) non lue(s).`,"notifications"]);
  return al;
}

/* ---------- Mon agenda ---------- */
function collecterAgenda(u){
  const dir = estDirectionUser(u);
  const auj = new Date(new Date().toDateString());
  const evts = [];
  const mien = (srv, resp) => dir || (u.services||[]).includes(srv) || resp===u.nomComplet;
  DB.taches.forEach(t=>{ if(t.echeance && (dir || (u.services||[]).includes(t.assigne) || t.assigne===u.nomComplet))
    evts.push({date:t.echeance, type:t.origine==="Décision de réunion"?"Réunion / décision":"Tâche", libelle:t.code+" · "+(t.titre||""), statut: t.statut==="Terminée"?"Terminée":(new Date(t.echeance)<auj?"Retard":(t.statut==="En cours"?"En cours":"À faire"))}); });
  DB.paiements.forEach(p=>{ if(p.echeance && !["Payé","Annulé"].includes(p.statut) && mien("Finance"))
    evts.push({date:p.echeance, type:"Rappel paiement", libelle:p.code+" · "+(p.nature||"")+" "+fmtMAD(p.montant)+" — "+(p.dossier||""), statut:new Date(p.echeance)<auj?"Retard":"À faire"}); });
  DB.certifs.forEach(c=>{ if(c.echeance && c.statut!=="Obtenue" && mien("Analyse Dossiers", c.responsable))
    evts.push({date:c.echeance, type:"Rappel certification", libelle:c.code+" · "+(c.organisme||"")+" — "+(c.dossier||""), statut:new Date(c.echeance)<auj?"Retard":(c.statut==="En cours"?"En cours":"À faire")}); });
  DB.transports.forEach(t=>{ if(t.eta && !["Livré"].includes(t.statut) && mien("Transport"))
    evts.push({date:t.eta, type:"Rappel transport", libelle:t.code+" · ETA "+(t.mode||"")+" — "+(t.dossier||""), statut:t.statut==="En transit"?"En cours":"À faire"}); });
  DB.transportsNat.forEach(t=>{ if(t.datePrevue && t.statut!=="Livré" && mien("Transport"))
    evts.push({date:t.datePrevue, type:"Rappel transport", libelle:t.code+" · Livraison "+(t.villeLivraison||"")+" — "+(t.dossier||""), statut:new Date(t.datePrevue)<auj?"Retard":"À faire"}); });
  DB.transits.forEach(t=>{ if(t.franchiseFin && t.etapeDum!=="Sorti du port" && mien("Transit & Douane"))
    evts.push({date:t.franchiseFin, type:"Fin de franchise", libelle:t.code+" · Franchise port — "+(t.dossier||""), statut:new Date(t.franchiseFin)<auj?"Retard":"À faire"}); });
  const aujISO2 = new Date().toISOString().slice(0,10);
  servicesRapport(u).forEach(s=>{ if(!DB.rapports.some(r=>r.service===s && r.date===aujISO2))
    evts.push({date:aujISO2, type:"Rapport journalier", libelle:"Rapport "+s+" à déposer", statut:"À faire"}); });
  return evts.sort((a,b)=>a.date<b.date?-1:1);
}
let filtreAgenda = "semaine";
function rendreMonAgenda(){
  const evts = collecterAgenda(SESSION);
  const auj = new Date(new Date().toDateString());
  let filtres = evts;
  if(filtreAgenda==="semaine"){ const fin = new Date(auj.getTime()+7*864e5); filtres = evts.filter(e=>{const d=new Date(e.date); return d>=auj && d<fin;}); }
  else if(filtreAgenda==="retard"){ filtres = evts.filter(e=>e.statut==="Retard"); }
  let h = topbar("Mon agenda");
  h += `<div class="outils">
    <select onchange="filtreAgenda=this.value;rendre()">
      <option value="semaine" ${filtreAgenda==="semaine"?"selected":""}>Cette semaine</option>
      <option value="tout" ${filtreAgenda==="tout"?"selected":""}>Tout l'agenda</option>
      <option value="retard" ${filtreAgenda==="retard"?"selected":""}>En retard uniquement</option>
    </select>
    <span style="color:var(--gris)">${filtres.length} élément(s) — tâches, échéances dossiers, paiements, certifications, transports, décisions</span></div>`;

  else {
    const parJour = {};
    filtres.forEach(e=>{ (parJour[e.date]=parJour[e.date]||[]).push(e); });
    for(const j of Object.keys(parJour).sort()){
      const estAuj = j===new Date().toISOString().slice(0,10);
      h += `<div class="agenda-jour"><h4>${estAuj?"Aujourd'hui — ":""}${esc(new Date(j+"T12:00").toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))}</h4>
      <div class="panneau"><div class="defile"><table>` +
        parJour[j].map(e=>`<tr><td style="width:170px">${pill(e.type,"p-gris")}</td><td>${esc(e.libelle)}</td><td style="width:110px">${e.statut==="Retard"?pill("Retard","p-rouge"):pillStatut(e.statut)}</td></tr>`).join("") +
      `</table></div></div></div>`;
