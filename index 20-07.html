  const consults = l.consultationsFournisseurs||[];
  const s = l.selection || {};
  const m = document.getElementById("modale");
  m.innerHTML = `<header><h3>Sélection finale — ${esc(l.code)}</h3><button onclick="fermer()">✕</button></header>
  <div class="corps">
    <div class="champ"><label>Fournisseur principal</label><select id="sl_principal"><option value="">—</option>${consults.map(c=>`<option ${s.principal===c.nom?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></div>
    <div class="champ"><label>Fournisseur alternatif</label><select id="sl_alternatif"><option value="">—</option>${consults.map(c=>`<option ${s.alternatif===c.nom?"selected":""}>${esc(c.nom)}</option>`).join("")}</select></div>
    <div class="champ large"><label>Répartition entre plusieurs fournisseurs (facultatif — ex. Fournisseur A : 60, Fournisseur B : 40)</label>
      <textarea id="sl_repartition" placeholder="Un fournisseur par ligne : Nom : pourcentage">${(s.repartition||[]).map(r=>r.fournisseur+" : "+r.pct).join("\\n")}</textarea></div>
    <div class="champ"><label><input type="checkbox" id="sl_aucun" ${s.aucunRetenu?"checked":""}> Ne retenir aucun fournisseur</label></div>
  </div>
  <footer><button class="btn doux" onclick="fermer()">Annuler</button><button class="btn" onclick="sauverSelectionLigne('${codeDemande}','${idLigne}')">Enregistrer</button></footer>`;
  document.getElementById("voile").classList.add("on");
}
function sauverSelectionLigne(codeDemande, idLigne){
  const d = DB.demandes.find(x=>x.code===codeDemande); const l = d&&(d.lignes||[]).find(x=>x.id===idLigne); if(!l) return;
  const repTxt = document.getElementById("sl_repartition").value.trim();
  const repartition = repTxt ? repTxt.split("\n").filter(x=>x.trim()).map(ligne=>{ const p=ligne.split(":"); return {fournisseur:(p[0]||"").trim(), pct:+((p[1]||"0").trim())}; }) : [];
  l.selection = {principal:document.getElementById("sl_principal").value, alternatif:document.getElementById("sl_alternatif").value,
    repartition, aucunRetenu:document.getElementById("sl_aucun").checked};
  if(l.selection.principal || repartition.length) l.statut = "Prête à confirmer";
  audit("Demandes","Sélection enregistrée",codeDemande,l.code,"—",l.selection.principal||("réparti sur "+repartition.length+" fournisseur(s)"));
  sauver(); fermer(); rendre(); toast("Sélection enregistrée");
}
function demanderNouvelleRecherche(codeDemande, idLigne){
  const d = DB.demandes.find(x=>x.code===codeDemande); const l = d&&(d.lignes||[]).find(x=>x.id===idLigne); if(!l) return;
  l.statut = "En sourcing"; l.selection = null;
  audit("Demandes","Nouvelle recherche demandée",codeDemande,l.code,"—","relancée par "+userCourant);
  if(l.responsable) notifier(l.responsable, `Nouvelle recherche demandée sur ${l.code} (${l.produitService}).`, "Demandes");
  sauver(); rendre(); toast("Nouvelle recherche demandée");
}

      <td><input id="fc_${l.id}" value="${esc(l.selection?l.selection.principal||"":"")}" style="width:160px"></td>
    </tr>`).join("") + `</table></div></div>
    <div class="champ large"><label>Condition de confirmation</label><select id="cf_condition">${CONDITIONS_COMMANDE.map(c=>`<option>${c}</option>`).join("")}</select></div>
    <div class="champ"><label>Formule ULTEx</label><select id="cf_formule">${FORMULES_ULTEX.map(f=>`<option>${f}</option>`).join("")}</select></div>
  </div>
  <footer><button class="btn doux" onclick="fermer()">Annuler</button><button class="btn or" onclick="confirmerDemandeEnCommande('${codeDemande}')">✓ Créer la commande</button></footer>`;
  document.getElementById("voile").classList.add("on");

function confirmerDemandeEnCommande(codeDemande){
  if(!peut("valider")){ toast("Permission refusée : la confirmation exige le droit Valider."); return; }
  const d = DB.demandes.find(x=>x.code===codeDemande); if(!d) return;
  const idsCoches = [...document.querySelectorAll(".cf_ligne")].filter(c=>c.checked).map(c=>c.value);
  if(!idsCoches.length){ toast("Cochez au moins une ligne."); return; }
  const lignesCmd = idsCoches.map(id=>{
    const l = d.lignes.find(x=>x.id===id);
    const qte = document.getElementById("qc_"+id).value;
    const fourn = document.getElementById("fc_"+id).value;
    l.statutConfirmation = "Confirmée";
    const consult = (l.consultationsFournisseurs||[]).find(c=>c.nom===fourn);
    return {ligneCode:l.code, demandeOrigine:codeDemande, produitService:l.produitService, quantiteDemandee:l.quantite||"", quantiteConfirmee:qte,
      fournisseurRetenu:fourn, prix:consult?consult.prix:"", devise:consult?consult.devise:"", incoterm:consult?consult.incoterm:"", budgetEstime:l.budgetEstime};
  });
  const cmd = {code:genCode("CMD"), client:d.client, demande:codeDemande, condition:document.getElementById("cf_condition").value,
    formuleUltex:document.getElementById("cf_formule").value, lignes:lignesCmd, statut:"Confirmée",
    devisAccepte:"", calculValide:"", documents:"", paiement:"", par:userCourant, ts:Date.now()};
  DB.commandes.push(cmd);
  const toutesConfirmees = d.lignes.every(l=>l.statutConfirmation==="Confirmée" || l.statut==="Clôturée");
  d.statut = toutesConfirmees ? "Confirmée" : "Partiellement confirmée";
  audit("Demandes","Commande créée",codeDemande,"commande","—",cmd.code+" ("+lignesCmd.length+" ligne(s))");
  audit("Commandes","Création",cmd.code,"—","—",cmd.client+" — "+lignesCmd.length+" ligne(s) depuis "+codeDemande);
  notifier("Direction", `Commande ${cmd.code} créée depuis ${codeDemande} (${lignesCmd.length} ligne(s)) — formule ${cmd.formuleUltex}.`, "Commandes");
  sauver(); fermer(); location.hash="ficheCommande:"+cmd.code; rendre();
  toast(cmd.code+" créée");
}

function sauverLigneDossier(codeDossier, idLigne){
  if(!peut("modifier")){ toast("Permission refusée."); return; }
  const d = DB.dossiers.find(x=>x.code===codeDossier); if(!d) return;
  const produit = document.getElementById("lo_produit").value.trim();
  if(!produit){ toast("Le produit / service est obligatoire."); return; }
  const data = {produit, fournisseur:document.getElementById("lo_fourn").value, quantite:document.getElementById("lo_qte").value.trim(),
    prixUnitaire:document.getElementById("lo_prix").value, devise:document.getElementById("lo_devise").value,
    statut:document.getElementById("lo_statut").value, ligneCommandeCode:document.getElementById("lo_cmdOrigine").value.trim()};
  d.lignes = d.lignes||[];
  if(idLigne){
    Object.assign(d.lignes.find(x=>x.id===idLigne), data);
    audit("Dossiers","Ligne dossier modifiée",codeDossier,"ligne",idLigne,produit,codeDossier);
  } else {
    const l = Object.assign({id:"do"+(d.lignes.length+1)+"_"+Date.now()}, data);
    d.lignes.push(l);
    audit("Dossiers","Ligne dossier ajoutée",codeDossier,"ligne","—",produit,codeDossier);
  }
  recalculerProduitDossier(d);
  sauver(); fermer(); rendre(); toast("Ligne enregistrée");
}
function supprimerLigneDossier(codeDossier, idLigne){
  if(!peut("supprimer")){ toast("Permission refusée."); return; }
  const d = DB.dossiers.find(x=>x.code===codeDossier); if(!d) return;
  if(!confirm("Supprimer cette ligne du dossier ?")) return;
  d.lignes = (d.lignes||[]).filter(x=>x.id!==idLigne);
  audit("Dossiers","Ligne dossier supprimée",codeDossier,"ligne","—","supprimée",codeDossier);
  recalculerProduitDossier(d);
  sauver(); rendre();
}

function ouvrirFicheArrivage(code){ location.hash = "ficheArrivage:"+code; }
function verifierClotureArrivage(arr){
  const pb = [];
  const lignes = arr.lignes||[];
  const dossiersUniques = [...new Set(lignes.filter(l=>l.dossier).map(l=>l.dossier))];
  const dossiersOuverts = dossiersUniques.filter(dc=>{ const d=DB.dossiers.find(x=>x.code===dc); return d && d.statut==="Actif" && d.etape!=="Clôturé"; });
  if(dossiersOuverts.length) pb.push(dossiersOuverts.length+" dossier(s) encore ouvert(s) : "+dossiersOuverts.join(", "));
  const fraisNonRepartis = (arr.fraisCommuns||[]).filter(f=>calculerRepartitionFrais(arr,f).nonAffecte);
  if(fraisNonRepartis.length) pb.push(fraisNonRepartis.length+" frais commun(s) non réparti(s).");
  const docsManquants = DB.documents.filter(x=>x.arrivage===arr.code && x.statut==="Attendu");
  if(docsManquants.length) pb.push(docsManquants.length+" document(s) encore « Attendu ».");
  const sansProprietaire = lignes.filter(l=>!l.proprietaire);
  if(sansProprietaire.length) pb.push(sansProprietaire.length+" ligne(s) sans propriétaire de marchandise défini.");
  const sansQuantite = lignes.filter(l=>!l.quantiteEmbarquee);
  if(sansQuantite.length) pb.push(sansQuantite.length+" ligne(s) sans quantité embarquée renseignée.");
  return pb;
}

/* --- Moteur de répartition automatique des frais communs --- */
function calculerRepartitionFrais(arr, frais){
  const lignes = (arr.lignes||[]).filter(l=>l.dossier);
  const parDossier = {};
  lignes.forEach(l=>parDossier[l.dossier]=0);
  const dossiersUniques = Object.keys(parDossier);
  if(!dossiersUniques.length) return {parDossier:{}, nonAffecte:true, ultex:0};
  const montant = +frais.montantTTC||0;
  if(frais.methodeRepartition==="Non réparti") return {parDossier, nonAffecte:true, ultex:0};
  if(frais.methodeRepartition==="Entièrement affecté à ULTEx") return {parDossier, nonAffecte:false, ultex:montant};
  if(frais.methodeRepartition==="Entièrement affecté à un dossier précis"){
    if(frais.dossierUnique) parDossier[frais.dossierUnique] = montant;
    return {parDossier, nonAffecte:!frais.dossierUnique, ultex:0};
  }
  if(frais.methodeRepartition==="Montant manuel"){
    (frais.repartitionManuelle||[]).forEach(r=>{ if(parDossier[r.dossier]!==undefined) parDossier[r.dossier]=+r.montant||0; });
    return {parDossier, nonAffecte:false, ultex:0};
  }
  if(frais.methodeRepartition==="Montant égal par dossier"){
    const part = montant/dossiersUniques.length;
    dossiersUniques.forEach(dc=>parDossier[dc]=part);
    return {parDossier, nonAffecte:false, ultex:0};
  }
  const poidsCle = frais.methodeRepartition==="Par poids" ? "poidsEmbarque" : frais.methodeRepartition==="Par CBM" ? "cbmEmbarque" : frais.methodeRepartition==="Par nombre de colis" ? "nbColis" : null;
  if(poidsCle){
    const totaux = {};
    lignes.forEach(l=>{ totaux[l.dossier]=(totaux[l.dossier]||0)+(+l[poidsCle]||0); });
    const totalGlobal = Object.values(totaux).reduce((s,v)=>s+v,0);
    if(!totalGlobal) return {parDossier, nonAffecte:true, ultex:0};
    dossiersUniques.forEach(dc=>parDossier[dc]=montant*(totaux[dc]||0)/totalGlobal);
    return {parDossier, nonAffecte:false, ultex:0};
  }
  if(frais.methodeRepartition==="Par valeur marchandise"){
    const totaux = {};
    lignes.forEach(l=>{ const d=DB.dossiers.find(x=>x.code===l.dossier); totaux[l.dossier]=(totaux[l.dossier]||0)+(d?+d.montantVente||0:0); });
    const totalGlobal = Object.values(totaux).reduce((s,v)=>s+v,0);
    if(!totalGlobal) return {parDossier, nonAffecte:true, ultex:0};
    dossiersUniques.forEach(dc=>parDossier[dc]=montant*(totaux[dc]||0)/totalGlobal);
    return {parDossier, nonAffecte:false, ultex:0};
  }

function retirerLigneArrivage(codeArrivage, idLigne){

function transfererLigneArrivage(codeArrivage, idLigne){

  if(!arrDest){ toast("Arrivage de destination introuvable."); return; }
  const arr = DB.arrivages.find(x=>x.code===codeArrivage);
  const l = (arr.lignes||[]).find(x=>x.id===idLigne); if(!l) return;
  arr.lignes = arr.lignes.filter(x=>x.id!==idLigne);

function repartirLigneArrivage(codeArrivage, idLigne){
  const cible = prompt("Répartir ce dossier vers quel autre arrivage (code) ?");

function sauverFraisArrivage(codeArrivage, idFrais){
  const arr = DB.arrivages.find(x=>x.code===codeArrivage); if(!arr) return;
  const ht = +document.getElementById("fa_ht").value||0;
  const tvaPct = +document.getElementById("fa_tva").value||0;
  const data = {categorie:document.getElementById("fa_cat").value, fournisseurService:document.getElementById("fa_fourn").value.trim(),
    facture:document.getElementById("fa_facture").value.trim(), montantHT:ht, tvaPct, montantTTC:Math.round(ht*(1+tvaPct/100)*100)/100,
    devise:document.getElementById("fa_devise").value, tauxChange:document.getElementById("fa_taux").value,
    date:document.getElementById("fa_date").value, justificatif:document.getElementById("fa_justif").value.trim(),
    statut:document.getElementById("fa_statut").value, methodeRepartition:document.getElementById("fa_methode").value,
    dossierUnique:document.getElementById("fa_dossierUnique")?document.getElementById("fa_dossierUnique").value:""};
  arr.fraisCommuns = arr.fraisCommuns||[];
  if(idFrais){
    Object.assign(arr.fraisCommuns.find(x=>x.id===idFrais), data);

  } else {
    arr.fraisCommuns.push(Object.assign({id:"fa"+(arr.fraisCommuns.length+1)+"_"+Date.now(), ts:Date.now()}, data));
    audit("Arrivages","Frais commun ajouté",codeArrivage,data.categorie,"—",fmtMAD(data.montantTTC)+" — "+data.methodeRepartition);
  }
  sauver(); fermer(); rendre(); toast("Frais enregistré");
}

/* ================= TABLEAU DE BORD & ALERTES LIMEX ================= */
function calculerAlertesLimex(){
  const al = [];
  const auj = new Date(new Date().toDateString());
  DB.dossiers.forEach(d=>{
    if(d.statut!=="Actif") return;
    if(d.commande && !DB.analysesLimex.some(a=>a.dossier===d.code)) al.push(["p-rouge", `Dossier confirmé ${d.code} sans analyse LIMEX pré-expédition.`, "ficheDossier:"+d.code]);
  });
  DB.analysesLimex.forEach(a=>{
    if(!a.resultat || a.resultat==="Informations manquantes") al.push(["p-ambre", `Analyse LIMEX ${a.code} incomplète — dossier ${a.dossier}.`, "ficheAnalyseLimex:"+a.code]);
  });
  DB.arrivages.forEach(arr=>{
    if(arr.etaPrevue && !["Livré totalement","Clôturé","Annulé"].includes(arr.statut)){
      const j = Math.ceil((new Date(arr.etaPrevue)-Date.now())/864e5);
      if(j<=7 && j>=0 && !["En dédouanement","Sorti du port"].includes(arr.statut)) al.push(["p-ambre", `ETA ${arr.code} dans ${j} jour(s) — préparation douane à vérifier.`, "ficheArrivage:"+arr.code]);
    }
    if(!arr.responsableLimex) al.push(["p-rouge", `Arrivage ${arr.code} sans responsable LIMEX.`, "ficheArrivage:"+arr.code]);
    if(["Livré totalement","Clôturé"].includes(arr.statut) && (arr.fraisCommuns||[]).some(f=>{ const r=calculerRepartitionFrais(arr,f); return r.nonAffecte; }))
      al.push(["p-ambre", `Arrivage ${arr.code} clôturé avec des frais non répartis.`, "ficheArrivage:"+arr.code]);
  });
  DB.transits.forEach(t=>{
    if(t.franchiseFin && t.etapeDum!=="Sorti du port"){
      const j = Math.ceil((new Date(t.franchiseFin)-Date.now())/864e5);
      if([5,3,1].includes(j)) al.push(["p-rouge", `Fin de franchise J-${j} — dossier ${t.dossier}.`, "transits"]);
    }
  });
  DB.documents.forEach(doc=>{
    if(doc.statut==="Rejeté") al.push(["p-ambre", `Document rejeté non corrigé : ${doc.nom} (${doc.code}).`, "documents"]);
  });
  DB.dossiers.forEach(d=>{
    if(d.etape==="Livraison" && !DB.facturesFinales.some(f=>f.dossier===d.code)) al.push(["p-ambre", `Dossier ${d.code} livré sans facture finale.`, "ficheDossier:"+d.code]);
  });
  return al;
}

  if(!doc){ h += `<div class="panneau"><div class="vide"><b>Document introuvable</b>${esc(code)}</div></div>`; document.getElementById("main").innerHTML=h; return; }
  if(!peutVoirDocument(doc)){ h += `<div class="panneau"><div class="note-verrou"><b>Accès restreint</b>Ce document est classé « ${esc(doc.confidentialite)} » et n'est pas visible par votre profil.</div></div>`; document.getElementById("main").innerHTML=h; return; }
  consulterDocument(code);
  const chaineVersions = [];
  let cur = doc;
  while(cur){ chaineVersions.unshift(cur); cur = cur.documentPrecedent ? DB.documents.find(x=>x.code===cur.documentPrecedent) : null; }
  cur = doc.remplacePar ? DB.documents.find(x=>x.code===doc.remplacePar) : null;
  while(cur){ chaineVersions.push(cur); cur = cur.remplacePar ? DB.documents.find(x=>x.code===cur.remplacePar) : null; }
  h += enteteImpression("Document "+doc.code);
  h += `<div class="outils">
    <span class="pill p-or" style="font-size:14px;padding:6px 14px">${esc(doc.code)}</span>
    ${pillStatut(doc.statut)}
    ${pill("v"+(doc.version||1),"p-gris")}
    <span style="flex:1"></span>
    ${peut("modifier")?`<button class="btn doux" onclick="ouvrirEditeur('documents','${code}')">Modifier</button>`:""}
    <button class="btn doux" onclick="formEnvoyerMessage('document','${code}')">✉ Envoyer un message</button>
    ${doc.statut!=="Archivé"?`<button class="btn doux" onclick="nouvelleVersionDocument('${code}')">+ Nouvelle version</button>`:""}
    ${doc.statut!=="Archivé"&&peut("supprimer")?`<button class="btn rouge" onclick="archiverDocument('${code}')">Archiver</button>`:""}
  </div>`;
  h += `<div class="fiche-grille">`;
  // Aperçu
  h += `<div class="bloc-fiche large"><h4>Aperçu</h4><div style="padding:14px">`;
  if(doc.url && apercuPossible(doc.url)){
    if(/\.pdf(\?|$)/i.test(doc.url)) h += `<iframe src="${esc(doc.url)}" style="width:100%;height:420px;border:1px solid var(--bord);border-radius:9px"></iframe>`;
    else h += `<img src="${esc(doc.url)}" style="max-width:100%;max-height:420px;border-radius:9px;border:1px solid var(--bord)">`;
    h += `<div style="margin-top:8px"><a class="btn mini doux" href="${esc(doc.url)}" target="_blank">Ouvrir dans un nouvel onglet</a></div>`;
  } else if(doc.url){
    h += `<a class="btn or" href="${esc(doc.url)}" target="_blank">🔗 Ouvrir le lien (${esc(doc.typeFichier||"lien externe")})</a>`;
  } else {
    h += `<div class="vide">Aucun aperçu — ce document est enregistré comme référence (métadonnées) sans fichier ni lien attaché. Ajoutez une URL pour activer l'aperçu.</div>`;
  }
  h += `</div></div>`;
  h += `<div class="bloc-fiche"><h4>Informations</h4><div class="kv">
    ${ligneKV("Nom", esc(doc.nom))}${ligneKV("Catégorie", pill(doc.type||"—","p-gris"))}${ligneKV("Type de fichier", esc(doc.typeFichier||"—"))}
    ${ligneKV("Ajouté par", esc(doc.par||"—")+" le "+(doc.ts?new Date(doc.ts).toLocaleDateString("fr-FR"):"—"))}
    ${ligneKV("Confidentialité", pill(doc.confidentialite||"Public (services autorisés)", doc.confidentialite&&!doc.confidentialite.startsWith("Public")?"p-ambre":"p-gris"))}
    ${ligneKV("Date d'expiration", esc(doc.dateExpiration||"—"))}
    ${ligneKV("Commentaire", esc(doc.commentaire||"—"))}
  </div></div>`;
  h += `<div class="bloc-fiche"><h4>Objets liés</h4><div class="kv">
    ${[["client","Client"],["demande","Demande"],["ligneDemande","Ligne de demande"],["commande","Commande"],["dossier","Dossier"],["arrivage","Arrivage"],["fournisseur","Fournisseur"],["tache","Tâche"],["reclamation","Réclamation"]]
      .filter(([k])=>doc[k]).map(([k,l])=>ligneKV(l, ficheHashPour(k,doc[k])?`<a class="lien" href="#${ficheHashPour(k,doc[k])}">${esc(doc[k])}</a>`:esc(doc[k]))).join("") || "<div>Aucun lien</div><div></div>"}
  </div></div>`;
  if(chaineVersions.length>1){
    h += `<div class="bloc-fiche large"><h4>Historique des versions</h4><div class="defile"><table><tr><th>Version</th><th>Code</th><th>Date</th><th>Utilisateur</th><th>Statut</th><th>Motif</th><th></th></tr>`+
      chaineVersions.map(v=>`<tr style="${v.code===code?"background:#FBF6E9":""}"><td>v${v.version||1}</td><td class="code">${esc(v.code)}</td><td>${v.ts?new Date(v.ts).toLocaleDateString("fr-FR"):"—"}</td><td>${esc(v.par||"—")}</td><td>${pillStatut(v.statut)}</td><td>${esc(v.motifVersion||"—")}</td><td>${v.code!==code?`<a class="lien" href="#ficheDocument:${esc(v.code)}">Ouvrir</a>`:"(actuelle)"}</td></tr>`).join("")+
      `</table></div></div>`;
  }
  // Validations
  h += `<div class="bloc-fiche large"><h4>Validations ${(doc.validationsRequises||[]).length?`<button class="btn mini" style="float:right" onclick="formValiderDocument('${code}')">+ Valider</button>`:`<button class="btn mini doux" style="float:right" onclick="formDefinirValidations('${code}')">Définir les rôles requis</button>`}</h4>`;
  if((doc.validationsRequises||[]).length){
    h += `<div class="kv">`+doc.validationsRequises.map(r=>{
      const v = (doc.validations||[]).find(x=>x.role===r);
      return ligneKV(r, v?pill("Validé par "+v.utilisateur+" le "+v.date,"p-vert"):pill("En attente","p-ambre"));
    }).join("")+`</div>`;
  } else h += `<div class="vide" style="padding:14px">Aucune validation requise pour ce document.</div>`;
  h += `</div>`;
  if(doc.statut==="Rejeté"){
    h += `<div class="bloc-fiche large"><h4>Rejet</h4><div class="kv">
      ${ligneKV("Motif", esc(doc.motifRejet||"—"))}${ligneKV("Par", esc(doc.rejetePar||"—")+" le "+esc(doc.dateRejet||"—"))}
      ${ligneKV("Correction demandée", esc(doc.correctionDemandee||"—"))}
      ${ligneKV("Responsable correction", esc(doc.responsableCorrection||"—"))}${ligneKV("Échéance", esc(doc.echeanceCorrection||"—"))}
    </div></div>`;
  } else {
    h += `<div class="bloc-fiche large"><h4>Statut</h4><div style="padding:14px;display:flex;gap:8px;flex-wrap:wrap">
      ${STATUTS_DOCUMENT.filter(s=>s!==doc.statut&&s!=="Rejeté").map(s=>`<button class="btn mini doux" onclick="changerStatutDocument('${code}','${s}')">→ ${s}</button>`).join("")}
      <button class="btn mini rouge" onclick="formRejeterDocument('${code}')">→ Rejeté</button>
    </div></div>`;
  }
  h += rendreFilDiscussion("document", code);
  const hist = DB.audit.filter(a=>a.objet===code);
  h += tableFiche("Historique et audit", hist, [
    ["Date",o=>esc(o.date)+" "+esc(o.heure)],["Utilisateur",o=>esc(o.utilisateur)],["Action",o=>esc(o.action)],["Détail",o=>esc(String(o.apres).slice(0,50))]], true);
  h += `</div>`;
  document.getElementById("main").innerHTML = h;
}
function nouvelleVersionDocument(code){
  if(!peut("ajouter")){ toast("Permission refusée."); return; }
  const motif = prompt("Motif de la nouvelle version :");
  if(motif===null) return;
  const doc = DB.documents.find(x=>x.code===code); if(!doc) return;
  const nv = Object.assign({}, doc, {code:genCode("DOC"), version:(+doc.version||1)+1, documentPrecedent:code, remplacePar:"", motifVersion:motif,
    statut:"Reçu", validations:[], par:userCourant, ts:Date.now()});
  delete nv.motifRejet; delete nv.dateRejet; delete nv.rejetePar; delete nv.correctionDemandee; delete nv.responsableCorrection; delete nv.echeanceCorrection;
  DB.documents.push(nv);
  doc.statut = "Remplacé"; doc.remplacePar = nv.code;
  audit("Documents","Nouvelle version",nv.code,"documentPrecedent","—",code+" — "+motif);
  audit("Documents","Remplacé",code,"statut",doc.statut,"Remplacé par "+nv.code);
  sauver(); location.hash="ficheDocument:"+nv.code; toast(nv.code+" créé (v"+nv.version+") — l'ancienne version reste accessible");
}

function sauverMessage(objetType, objetCode){
  const texte = document.getElementById("ms_texte").value.trim();
  const dest = [...document.querySelectorAll(".ms_dest")].filter(c=>c.checked).map(c=>c.value);
  if(!texte){ toast("Le message ne peut pas être vide."); return; }
  if(!dest.length){ toast("Choisissez au moins un destinataire."); return; }
  const msg = {code:genCode("MSG"), expediteur:userCourant, destinataires:dest, objetType, objetCode,
    type:document.getElementById("ms_type").value, message:texte, priorite:document.getElementById("ms_priorite").value,
    echeance:document.getElementById("ms_echeance").value, pieceJointe:document.getElementById("ms_piece").value,
    accuseDemande:document.getElementById("ms_accuse").checked, validationDemandee:document.getElementById("ms_validation").checked,
    actionDemandee:document.getElementById("ms_action").checked, lu:[], reponses:[], statutAction:"Ouverte", par:userCourant, ts:Date.now()};
  DB.communicationsDossier.push(msg);
  audit("Messagerie","Message envoyé",msg.code,"destinataires","—",dest.join(", ")+" — "+labelObjet(objetType)+" "+objetCode);
  const lienDirect = ficheHashPour(objetType, objetCode);
  dest.forEach(d=>{
    if(d==="Tous les responsables concernés"){
      const obj = objetType==="dossier"?DB.dossiers.find(x=>x.code===objetCode):objetType==="arrivage"?DB.arrivages.find(x=>x.code===objetCode):null;
      if(obj && obj.responsable) notifier(obj.responsable, `${userCourant} : ${texte.slice(0,100)} (${labelObjet(objetType)} ${objetCode})`, "Messagerie");
      if(obj && obj.responsableLimex) notifier(obj.responsableLimex, `${userCourant} : ${texte.slice(0,100)} (${labelObjet(objetType)} ${objetCode})`, "Messagerie");
    } else notifier(d, `${userCourant} : ${texte.slice(0,100)} (${labelObjet(objetType)} ${objetCode})`, "Messagerie");
  });
  detecterMentions(texte, objetCode);
  sauver(); fermer(); rendre(); toast("Message envoyé");
}

  const mesMsgs = DB.communicationsDossier.filter(m=>m.destinataires.some(d=>d===userCourant || (SESSION.services||[]).includes(d)) || m.expediteur===userCourant).sort((a,b)=>b.ts-a.ts);
  h += `<div class="outils"><span style="flex:1;color:var(--gris)">${mesMsgs.length} message(s) envoyé(s) ou reçu(s)</span></div>`;
  h += `<div class="panneau"><div class="defile"><table><tr><th>Date</th><th>De</th><th>À</th><th>Objet lié</th><th>Type</th><th>Message</th><th>Lu</th><th></th></tr>`+
    mesMsgs.map(m=>`<tr><td>${new Date(m.ts).toLocaleDateString("fr-FR")}</td><td>${esc(m.expediteur)}</td><td>${esc(m.destinataires.join(", ")).slice(0,30)}</td>
      <td>${ficheHashPour(m.objetType,m.objetCode)?`<a class="lien" href="#${ficheHashPour(m.objetType,m.objetCode)}">${esc(labelObjet(m.objetType))} ${esc(m.objetCode)}</a>`:esc(labelObjet(m.objetType)+" "+m.objetCode)}</td>
      <td>${pill(m.type,"p-gris")}</td><td>${esc(String(m.message).slice(0,50))}</td><td>${m.lu.some(l=>l.utilisateur===userCourant)?"✓":"—"}</td>
      <td><button class="btn mini doux" onclick="location.hash='${ficheHashPour(m.objetType,m.objetCode)||"messagerie"}'">Ouvrir</button></td></tr>`).join("")+
    (!mesMsgs.length?`<tr><td colspan="8" style="text-align:center;color:var(--gris);padding:16px">Aucun message.</td></tr>`:"")+
    `</table></div></div>`;
  document.getElementById("main").innerHTML = h;
}

function ouvrirFichePartenaire(code){ location.hash = "fichePartenaire:"+code; }
function calculerPerformancePartenaire(p){
  const arrivagesLies = DB.arrivages.filter(a=>[a.transitaire,a.transporteur,a.compagnie].includes(p.code));
  const retards = arrivagesLies.filter(a=>a.etaActualisee && a.etaPrevue && new Date(a.etaActualisee)>new Date(a.etaPrevue)).length;
  const litiges = DB.reclamations.filter(r=>(r.remarque||"").includes(p.code)).length;
  const total = arrivagesLies.length;
  const fiabiliteEta = total ? Math.round((1-retards/total)*100) : null;
  let niveau = "Recommandé";
  if(p.statut==="Blacklisté") niveau = "Blacklisté";
  else if(litiges>2 || (fiabiliteEta!==null && fiabiliteEta<60)) niveau = "À risque";
  else if(litiges>0 || (fiabiliteEta!==null && fiabiliteEta<85)) niveau = "En observation";
  return {arrivages:total, retards, litiges, fiabiliteEta, niveau};
}
function rendreFichePartenaire(code){
  const p = DB.partenaires.find(x=>x.code===code);
  let h = topbar("Partenaire logistique");
  if(!p){ h += `<div class="panneau"><div class="vide"><b>Partenaire introuvable</b>${esc(code)}</div></div>`; document.getElementById("main").innerHTML=h; return; }
  const perf = calculerPerformancePartenaire(p);
  h += enteteImpression("Partenaire "+p.code);
  h += `<div class="outils">
    <span class="pill p-or" style="font-size:14px;padding:6px 14px">${esc(p.code)}</span>
    <b style="color:var(--vert)">${esc(p.nom)}</b>
    ${["Blacklisté","Suspendu"].includes(p.statut)?pill(p.statut,"p-rouge"):pillStatut(p.statut)}
    <span style="flex:1"></span>
    <button class="btn doux" onclick="ouvrirForm('partenaires','${code}')">Modifier</button>
    <button class="btn doux" onclick="formEnvoyerMessage('partenaire','${code}')">✉ Message</button>
  </div>`;
  if(["Blacklisté","Suspendu"].includes(p.statut)) h += `<div class="pastille-doublon">⚠ Partenaire ${p.statut.toLowerCase()} — sa sélection dans un nouvel arrivage nécessite une autorisation Direction.</div>`;
  h += `<div class="fiche-grille">`;
  h += `<div class="bloc-fiche"><h4>Identité légale</h4><div class="kv">
    ${ligneKV("Type", pill(p.type||"—","p-or"))}${ligneKV("Pays", esc(p.pays||"—"))}${ligneKV("Adresse", esc(p.adresse||"—"))}
    ${ligneKV("ICE / IF / RC", esc(p.ice||"—")+" / "+esc(p.idFiscal||"—")+" / "+esc(p.rc||"—"))}
    ${ligneKV("Agrément / Licence", esc(p.agrement||"—")+" / "+esc(p.licence||"—"))}
  </div></div>`;
  h += `<div class="bloc-fiche"><h4>Contact & conditions</h4><div class="kv">
    ${ligneKV("Interlocuteur", esc(p.contact||"—"))}${ligneKV("Téléphone / WhatsApp", esc(p.telephone||"—")+" / "+esc(p.whatsapp||"—"))}
    ${ligneKV("E-mail", esc(p.email||"—"))}${ligneKV("Conditions de paiement", esc(p.conditionsPaiement||"—"))}
    ${ligneKV("Devises", esc(p.devises||"—"))}${ligneKV("Free time", esc(p.freeTime||"—"))}${ligneKV("Surestaries", esc(p.surestariesTarif||"—"))}
    ${ligneKV("Délais habituels", esc(p.delais||"—"))}
  </div></div>`;
  h += `<div class="bloc-fiche large"><h4>Services & capacités</h4><div class="kv">
    ${ligneKV("Services proposés", esc(p.services||"—"))}${ligneKV("Capacités", esc(p.capacites||"—"))}
  </div></div>`;
  h += `<div class="bloc-fiche"><h4>Performance (calculée)</h4><div class="kv">
    ${ligneKV("Arrivages liés", String(perf.arrivages))}${ligneKV("Retards ETA", String(perf.retards))}
    ${ligneKV("Fiabilité ETA", perf.fiabiliteEta!==null?perf.fiabiliteEta+"%":"—")}${ligneKV("Réclamations liées", String(perf.litiges))}
    ${ligneKV("Niveau", pill(perf.niveau, perf.niveau==="Recommandé"?"p-vert":perf.niveau==="À risque"||perf.niveau==="Blacklisté"?"p-rouge":"p-ambre"))}
  </div></div>`;
  const arrLies = DB.arrivages.filter(a=>[a.transitaire,a.transporteur,a.compagnie].includes(p.code));
  h += tableFiche("Arrivages liés", arrLies, [
    ["Code",o=>`<a class="lien" href="#ficheArrivage:${esc(o.code)}">${esc(o.code)}</a>`],["Statut",o=>pillStatut(o.statut)],["ETA",o=>esc(o.etaPrevue||"—")]]);
  h += rendreFilDiscussion("partenaire", code);
  const hist = DB.audit.filter(a=>a.objet===code);
  h += tableFiche("Historique", hist, [
    ["Date",o=>esc(o.date)+" "+esc(o.heure)],["Utilisateur",o=>esc(o.utilisateur)],["Action",o=>esc(o.action)],["Détail",o=>esc(String(o.apres).slice(0,50))]], true);
  h += `</div>`;
  document.getElementById("main").innerHTML = h;
}
/* --- Migration : anciens transitaire/transporteur/compagnie texte libre → référentiel Partenaires --- */
function migrerPartenairesTexte(){
  if(DB._migrationPartenairesFaite) return;
  const parNom = {}; DB.partenaires.forEach(p=>parNom[normCol(p.nom)]=p);
  const rattacher = (val, typeParDefaut) => {
    if(!val || val.length<2) return val;
    const cle = normCol(val);
    if(parNom[cle]) return parNom[cle].code; // déjà migré ou référence déjà un partenaire existant
    const p = {code:genCode("PAR"), nom:val, type:typeParDefaut, statut:"À réévaluer",
      remarque:"Migré automatiquement depuis un ancien arrivage (texte libre) : « "+val+" ».", par:"Migration automatique", ts:Date.now()};
    DB.partenaires.push(p);
    parNom[cle] = p;
    audit("Partenaires","Création (migration)",p.code,"—","—","Ancienne valeur texte : "+val);
    return p.code;
  };
  let n = 0;
  DB.arrivages.forEach(a=>{
    if(a.transitaire && !a.transitaire.startsWith("PAR")){ const av=a.transitaire; a.transitaire = rattacher(av,"Transitaire"); if(a.transitaire!==av){ audit("Arrivages","Transitaire migré vers Partenaires",a.code,"transitaire",av,a.transitaire,a.code); n++; } }
    if(a.transporteur && !a.transporteur.startsWith("PAR")){ const av=a.transporteur; a.transporteur = rattacher(av,"Transporteur international"); if(a.transporteur!==av){ audit("Arrivages","Transporteur migré vers Partenaires",a.code,"transporteur",av,a.transporteur,a.code); n++; } }
    if(a.compagnie && !a.compagnie.startsWith("PAR")){ const av=a.compagnie; a.compagnie = rattacher(av,"Compagnie maritime"); if(a.compagnie!==av){ audit("Arrivages","Compagnie migrée vers Partenaires",a.code,"compagnie",av,a.compagnie,a.code); n++; } }
  });
  DB._migrationPartenairesFaite = true;
  if(n){ audit("Migration","Migration Partenaires terminée","—","—","—",n+" ancienne(s) valeur(s) texte rattachée(s) au référentiel Partenaires"); sauver(); }
}

/* ---------- Export / Import ---------- */
function exporterJSON(){
  if(!peut("exporter")){ toast("Permission refusée : export non autorisé."); return; }
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "ubos_export_"+new Date().toISOString().slice(0,10)+".json";
  a.click(); URL.revokeObjectURL(a.href);
  audit("Système","Export JSON","base complète","—","—", new Date().toLocaleString("fr-FR"));
  sauver(); toast("Export JSON téléchargé");
}
function importerJSON(input){
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d.seq || !d.dossiers) throw new Error("format");
      DB = Object.assign(baseVide(), d);
      if(!DB.utilisateurs || !DB.utilisateurs.length){
        DB.utilisateurs = [{code:"USR000001", nomComplet:"Direction Générale", identifiant:"direction", motDePasse:"ubos2026", poste:"Gérante", departement:"Direction", services:["Direction"], modules:[], permissions:{voir:1,ajouter:1,modifier:1,supprimer:1,valider:1,exporter:1}, actif:true, ts:Date.now()}];
      }
      const s2 = DB.utilisateurs.find(x=>x.identifiant===(SESSION&&SESSION.identifiant) && x.actif);
      SESSION = s2 || null; if(!SESSION){ localStorage.removeItem("ubos_session"); }
      else userCourant = SESSION.nomComplet;
      audit("Système","Import JSON", f.name, "—","—","base restaurée");
      sauver(); rendre(); toast("Import réussi : "+f.name);
    }catch(e){ toast("Fichier invalide : export UBOS attendu."); }
  };
  r.readAsText(f); input.value = "";
}

/* ---------- Routeur ---------- */
function rendre(garderFocus){
  if(!SESSION){ afficherLogin(); return; }
  rendreNav();
  if(vue==="dashboard") rendreDashboard();
  else if(vue==="monAgenda") rendreMonAgenda();
  else if(vue==="utilisateurs") rendreUtilisateurs();
  else if(vue==="performance") rendrePerformance();
  else if(vue==="importCentre") rendreImportCentre();
  else if(vue==="risquesClients") rendreRisquesClients();
  else if(vue.startsWith("ficheFF:")) rendreFicheFF(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("docFF:")){ const p=vue.split(":"); rendreDocFF(p[1], decodeURIComponent(p[2]||"")); }
  else if(vue.startsWith("dashUser:")){
    const u = DB.utilisateurs.find(x=>x.identifiant===decodeURIComponent(vue.split(":")[1]||""));
    if(estDirection() && u) rendrePersonnel(u, true); else { vue="dashboard"; rendreDashboard(); }
  }
  else if(vue==="notifications") rendreNotifs();
  else if(vue==="auditGlobal") rendreAudit();
  else if(vue==="rapportDirection") rendreRapportDirection();
  else if(vue==="rechercheGlobale") rendreRechercheGlobale();
  else if(vue.startsWith("ficheDossier:")) rendreFicheDossier(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("ficheClient:")) rendreFicheClient(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("ficheDemande:")) rendreFicheDemande(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("ligneDemande:")){ const p=vue.split(":"); rendreFicheLigneDemande(decodeURIComponent(p[1]||""), decodeURIComponent(p[2]||"")); }
  else if(vue.startsWith("ficheCommande:")) rendreFicheCommande(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("ficheArrivage:")) rendreFicheArrivage(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("ficheAnalyseLimex:")) rendreFicheAnalyseLimex(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("fichePartenaire:")) rendreFichePartenaire(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue.startsWith("ficheDocument:")) rendreFicheDocument(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue==="messagerie") rendreMessagerie();
  else if(vue.startsWith("docBL:")) rendreDocBonLancement(decodeURIComponent(vue.split(":")[1]||""));
  else if(vue==="dashboardLimex") rendreDashboardLimex();
  else if(vue==="rapportLimexDirection") rendreRapportLimexDirection();
  else if(vue.startsWith("ficheFournisseur:")) rendreFicheFournisseur(decodeURIComponent(vue.split(":")[1]||""));
  else if(MODS[vue] && MODS[vue].coll) rendreModule(vue);
  else { vue="dashboard"; rendreDashboard(); }
  if(!garderFocus) window.scrollTo(0,0);
}

});

/* ---------- Sauvegarde automatique ---------- */
function autoSauver(){
  sauver();
  try{ localStorage.setItem("ubos_backup", JSON.stringify({t:Date.now(), db:DB})); }catch(e){}
  const el = document.getElementById("sauveInfo");
  if(el) el.textContent = "Sauvegarde auto · " + new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
}
setInterval(autoSauver, 120000);
window.addEventListener("beforeunload", autoSauver);
autoSauver();

rendre();
