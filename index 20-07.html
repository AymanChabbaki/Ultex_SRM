let IMPORT_CTX = null;
let DERNIER_IMPORT = null;
function normCol(s){ return String(s??"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,""); }
const MAP_COLONNES = [
  [["codeclient","code"],"code"],
  [["service"],"service"],
  [["nomduclient","nomclient","nom"],"nom"],
  [["contactclient","contact","telephone","tel"],"contact"],
  [["steville","ste","ville","societe"],"ville"],
  [["produit","information de produit","nomduproduit"],"produit"],
  [["experience"],"experience"],
  [["fournisseurorigin","fournisseur","origin","origine"],"fournisseur"],
  [["quantite","qte"],"quantite"],
  [["liendelimage","lienimage","lien","image"],"lien"],
  [["observation","observations","obs","remarque"],"obs"]
];
function fmtDateCell(v){
  if(v instanceof Date && !isNaN(v)) return v.toLocaleDateString("fr-FR");
  const s = String(v??"").trim();
  return s.replace(" 00:00:00","");
}
function normTel(s){ return String(s??"").replace(/\D/g,"").replace(/^212/,"").replace(/^0+/,""); }
function analyserFeuilleImport(nomFeuille){
  const ws = IMPORT_CTX.wb.Sheets[nomFeuille];
  const grille = XLSX.utils.sheet_to_json(ws, {header:1, defval:"", raw:false, dateNF:"dd/mm/yyyy"});
  const plage = ws["!ref"] ? XLSX.utils.decode_range(ws["!ref"]) : {s:{r:0,c:0}};
  const celluleBrute = (r,c) => ws[XLSX.utils.encode_cell({r:plage.s.r+r, c:plage.s.c+c})];
  // Détection de la ligne d'entêtes (sur les 6 premières lignes)
  let idxEntete = -1, mapping = null, meilleurScore = 0;
  for(let r=0; r<Math.min(6, grille.length); r++){
    const m = {etats:[]}; let score = 0;
    grille[r].forEach((cell, ci)=>{
      const n = normCol(cell);
      if(!n) return;
      const me = n.match(/^etat(\d)/) || n.match(/^(\d)(?:er|eme)etat/);
      if(me){ m.etats.push({n:+me[1], col:ci}); score++; return; }
      for(const [alias, cle] of MAP_COLONNES){
        if(alias.includes(n) && m[cle]===undefined){ m[cle]=ci; score++; break; }
      }
    });
    if(score > meilleurScore){ meilleurScore = score; idxEntete = r; mapping = m; }
  }
  if(!mapping || meilleurScore < 3) return {erreurEntete:true, lignes:[], mapping:null, score:meilleurScore};
  const lignes = [];
  for(let r=idxEntete+1; r<grille.length; r++){
    const row = grille[r];
    const get = k => mapping[k]===undefined ? "" : String(row[mapping[k]]??"").trim();
    const code = get("code"), nom = get("nom"), contact = get("contact").replace(/\.0$/,"");
    if(!code && !nom && !contact) continue;
    const etats = [];
    mapping.etats.sort((a,b)=>a.n-b.n).forEach(e=>{
      const brute = celluleBrute(r, e.col);
      const dte = brute && brute.v instanceof Date ? brute.v.toLocaleDateString("fr-FR") : fmtDateCell(row[e.col]);
      const lib = String(row[e.col+1]??"").trim();
      if(dte || lib) etats.push({n:e.n, date:dte, etat:lib});
    });
    lignes.push({code, nom, contact, ville:get("ville"), service:get("service"), produit:get("produit"),
      experience:get("experience"), fournisseur:get("fournisseur"), quantite:get("quantite").replace(/\.0$/,""),
      lien:get("lien"), obs:get("obs"), etats, ligne:r+1});
  }
  return {lignes, mapping, idxEntete, erreurEntete:false, score:meilleurScore};
}
function scoreFeuille(nom){ try{ return analyserFeuilleImport(nom).score||0; }catch(e){ return 0; } }
function ouvrirImportExcel(input){
  if(typeof XLSX === "undefined"){ toast("Bibliothèque Excel non chargée — vérifiez la connexion internet puis rechargez la page."); return; }
  const f = input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      IMPORT_CTX = {wb: XLSX.read(new Uint8Array(r.result), {type:"array", cellDates:true}), fichier:f.name};
      const feuilles = IMPORT_CTX.wb.SheetNames;
      let meilleure = feuilles[0], best = -1;
      feuilles.forEach(n=>{ const s = scoreFeuille(n); if(s>best){ best=s; meilleure=n; } });
      const m = document.getElementById("modale");
      m.innerHTML = `<header><h3>📥 Importer Excel — ${esc(f.name)}</h3><button onclick="fermer()">✕</button></header>
      <div class="corps">
        <div class="champ"><label>Feuille à importer</label>
          <select id="imp_feuille">${feuilles.map(n=>`<option ${n===meilleure?"selected":""}>${esc(n)}</option>`).join("")}</select></div>
        <div class="champ"><label>Si le code client existe déjà</label>
          <select id="imp_politique"><option value="ignorer">Ignorer</option><option value="maj">Mettre à jour</option><option value="creer">Créer nouveau (nouveau code)</option><option value="demander">Me demander</option></select></div>
        <div class="champ large" id="imp_apercu" style="color:var(--gris)">La feuille « ${esc(meilleure)} » semble correspondre au modèle DATA.xlsx (colonnes reconnues : ${best}).</div>
      </div>
      <footer><button class="btn doux" onclick="fermer()">Annuler</button><button class="btn" onclick="analyserImport()">Analyser le fichier</button></footer>`;
      m.classList.add("large");
      document.getElementById("voile").classList.add("on");
    }catch(e){ toast("Fichier illisible : format Excel attendu (.xlsx)."); }
  };
  r.readAsArrayBuffer(f); input.value = "";
}
function analyserImport(){
  const feuille = document.getElementById("imp_feuille").value;
  const politique = document.getElementById("imp_politique").value;
  const res = analyserFeuilleImport(feuille);
  if(res.erreurEntete){ document.getElementById("imp_apercu").innerHTML = `<b style="color:var(--rouge)">Colonnes non reconnues sur « ${esc(feuille)} »</b> — cette feuille ne suit pas le modèle (Code client, Nom du client, Contact client…). Choisissez une autre feuille.`; return; }
  const parCode = {}; DB.clients.forEach(c=>parCode[c.code]=c);
  const parTel = {}; DB.clients.forEach(c=>{ const t=normTel(c.telephone); if(t) parTel[t]=c; });
  const nouveaux = [], doublons = [], erreurs = [];
  res.lignes.forEach(l=>{
    if(!l.nom && !l.contact){ erreurs.push(l); return; }
    const t = normTel(l.contact);
    if(l.code && parCode[l.code]){ l._cible = parCode[l.code]; l._motif="code"; doublons.push(l); }
    else if(t && parTel[t]){ l._cible = parTel[t]; l._motif="téléphone"; doublons.push(l); }
    else nouveaux.push(l);
  });
  IMPORT_CTX.analyse = {feuille, politique, nouveaux, doublons, erreurs};
  // Prévisualisation : 10 premières lignes
  let html = `<b>Prévisualisation — 10 premières lignes de « ${esc(feuille)} »</b>
  <div class="defile" style="border:1px solid var(--bord);border-radius:9px;margin:8px 0"><table>
    <tr><th>Code</th><th>Nom</th><th>Téléphone</th><th>Ville/Sté</th><th>Produit demandé</th><th>Qté</th><th>Exp.</th><th>Fournisseur</th><th>Dernier état</th><th>Sort</th></tr>` +
    res.lignes.slice(0,10).map(l=>{
      const dernier = l.etats.length ? l.etats[l.etats.length-1] : null;
      const sort = (!l.nom && !l.contact) ? pill("Erreur","p-rouge") : (l._cible ? pill("Doublon ("+l._motif+")","p-ambre") : pill("Nouveau","p-vert"));
      return `<tr><td class="code">${esc(l.code||"auto")}</td><td>${esc(String(l.nom||"").slice(0,20))}</td><td>${esc(l.contact)}</td><td>${esc(String(l.ville||"").slice(0,14))}</td><td>${esc(String(l.produit||"").slice(0,22))}</td><td>${esc(l.quantite)}</td><td>${esc(l.experience)}</td><td>${esc(String(l.fournisseur||"").slice(0,12))}</td><td>${dernier?esc(dernier.date+" "+dernier.etat).slice(0,24):"—"}</td><td>${sort}</td></tr>`;
    }).join("") + `</table></div>`;
  html += `<div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px">
    ${pill(res.lignes.length+" lignes lues","p-gris")} ${pill(nouveaux.length+" nouveaux clients","p-vert")}
    ${pill(doublons.length+" doublons (code ou téléphone)","p-ambre")} ${pill(erreurs.length+" erreurs (sans nom ni contact)","p-rouge")}</div>`;
  if(politique==="demander" && doublons.length){
    html += `<div style="max-height:160px;overflow-y:auto;border:1px solid var(--bord);border-radius:9px;padding:8px">
      <label style="display:block;font-weight:600;margin-bottom:6px"><input type="checkbox" onchange="document.querySelectorAll('.imp_dbl').forEach(c=>c.checked=this.checked)"> Tout mettre à jour</label>` +
      doublons.slice(0,200).map((l,i)=>`<label style="display:block;font-size:12px;padding:2px 0"><input type="checkbox" class="imp_dbl" data-i="${i}"> ${esc(l.code||(l._cible?l._cible.code+" (même téléphone)":""))} — ${esc(l.nom||l.contact)} (cocher = mettre à jour, sinon ignorer)</label>`).join("") +
      (doublons.length>200?`<div style="color:var(--gris)">… ${doublons.length-200} autres doublons (non cochés = ignorés)</div>`:"") + `</div>`;
  }
  document.getElementById("imp_apercu").innerHTML = html +
    `<div style="margin-top:10px;color:var(--gris)">Pour chaque ligne appliquée : fiche <b>Client</b> (code manuel conservé, états 1-5 en historique) + <b>Lead / demande</b> (produit, quantité, expérience, source, observation). Produits et fournisseurs inexistants créés automatiquement. Tout est journalisé dans l'audit.</div>`;
  const pied = document.querySelector("#modale footer");
  const nb = nouveaux.length + (politique==="ignorer"?0:doublons.length);
  if(pied) pied.innerHTML = `<button class="btn doux" onclick="fermer()">Annuler</button><button class="btn or" onclick="confirmerImport()">Confirmer l'importation (${nb} lignes)</button>`;
}
function confirmerImport(){
  const A = IMPORT_CTX.analyse; if(!A) return;
  const majSelection = new Set();
  if(A.politique==="demander") document.querySelectorAll(".imp_dbl").forEach(c=>{ if(c.checked) majSelection.add(+c.dataset.i); });
  // Générateur de codes rapide (Set en mémoire — indispensable pour des milliers de lignes)
  const codesPris = new Set();
  COLLS.forEach(c=>(DB[c]||[]).forEach(o=>codesPris.add(o.code)));
  const annee = new Date().getFullYear();
  function genRapide(pfx){
    const avecAnnee = PFX_ANNEE.includes(pfx);
    const cle = avecAnnee ? pfx+annee : pfx;
    let code;
    do{ DB.seq[cle]=(DB.seq[cle]||0)+1; const n=String(DB.seq[cle]).padStart(6,"0"); code = avecAnnee?(pfx+annee+"-"+n):(pfx+n); }while(codesPris.has(code));
    codesPris.add(code); return code;
  }
  const prodParNom = {}; DB.produits.forEach(p=>prodParNom[normCol(p.designation)]=p);
  const fourParNom = {}; DB.fournisseurs.forEach(f=>fourParNom[normCol(f.nom)]=f);
  const demandesClient = {}; DB.demandes.forEach(dm=>{ if(dm.client) (demandesClient[dm.client]=demandesClient[dm.client]||new Set()).add(normCol((dm.lignes&&dm.lignes[0]&&dm.lignes[0].produitService)||"").slice(0,40)); });
  const inutile = v => { const n=normCol(v); return !n || ["oui","non","","-","na"].includes(n); };
  let crees=0, maj=0, ignores=0, erreursN=A.erreurs.length, prodCrees=0, fourCrees=0, demandesCreees=0, reattribues=0;
  const noteDe = l => {
    const parts = [];
    if(l.obs) parts.push("Observation : "+l.obs);
    if(l.service) parts.push("Service : "+l.service);
    if(l.experience) parts.push("Expérience import : "+l.experience);
    if(l.lien) parts.push("Image : "+l.lien);
    return parts.join(" · ");
  };
  const creerRefs = l => {
    if(!inutile(l.produit) && l.produit.length>2 && !prodParNom[normCol(l.produit)]){
      const p = {code:genRapide("P"), designation:l.produit, remarque:"Créé par import Excel ("+IMPORT_CTX.fichier+")", par:userCourant, ts:Date.now()};
      DB.produits.push(p); prodParNom[normCol(l.produit)] = p; prodCrees++;
      audit("Produits","Création (import)",p.code,"—","—",l.produit);
    }
    if(!inutile(l.fournisseur) && l.fournisseur.length>2 && !fourParNom[normCol(l.fournisseur)]){
      const f = {code:genRapide("F"), nom:l.fournisseur, statut:"En test", remarque:"Créé par import Excel ("+IMPORT_CTX.fichier+")", par:userCourant, ts:Date.now()};
      DB.fournisseurs.push(f); fourParNom[normCol(l.fournisseur)] = f; fourCrees++;
      audit("Fournisseurs","Création (import)",f.code,"—","—",l.fournisseur);
    }
  };
  const creerDemandeDepuisImport = (l, clientCode) => {
    if(inutile(l.produit) && !l.obs) return;
    const cle = normCol(l.produit).slice(0,40);
    if(l.produit && demandesClient[clientCode] && demandesClient[clientCode].has(cle)) return; // demande déjà connue
    const dm = {code:genRapide("DMD"), client:clientCode, dateDemande:new Date().toISOString().slice(0,10), responsableData:userCourant,
      source:l.service||"Import Excel", objectifGeneral:"Demande importée depuis "+IMPORT_CTX.fichier, urgence:"Normale",
      statut: l.etats.length ? "Non confirmée" : "En cours d'étude", remarqueGenerale:l.obs||"", lignes:[], _seqLigne:0, par:userCourant, ts:Date.now()};
    let besoin = l.produit || "Demande importée";
    if(l.experience){ const e=normCol(l.experience); besoin += e==="oui" ? " (a déjà importé)" : e==="non" ? " (première importation)" : ""; }
    dm.lignes.push({id:"dl1_"+Date.now()+Math.random().toString(36).slice(2,5), code:genCodeLigneDemande(dm.code, dm), produitService:besoin.slice(0,200),
      quantite:l.quantite||"", statut:"Nouvelle", route:[], fournisseurConnu:inutile(l.fournisseur)?"Non":"Oui", proformaDisponible:"Non",
      consultationsFournisseurs:[], selection:null, statutConfirmation:"Non confirmée", ts:Date.now()});
    DB.demandes.push(dm);
    (demandesClient[clientCode]=demandesClient[clientCode]||new Set()).add(cle);
    demandesCreees++;
    audit("Demandes","Création (import)",dm.code,"client",clientCode,l.produit||"demande");
  };
  const creerClient = (l, forcerNouveau) => {
    let code = l.code;
    if(forcerNouveau || !code || codesPris.has(code)){
      if(code && (forcerNouveau || codesPris.has(code))){ l.obs = (l.obs?l.obs+" · ":"")+"Code d'origine Excel : "+code; if(!forcerNouveau) reattribues++; }
      code = genRapide("C");
    } else { codesPris.add(code); }
    const c = {code, nom:l.nom||("Client "+code), telephone:l.contact, ville:l.ville, segment:"Client",
      remarque:noteDe(l), historiqueEtats:l.etats, par:userCourant, ts:Date.now()};
    DB.clients.push(c); crees++;
    audit("Clients","Création (import)",code,"—","—",(l.nom||l.contact)+" — "+IMPORT_CTX.fichier);
    creerRefs(l); creerDemandeDepuisImport(l, code);
  };
  A.nouveaux.forEach(l=>creerClient(l, false));
  A.doublons.forEach((l,i)=>{
    if(A.politique==="creer"){ creerClient(l, true); return; }
    const faireMaj = A.politique==="maj" || (A.politique==="demander" && majSelection.has(i));
    if(!faireMaj){ ignores++; return; }
    const c = l._cible;
    if(!c){ ignores++; return; }
    if(l.nom && c.nom!==l.nom){ audit("Clients","Mise à jour (import)",c.code,"nom",c.nom,l.nom); c.nom=l.nom; }
    if(l.contact && c.telephone!==l.contact){ audit("Clients","Mise à jour (import)",c.code,"telephone",c.telephone,l.contact); c.telephone=l.contact; }
    if(l.ville && c.ville!==l.ville){ audit("Clients","Mise à jour (import)",c.code,"ville",c.ville,l.ville); c.ville=l.ville; }
    const note = noteDe(l);
    if(note){ c.remarque = c.remarque ? c.remarque+"\n[Import "+new Date().toLocaleDateString("fr-FR")+"] "+note : note; }
    if(l.etats.length){ c.historiqueEtats = (c.historiqueEtats||[]).concat(l.etats); audit("Clients","Mise à jour (import)",c.code,"historiqueEtats","—",l.etats.length+" état(s) ajouté(s)"); }
    creerRefs(l); creerDemandeDepuisImport(l, c.code); maj++;
  });
  audit("Centre d'importation","Import Excel", IMPORT_CTX.fichier+" ("+A.feuille+")","résultat","—",
    `${crees} clients · ${demandesCreees} demandes · ${prodCrees} produits · ${fourCrees} fournisseurs · ${maj} mis à jour · ${ignores} doublons ignorés · ${erreursN} erreurs`);
  DERNIER_IMPORT = {fichier:IMPORT_CTX.fichier, feuille:A.feuille, quand:new Date().toLocaleString("fr-FR"),
    crees, maj, ignores, erreurs:erreursN, prodCrees, fourCrees, demandesCreees, reattribues,
    lignesErreur:A.erreurs.slice(0,20).map(l=>l.ligne)};
  notifier("Direction", `Import Excel terminé : ${crees} clients, ${demandesCreees} demandes, ${prodCrees} produits, ${fourCrees} fournisseurs — ${ignores} doublons ignorés, ${erreursN} erreurs (${IMPORT_CTX.fichier}).`, "Centre d'importation");
  IMPORT_CTX = null;
  sauver(); fermer(); vue="importCentre"; location.hash="importCentre"; rendre();
  toast(`Import terminé : ${crees} clients, ${demandesCreees} demandes créées`);
}

const SEUIL_REDUCTION_PCT = 5, SEUIL_REDUCTION_MAD = 5000, SEUIL_ECART_DEVIS_PCT = 5;
const CATEGORIES_FF = ["Valeur marchandise","Transport international","Transport national","Droits de douane","Magasinage","Surestaries","Transit","Certification","Frais bancaires","Frais de service ULTEx","Autre"];
const STATUTS_LIGNE = ["Estimée","Réelle","Justifiée","Contestée","Annulée"];
function calculerLigne(l){
  l.quantite = l.quantite===""||l.quantite===undefined ? 1 : +l.quantite;
  l.prixUnitaire = +l.prixUnitaire||0;
  l.tauxTVA = l.tauxTVA===""||l.tauxTVA===undefined ? 0 : +l.tauxTVA;
  l.montantHT = Math.round((l.quantite*l.prixUnitaire)*100)/100;
  l.montantTVA = Math.round(l.montantHT*(l.tauxTVA/100)*100)/100;
  l.montantTTC = Math.round((l.montantHT+l.montantTVA)*100)/100;
  return l;
}
function calculFF(f){
  const lignes = f.lignes||[];
  const actives = lignes.filter(l=>l.statut!=="Annulée");
  const totalHT = actives.reduce((s,l)=>s+(+l.montantHT||0),0);
  const totalTVA = actives.reduce((s,l)=>s+(+l.montantTVA||0),0);
  const totalTTC = actives.reduce((s,l)=>s+(+l.montantTTC||0),0);
  const reducValidees = (f.reductions||[]).filter(r=>r.statut==="Validée").reduce((s,r)=>s+(+r.montant||0),0);
  const reducAttente = (f.reductions||[]).filter(r=>r.statut==="En attente").reduce((s,r)=>s+(+r.montant||0),0);
  const avoirs = DB.avoirsFF.filter(a=>a.facture===f.code).reduce((s,a)=>s+(+a.montant||0),0);
  const paiementsUBOS = DB.paiements.filter(p=>p.dossier===f.dossier && p.statut==="Payé" && ["Acompte","Solde","Reliquat"].includes(p.nature)).reduce((s,p)=>s+(+p.montant||0),0);
  const paiementsHorsSysteme = +f.paiementsHorsSysteme||0;
  const paiementsRecus = paiementsUBOS + paiementsHorsSysteme;
  const remboursements = DB.remboursements.filter(r=>r.facture===f.code && r.statut==="Effectué").reduce((s,r)=>s+(+r.montant||0),0);
  const soldeDu = totalTTC - reducValidees - avoirs - paiementsRecus + remboursements;
  const joursRetard = (f.echeance && soldeDu>0) ? Math.floor((Date.now()-new Date(f.echeance))/864e5) : 0;
  const devis = +f.devisInitial||0;
  const ecartDevis = devis ? totalTTC - devis : null;
  const ecartDevisPct = devis ? Math.round((totalTTC-devis)/devis*1000)/10 : null;
  return {lignes, actives, totalHT, totalTVA, totalTTC, reducValidees, reducAttente, avoirs, paiementsUBOS, paiementsHorsSysteme, paiementsRecus, remboursements, soldeDu, joursRetard, ecartDevis, ecartDevisPct};
}
function creerFactureDepuisDossier(codeDossier){

    reductions:[], reliquats:[], validee:false, par:userCourant, ts:Date.now()};
  DB.facturesFinales.push(f);
  audit("Facturation finale","Création",f.code,"dossier","—",codeDossier,codeDossier);
  sauver(); location.hash="ficheFF:"+f.code; toast(f.code+" créée depuis "+codeDossier+" ("+lignes.length+" lignes pré-remplies « Estimée », à vérifier)");

/* --- Contrôle de cohérence --- */
function verifierCoherence(f){
  const c = calculFF(f);
  const bloquants = [], avertissements = [];
  if(!f.dossier || !DB.dossiers.some(d=>d.code===f.dossier)) bloquants.push("Facture sans lien avec un dossier valide.");
  const actives = c.actives;
  const nonJustifiees = actives.filter(l=>l.statut!=="Justifiée");
  if(nonJustifiees.length) bloquants.push(`${nonJustifiees.length} ligne(s) active(s) non « Justifiée » (${nonJustifiees.map(l=>l.designation+" : "+l.statut).slice(0,4).join(", ")}${nonJustifiees.length>4?"…":""}) — toutes les lignes actives doivent être réelles et justifiées avant validation.`);
  const sansRef = actives.filter(l=>["Réelle","Justifiée"].includes(l.statut) && !l.reference);
  if(sansRef.length) bloquants.push(`${sansRef.length} ligne(s) réelle(s)/justifiée(s) sans référence de justificatif (${sansRef.map(l=>l.designation).slice(0,4).join(", ")}${sansRef.length>4?"…":""}).`);
  if((f.reductions||[]).some(r=>r.statut==="En attente")) bloquants.push("Réduction en attente de validation Direction.");
  if(f.statutMarchandise==="Soldé"){} // no-op guard
  if(f.statutFinal==="Soldé" && c.soldeDu>0.01) bloquants.push(`Statut « Soldé » alors qu'il reste ${fmtMAD(c.soldeDu)} dus.`);
  if(c.avoirs > c.totalTTC + 0.01) bloquants.push(`Avoirs (${fmtMAD(c.avoirs)}) supérieurs au total facturé (${fmtMAD(c.totalTTC)}).`);
  if(["Abandonnée par le client","Reprise par ULTEx"].includes(f.statutMarchandise)){
    const ab = DB.abandons.find(a=>a.facture===f.code);
    if(!ab) bloquants.push("Marchandise abandonnée / reprise : la fiche d'abandon-reprise n'a pas été créée.");
    else {
      if(!ab.docAbandon) bloquants.push("Abandon / reprise sans document justificatif (obligatoire).");
      if(!ab.valideeDirection) bloquants.push("Abandon / reprise sans validation de la Direction (obligatoire).");
    }
  }
  if(["Perte supportée par ULTEx","Clôturé avec perte"].includes(f.statutFinal)){
    const ab = DB.abandons.find(a=>a.facture===f.code);
    if(!ab || String(ab.perteFinale||"")==="" || !ab.perteValidee) bloquants.push("Perte finale non chiffrée ou non validée par la Direction.");
  }
  // Avertissements (non bloquants)
  const cles = {}; actives.forEach(l=>{ const k=normCol(l.designation)+"|"+l.categorie+"|"+l.montantTTC; cles[k]=(cles[k]||0)+1; });
  const doublons = Object.entries(cles).filter(([k,n])=>n>1);
  if(doublons.length) avertissements.push(`Doublon de frais possible : ${doublons.length} désignation(s)/montant(s) identiques répétés — vérifiez qu'il ne s'agit pas d'un double comptage.`);
  if(c.paiementsHorsSysteme>0){
    const dup = DB.paiements.some(p=>p.dossier===f.dossier && p.statut==="Payé" && Math.abs((+p.montant||0)-c.paiementsHorsSysteme)<0.5);
    if(dup) avertissements.push("Un paiement UBOS de même montant existe déjà — vérifiez que le paiement « hors système » n'est pas compté deux fois.");
  }
  if(c.soldeDu < -0.01 && DB.remboursements.filter(r=>r.facture===f.code).length===0)
    avertissements.push(`Solde négatif (${fmtMAD(c.soldeDu)}) sans remboursement enregistré — le client a trop payé.`);
  if(c.ecartDevisPct!==null && Math.abs(c.ecartDevisPct) > SEUIL_ECART_DEVIS_PCT)
    avertissements.push(`Écart entre le total final (${fmtMAD(c.totalTTC)}) et le devis initial (${fmtMAD(f.devisInitial)}) de ${c.ecartDevisPct>0?"+":""}${c.ecartDevisPct}% — supérieur au seuil de ${SEUIL_ECART_DEVIS_PCT}%.`);
  return {bloquants, avertissements};
}
function afficherCoherence(codeFF, modeValidation){
  const f = DB.facturesFinales.find(x=>x.code===codeFF); if(!f) return null;
  const r = verifierCoherence(f);

  const m = document.getElementById("modale");

  m.innerHTML = `<header><h3>Remboursement client — ${esc(codeFF)}</h3><button onclick="fermer()">✕</button></header>
  <div class="corps">
    <div class="champ"><label>Montant (MAD) *</label><input id="rb_mnt" type="number"></div>
    <div class="champ"><label>Statut</label><select id="rb_st"><option>À effectuer</option><option>Effectué</option></select></div>
    <div class="champ large"><label>Motif / référence bancaire *</label><textarea id="rb_motif"></textarea></div>
  </div><footer><button class="btn doux" onclick="fermer()">Annuler</button><button class="btn" onclick="sauverRemboursement('${codeFF}')">Enregistrer</button></footer>`;
  document.getElementById("voile").classList.add("on");
}
function sauverRemboursement(codeFF){
  const f = DB.facturesFinales.find(x=>x.code===codeFF); if(!f) return;
  const montant=+document.getElementById("rb_mnt").value||0, motif=document.getElementById("rb_motif").value.trim();
  if(!montant||!motif){ toast("Montant et motif obligatoires."); return; }
  const r = {code:genCode("RMB"), facture:codeFF, dossier:f.dossier, client:f.client, montant, motif,
    statut:document.getElementById("rb_st").value, date:new Date().toLocaleDateString("fr-FR"), par:userCourant, ts:Date.now()};
  DB.remboursements.push(r);
  audit("Facturation finale","Remboursement "+r.statut.toLowerCase(),r.code,"montant","—",fmtMAD(montant)+" — "+motif,f.dossier);
  notifier("Direction", `Remboursement ${r.code} (${r.statut}) de ${fmtMAD(montant)} sur ${codeFF}.`, "Facturation finale");
  sauver(); fermer(); rendre(); toast(r.code+" enregistré");
}
/* --- Abandon / reprise de marchandise --- */
const STATUTS_JURIDIQUES_ABANDON = ["À confirmer","Propriété du client","Propriété d'ULTEx","Litigieux / en discussion"];
function formAbandon(codeFF){
  const f = DB.facturesFinales.find(x=>x.code===codeFF); if(!f) return;
  const ab = DB.abandons.find(a=>a.facture===codeFF) || {};
  const c = calculFF(f);
  const m = document.getElementById("modale");
  const champ = (id,l,type,val) => `<div class="champ"><label>${l}</label><input id="${id}" type="${type||"text"}" value="${esc(val??"")}"></div>`;
  m.innerHTML = `<header><h3>Abandon / reprise de marchandise — ${esc(codeFF)}</h3><button onclick="fermer()">✕</button></header>
  <div class="corps">
    <div class="champ"><label>Type *</label><select id="ab_type"><option ${ab.type==="Reprise par ULTEx"?"selected":""}>Reprise par ULTEx</option><option ${!ab.type||ab.type==="Abandon par le client"?"selected":""}>Abandon par le client</option></select></div>
    ${champ("ab_date","Date *","date",ab.dateAbandon)}
    ${champ("ab_restant","Montant restant dû (MAD)","number",ab.montantRestantDu??Math.max(0,Math.round(c.soldeDu)))}
    ${champ("ab_frais","Frais déjà payés par ULTEx (MAD)","number",ab.fraisPayesUltex)}
    ${champ("ab_valeur","Valeur estimée de la marchandise (MAD)","number",ab.valeurEstimee)}
    ${champ("ab_lieu","Lieu de stockage","text",ab.lieuStockage)}
    ${champ("ab_cout","Coût du stockage (MAD/mois)","number",ab.coutStockage)}
    ${champ("ab_prop","Propriétaire économique (constat, non déduit)","text",ab.proprietaireEco)}
    <div class="champ"><label>Statut juridique *</label><select id="ab_juridique">${STATUTS_JURIDIQUES_ABANDON.map(s=>`<option ${(ab.statutJuridique||"À confirmer")===s?"selected":""}>${s}</option>`).join("")}</select></div>
    <div class="champ"><label>Document justificatif *</label><select id="ab_doc"><option value="">—</option>${DB.documents.filter(x=>x.dossier===f.dossier||!x.dossier).map(x=>`<option value="${esc(x.code)}" ${x.code===ab.docAbandon?"selected":""}>${esc(x.nom+" · "+x.code)}</option>`).join("")}</select></div>
    ${champ("ab_mainlevee","Mainlevée (réf. / date)","text",ab.mainlevee)}
    ${champ("ab_med","Mise en demeure (réf. / date)","text",ab.miseEnDemeure)}
    <div class="champ"><label>Statut contentieux</label><select id="ab_cont">${["Aucun","Pré-contentieux","Avocat saisi","Huissier","Procédure en cours","Jugement obtenu","Clos"].map(s=>`<option ${ab.statutContentieux===s?"selected":""}>${s}</option>`).join("")}</select></div>
    ${champ("ab_perte","Perte finale constatée (MAD)","number",ab.perteFinale)}
    <div class="champ large"><label>Motif *</label><textarea id="ab_motif">${esc(ab.motif||"")}</textarea></div>
    <div class="champ large"><label>Décision de la Direction</label><textarea id="ab_decision">${esc(ab.decisionDirection||"")}</textarea></div>
    <div class="champ large" style="color:var(--gris);font-size:12px">Le document justificatif et la validation Direction sont obligatoires pour que cette fiche soit prise en compte dans la facture finale. Aucune propriété n'est déduite automatiquement : le statut juridique reste « À confirmer » tant qu'il n'est pas modifié manuellement.</div>
  </div>
  <footer><button class="btn doux" onclick="fermer()">Annuler</button><button class="btn" onclick="sauverAbandon('${codeFF}')">Enregistrer</button></footer>`;
  document.getElementById("voile").classList.add("on");
}
function sauverAbandon(codeFF){
  const f = DB.facturesFinales.find(x=>x.code===codeFF); if(!f) return;
  const g = id => document.getElementById(id).value.trim();
  if(!g("ab_date") || !g("ab_motif")){ toast("Date et motif obligatoires."); return; }
  let ab = DB.abandons.find(a=>a.facture===codeFF);
  const nouveau = !ab;
  if(!ab){ ab = {code:genCode("ABD"), facture:codeFF, dossier:f.dossier, client:f.client, statutJuridique:"À confirmer", par:userCourant, ts:Date.now()}; DB.abandons.push(ab); }
  const maj = {type:g("ab_type"), dateAbandon:g("ab_date"), motif:g("ab_motif"), montantRestantDu:g("ab_restant"), fraisPayesUltex:g("ab_frais"),
    valeurEstimee:g("ab_valeur"), lieuStockage:g("ab_lieu"), coutStockage:g("ab_cout"), proprietaireEco:g("ab_prop"),
    statutJuridique:g("ab_juridique"), decisionDirection:g("ab_decision"), docAbandon:g("ab_doc"), mainlevee:g("ab_mainlevee"),
    miseEnDemeure:g("ab_med"), statutContentieux:g("ab_cont"), perteFinale:g("ab_perte")};
  for(const k in maj){ if(String(ab[k]??"")!==String(maj[k]??"")){ audit("Facturation finale", nouveau?"Abandon/reprise déclaré(e)":"Abandon/reprise modifié(e)", ab.code, k, ab[k], maj[k], f.dossier); ab[k]=maj[k]; } }
  if(nouveau){ notifier("Direction", `⚠ ${ab.type} déclaré(e) : ${ab.code} sur ${f.dossier} — document et votre validation requis avant toute clôture. Statut juridique : à confirmer.`, "Facturation finale"); }
  sauver(); fermer(); rendre(); toast(ab.code+" enregistré — pensez à mettre à jour le statut de la marchandise sur la facture, et à faire valider par la Direction");
}
function validerAbandonDirection(codeABD){
  if(!estDirection()){ toast("Validation réservée à la Direction."); return; }
  const ab = DB.abandons.find(a=>a.code===codeABD); if(!ab) return;
  if(!ab.docAbandon){ toast("Document justificatif requis avant validation."); return; }
  ab.valideeDirection = true; ab.valideeDirectionPar = userCourant; ab.valideeDirectionLe = new Date().toLocaleDateString("fr-FR");
  audit("Facturation finale","Abandon/reprise validé(e) par la Direction",ab.code,"valideeDirection","non validée","validée",ab.dossier);
  sauver(); rendre(); toast("Abandon / reprise validé(e) par la Direction");
}
function validerPerte(codeABD){
  if(!estDirection()){ toast("Validation de perte réservée à la Direction."); return; }
  const ab = DB.abandons.find(a=>a.code===codeABD); if(!ab) return;
  ab.perteValidee = true; ab.perteValideePar = userCourant; ab.perteValideeLe = new Date().toLocaleDateString("fr-FR");
  audit("Facturation finale","Perte validée (Direction)",ab.code,"perteFinale","non validée",fmtMAD(ab.perteFinale),ab.dossier);
  sauver(); rendre(); toast("Perte finale validée");
}
/* --- Impayé --- */
function ouvrirImpaye(codeFF){
  const f = DB.facturesFinales.find(x=>x.code===codeFF); if(!f) return;
  let imp = DB.impayes.find(i=>i.facture===codeFF);
  if(!imp){
    const c = calculFF(f);
    imp = {code:genCode("IMP"), facture:codeFF, dossier:f.dossier, client:f.client, montantEchu:Math.max(0,Math.round(c.soldeDu)),
      relances:[], miseEnDemeure:"", avocat:"", promesse:"", echeancier:"", recouvre:0, irrecouvrable:0, statut:"Ouvert", par:userCourant, ts:Date.now()};
    DB.impayes.push(imp);
    audit("Facturation finale","Impayé ouvert",imp.code,"montantEchu","—",fmtMAD(imp.montantEchu),f.dossier);
    notifier("Direction", `Impayé ${imp.code} ouvert sur ${codeFF} — ${fmtMAD(imp.montantEchu)}.`, "Facturation finale");
    sauver();
  }
  formImpaye(imp.code);
}
function formImpaye(codeIMP){
  const imp = DB.impayes.find(i=>i.code===codeIMP); if(!imp) return;
  const f = DB.facturesFinales.find(x=>x.code===imp.facture);
  const jours = f && f.echeance ? Math.max(0, Math.floor((Date.now()-new Date(f.echeance))/864e5)) : 0;
  const m = document.getElementById("modale");
  m.innerHTML = `<header><h3>Impayé ${esc(codeIMP)} — ${jours} jour(s) de retard</h3><button onclick="fermer()">✕</button></header>
  <div class="corps">
    <div class="champ"><label>Montant échu (MAD)</label><input id="im_mnt" type="number" value="${esc(imp.montantEchu)}"></div>
    <div class="champ"><label>Mise en demeure (date/réf.)</label><input id="im_med" value="${esc(imp.miseEnDemeure)}"></div>
    <div class="champ"><label>Avocat / huissier</label><input id="im_av" value="${esc(imp.avocat)}"></div>
    <div class="champ"><label>Promesse de paiement (date)</label><input id="im_pro" value="${esc(imp.promesse)}"></div>
    <div class="champ"><label>Montant recouvré (MAD)</label><input id="im_rec" type="number" value="${esc(imp.recouvre)}"></div>
    <div class="champ"><label>Montant irrécouvrable (MAD)</label><input id="im_irr" type="number" value="${esc(imp.irrecouvrable)}"></div>
    <div class="champ large"><label>Échéancier (une ligne par échéance : date — montant)</label><textarea id="im_ech">${esc(imp.echeancier)}</textarea></div>
    <div class="champ large"><label>Historique des relances</label>
      <div style="border:1px solid var(--bord);border-radius:9px;padding:8px;max-height:110px;overflow-y:auto;font-size:12.5px">
      ${(imp.relances||[]).map(r=>`<div>• ${esc(r.date)} — ${esc(r.canal)} : ${esc(r.note)}</div>`).join("")||"Aucune relance."}</div>
      <div style="display:flex;gap:8px;margin-top:6px"><select id="im_canal" style="padding:8px;border:1px solid var(--bord);border-radius:8px"><option>WhatsApp</option><option>Téléphone</option><option>Email</option><option>Visite</option></select>
      <input id="im_note" placeholder="Note de relance" style="flex:1;padding:8px;border:1px solid var(--bord);border-radius:8px">
      <button class="btn mini" onclick="ajouterRelance('${codeIMP}')">+ Relance</button></div></div>
  </div>
  <footer><button class="btn doux" onclick="fermer()">Fermer</button><button class="btn" onclick="sauverImpaye('${codeIMP}')">Enregistrer</button></footer>`;
  document.getElementById("voile").classList.add("on");
}
function ajouterRelance(codeIMP){
  const imp = DB.impayes.find(i=>i.code===codeIMP); if(!imp) return;
  const note = document.getElementById("im_note").value.trim(); if(!note){ toast("Note de relance vide."); return; }
  imp.relances = imp.relances||[];
  imp.relances.push({date:new Date().toLocaleDateString("fr-FR"), canal:document.getElementById("im_canal").value, note, par:userCourant});
  audit("Facturation finale","Relance impayé",imp.code,"relance","—",note,imp.dossier);
  sauver(); formImpaye(codeIMP);
}
function sauverImpaye(codeIMP){
  const imp = DB.impayes.find(i=>i.code===codeIMP); if(!imp) return;
  const g = id => document.getElementById(id).value.trim();
  const maj = {montantEchu:g("im_mnt"), miseEnDemeure:g("im_med"), avocat:g("im_av"), promesse:g("im_pro"),
    recouvre:g("im_rec"), irrecouvrable:g("im_irr"), echeancier:g("im_ech")};
  for(const k in maj){ if(String(imp[k]??"")!==String(maj[k]??"")){ audit("Facturation finale","Impayé modifié",imp.code,k,imp[k],maj[k],imp.dossier); imp[k]=maj[k]; } }
  sauver(); fermer(); rendre(); toast(imp.code+" enregistré");
}
/* --- Fiche facture finale --- */
function ligneKV(l,v){ return `<div>${l}</div><div>${v}</div>`; }
function rendreTableLignesFF(f, editable){
  const c = calculFF(f);
  const styleStatut = s => s==="Justifiée"?"p-vert":s==="Réelle"?"p-or":s==="Contestée"?"p-rouge":s==="Annulée"?"p-gris":"p-ambre";
  let h = `<div class="defile"><table><tr><th></th><th>Désignation</th><th>Catégorie</th><th>Qté</th><th>PU</th><th>HT</th><th>TVA%</th><th>TVA</th><th>TTC</th><th>Fournisseur</th><th>Réf. justif.</th><th>Statut</th>${editable?"<th></th>":""}</tr>`+
  (f.lignes||[]).map((l,i)=>`<tr style="${l.statut==="Annulée"?"opacity:.5;text-decoration:line-through":""}">
    <td>${editable?`<button class="btn mini doux" style="padding:2px 6px" onclick="deplacerLigneFF('${f.code}','${l.id}',-1)" ${i===0?"disabled":""}>↑</button><button class="btn mini doux" style="padding:2px 6px" onclick="deplacerLigneFF('${f.code}','${l.id}',1)" ${i===(f.lignes.length-1)?"disabled":""}>↓</button>`:""}</td>
    <td><b>${esc(l.designation)}</b>${l.commentaire?`<br><small style="color:var(--gris)">${esc(l.commentaire)}</small>`:""}</td>
    <td>${pill(l.categorie||"—","p-gris")}</td>
    <td>${esc(l.quantite)}</td><td>${fmtMAD(l.prixUnitaire)}</td><td>${fmtMAD(l.montantHT)}</td><td>${l.tauxTVA}%</td><td>${fmtMAD(l.montantTVA)}</td><td><b>${fmtMAD(l.montantTTC)}</b></td>
    <td>${esc(l.fournisseur||"—")}</td><td>${l.reference?esc(l.reference):`<span style="color:var(--rouge)">manquant</span>`}</td>
    <td>${pill(l.statut,styleStatut(l.statut))}</td>
    ${editable?`<td><div class="acts"><button class="btn mini doux" onclick="formLigneFF('${f.code}','${l.id}')">Modifier</button><button class="btn mini rouge" onclick="supprimerLigneFF('${f.code}','${l.id}')">Suppr.</button></div></td>`:""}
  </tr>`).join("") +
  (!f.lignes||!f.lignes.length?`<tr><td colspan="${editable?13:12}" style="text-align:center;color:var(--gris);padding:16px">Aucune ligne. Ajoutez les frais réels du dossier.</td></tr>`:"") +
  `<tr style="background:#FBFCFA"><td colspan="5"></td><td><b>${fmtMAD(c.totalHT)}</b></td><td></td><td><b>${fmtMAD(c.totalTVA)}</b></td><td><b>${fmtMAD(c.totalTTC)}</b></td><td colspan="${editable?4:3}"></td></tr>`+
  `</table></div>`;
  return h;
}
function rendreFicheFF(code){
  const f = DB.facturesFinales.find(x=>x.code===code);
  let h = topbar("Facture finale");
  if(!f){ h += `<div class="panneau"><div class="vide"><b>Facture introuvable</b>${esc(code)}</div></div>`; document.getElementById("main").innerHTML=h; return; }
  const c = calculFF(f);
  const d = DB.dossiers.find(x=>x.code===f.dossier);
  const cl = DB.clients.find(x=>x.code===f.client);
  const ab = DB.abandons.find(a=>a.facture===code);
  const imp = DB.impayes.find(i=>i.facture===code);
  const off = DB.offres.filter(o=>o.dossier===f.dossier).sort((a,b)=>(b.ts||0)-(a.ts||0))[0];
  h += enteteImpression("Facture finale "+f.code);
  h += `<div class="outils">
    <span class="pill p-or" style="font-size:14px;padding:6px 14px">${esc(f.code)}</span>
    ${f.validee?pill("Validée le "+f.valideeLe,"p-vert"):pill("Brouillon","p-gris")}
    <span style="flex:1"></span>
    ${peut("modifier")?`<button class="btn doux" onclick="ouvrirForm('facturation','${code}')">Modifier l'entête</button>`:""}
    <button class="btn doux" onclick="afficherCoherence('${code}',false)">🔎 Vérifier la cohérence</button>
    ${!f.validee && peut("valider")?`<button class="btn" onclick="validerFF('${code}')">✓ Valider</button>`:""}
  </div>`;
  h += `<div class="fiche-grille">`;
  h += `<div class="bloc-fiche"><h4>Liens du dossier</h4><div class="kv">
    ${ligneKV("Code client", cl?`<a class="lien" href="#ficheClient:${esc(cl.code)}">${esc(cl.nom)} (${esc(cl.code)})</a>`:"—")}
    ${ligneKV("Code dossier", d?`<a class="lien" href="#ficheDossier:${esc(d.code)}">${esc(d.code)}</a>`:pill("MANQUANT","p-rouge"))}
    ${ligneKV("Devis initial (informatif)", fmtMAD(f.devisInitial)+(c.ecartDevisPct!==null?` <small style="color:${Math.abs(c.ecartDevisPct)>SEUIL_ECART_DEVIS_PCT?"var(--rouge)":"var(--gris)"}">écart ${c.ecartDevisPct>0?"+":""}${c.ecartDevisPct}%</small>`:""))}
    ${ligneKV("Contrat", (()=>{const ct=DB.documents.find(x=>x.dossier===f.dossier&&x.type==="Contrat");return ct?esc(ct.nom+" · "+ct.code):"—";})())}
    ${ligneKV("Statut marchandise", pill(f.statutMarchandise||"—", ["Abandonnée par le client","Reprise par ULTEx","En contentieux"].includes(f.statutMarchandise)?"p-rouge":"p-gris"))}
    ${ligneKV("Statut financier", pillStatut(f.statutFinal))}
    ${ligneKV("Échéance du solde", esc(f.echeance||"—")+(c.joursRetard>0?" "+pill("J+"+c.joursRetard,"p-rouge"):""))}
  </div></div>`;
  h += `<div class="bloc-fiche"><h4>A. Facture finale — synthèse</h4><div class="kv">
    ${ligneKV("Total HT", fmtMAD(c.totalHT))}
    ${ligneKV("Total TVA", fmtMAD(c.totalTVA))}
    ${ligneKV("<b>TOTAL TTC FACTURÉ</b>", `<b>${fmtMAD(c.totalTTC)}</b>`)}
    ${ligneKV("Lignes actives / justifiées", `${c.actives.length} active(s), dont ${c.actives.filter(l=>l.statut==="Justifiée").length} justifiée(s)`)}
  </div></div>`;
  h += `<div class="bloc-fiche large"><h4>Lignes de facture <button class="btn mini" style="float:right" onclick="formLigneFF('${code}','')">+ Ajouter une ligne</button></h4>`+
    rendreTableLignesFF(f, true) + `</div>`;
  h += `<div class="bloc-fiche large"><h4>B. État de compte / Reliquat</h4><div class="kv">
    ${ligneKV("Total facturé (TTC)", fmtMAD(c.totalTTC))}
    ${ligneKV("− Réductions validées", fmtMAD(c.reducValidees)+(c.reducAttente?` <span class="pill p-ambre">+ ${fmtMAD(c.reducAttente)} en attente Direction</span>`:""))}

  h += `<div class="bloc-fiche large"><h4>Réductions <button class="btn mini" style="float:right" onclick="formReduction('${code}')">+ Réduction</button></h4>`+

  h += tableFiche("Avoirs", DB.avoirsFF.filter(a=>a.facture===code), [
    ["Code",o=>`<span class="pill p-gris">${esc(o.code)}</span>`],["Date",o=>esc(o.date)],["Montant",o=>fmtMAD(o.montant)],["Motif",o=>esc(String(o.motif).slice(0,40))],["Imprimer",o=>`<a class="lien" href="#docFF:avoir:${esc(o.code)}">🖨 Avoir</a>`]]);
  h += tableFiche("Remboursements", DB.remboursements.filter(r=>r.facture===code), [
    ["Code",o=>`<span class="pill p-gris">${esc(o.code)}</span>`],["Date",o=>esc(o.date)],["Montant",o=>fmtMAD(o.montant)],["Statut",o=>pillStatut(o.statut==="Effectué"?"Validé":o.statut)],["Motif",o=>esc(String(o.motif).slice(0,35))]]);

  if(ab){
    const perteProvisoire = Math.max(0, (+ab.montantRestantDu||0) - (+ab.valeurEstimee||0));
    h += `<div class="kv">
      ${ligneKV("Fiche", `<span class="pill p-or">${esc(ab.code)}</span> — ${esc(ab.type||"Abandon par le client")} — <a class="lien" href="#docFF:abandon:${esc(ab.code)}">🖨 État financier d'abandon</a>`)}
      ${ligneKV("Date / Motif", esc(ab.dateAbandon)+" — "+esc(ab.motif))}
      ${ligneKV("Restant dû / Valeur estimée", fmtMAD(ab.montantRestantDu)+" / "+fmtMAD(ab.valeurEstimee))}
      ${ligneKV("Stockage", esc(ab.lieuStockage||"—")+" · "+fmtMAD(ab.coutStockage)+"/mois")}
      ${ligneKV("Propriétaire économique (constat)", esc(ab.proprietaireEco||"—"))}
      ${ligneKV("Statut juridique", pill(ab.statutJuridique||"À confirmer", ab.statutJuridique&&ab.statutJuridique!=="À confirmer"?"p-or":"p-ambre"))}
      ${ligneKV("Document justificatif", ab.docAbandon?esc(ab.docAbandon):pill("MANQUANT — bloque la validation","p-rouge"))}
      ${ligneKV("Validation Direction", ab.valideeDirection?pill("Validée le "+ab.valideeDirectionLe+" ("+esc(ab.valideeDirectionPar)+")","p-vert"):(estDirection()?`<button class="btn mini" onclick="validerAbandonDirection('${ab.code}')">Valider (Direction)</button>`:pill("Non validée — bloque la validation","p-rouge")))}
      ${ligneKV("Mainlevée / Mise en demeure", esc(ab.mainlevee||"—")+" / "+esc(ab.miseEnDemeure||"—"))}
      ${ligneKV("Contentieux", pill(ab.statutContentieux||"Aucun", ab.statutContentieux&&ab.statutContentieux!=="Aucun"?"p-rouge":"p-gris"))}
      ${ligneKV("Perte provisoire", fmtMAD(perteProvisoire))}
      ${ligneKV("Perte finale", fmtMAD(ab.perteFinale)+" "+(ab.perteValidee?pill("Validée Direction ("+esc(ab.perteValideePar)+")","p-vert"):(String(ab.perteFinale)!==""&&estDirection()?`<button class="btn mini" onclick="validerPerte('${ab.code}')">Valider la perte (Direction)</button>`:pill("Non validée","p-ambre"))))}
      ${ligneKV("Décision Direction", esc(ab.decisionDirection||"—"))}
    </div>`;
  } else h += `<div class="vide" style="padding:14px">Aucun abandon ni reprise déclaré(e).</div>`;
  h += `</div>`;
  h += `<div class="bloc-fiche large"><h4>Impayé <button class="btn mini rouge" style="float:right" onclick="ouvrirImpaye('${code}')">${imp?"Gérer l'impayé":"Ouvrir un impayé"}</button></h4>`;
  if(imp){
    h += `<div class="kv">
      ${ligneKV("Fiche", `<span class="pill p-or">${esc(imp.code)}</span> — <a class="lien" href="#docFF:impaye:${esc(imp.code)}">🖨 État d'impayé</a> · <a class="lien" href="#docFF:echeancier:${esc(imp.code)}">🖨 Échéancier</a> · <a class="lien" href="#docFF:med:${esc(imp.code)}">🖨 Mise en demeure</a>`)}
      ${ligneKV("Montant échu / Jours de retard", fmtMAD(imp.montantEchu)+" / "+pill("J+"+c.joursRetard,"p-rouge"))}
      ${ligneKV("Relances", (imp.relances||[]).length+" relance(s)"+((imp.relances||[]).length?" — dernière : "+esc(imp.relances[imp.relances.length-1].date):""))}
      ${ligneKV("Mise en demeure / Avocat", esc(imp.miseEnDemeure||"Non envoyée")+" / "+esc(imp.avocat||"—"))}
      ${ligneKV("Promesse de paiement", esc(imp.promesse||"—"))}
      ${ligneKV("Recouvré / Irrécouvrable", `<span style="color:var(--ok)">${fmtMAD(imp.recouvre)}</span> / <span style="color:var(--rouge)">${fmtMAD(imp.irrecouvrable)}</span>`)}
    </div>`;
  } else h += `<div class="vide" style="padding:14px">Aucun impayé ouvert. Alertes automatiques : J+1, J+3, J+7, J+15, J+30 après échéance.</div>`;
  h += `</div>`;
  h += `<div class="bloc-fiche large"><h4>Génération de documents</h4><div style="padding:12px;display:flex;flex-wrap:wrap;gap:8px">
    <a class="btn mini or" href="#docFF:facture:${esc(code)}">🖨 A. Facture finale</a>
    <a class="btn mini doux" href="#docFF:reliquat:${esc(code)}">🖨 B. État de compte / Reliquat</a>
    <a class="btn mini doux" href="#docFF:releve:${esc(code)}">🖨 Relevé complet client</a>
    <button class="btn mini doux" onclick="formAvoir('${code}')">🖨 Générer avoir</button>
    <a class="btn mini doux" href="#docFF:recu:${esc(code)}">🖨 Reçu</a>
    ${imp?`<a class="btn mini doux" href="#docFF:echeancier:${esc(imp.code)}">🖨 Échéancier</a>
    <a class="btn mini doux" href="#docFF:impaye:${esc(imp.code)}">🖨 État d'impayé</a>
    <a class="btn mini doux" href="#docFF:med:${esc(imp.code)}">🖨 Mise en demeure</a>`:""}
    ${ab?`<a class="btn mini doux" href="#docFF:abandon:${esc(ab.code)}">🖨 État d'abandon</a>
    <a class="btn mini doux" href="#docFF:perte:${esc(ab.code)}">🖨 Note de perte</a>`:""}
    <button class="btn mini doux" onclick="formRemboursement('${code}')">+ Remboursement</button>
  </div></div>`;
  const hist = DB.audit.filter(a=>a.objet===code || a.dossier===f.dossier && a.module==="Facturation finale");
  h += tableFiche("Historique (audit)", hist.slice(0,40), [
    ["Date",o=>esc(o.date)+" "+esc(o.heure)],["Utilisateur",o=>esc(o.utilisateur)],["Action",o=>esc(o.action)],["Champ",o=>esc(o.champ)],["Avant → Après",o=>esc(String(o.avant).slice(0,25))+" → "+esc(String(o.apres).slice(0,40))]], true);
  h += `</div>`;
  document.getElementById("main").innerHTML = h;
}
/* --- Documents imprimables --- */
function docCadre(titre, corps, retour){
  return topbar("Document") + `<div class="outils no-print"><a class="btn doux" href="#${retour}">← Retour</a><span style="flex:1"></span><button class="btn or" onclick="window.print()">🖨 Imprimer / PDF</button></div>
  <div class="bloc-fiche large"><div style="padding:26px">
  <div style="text-align:center;margin-bottom:18px"><div style="font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--vert);font-weight:700">ULTEx</div>
  <div style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gris)">Import · Export · Transit — Casablanca / Marrakech</div>
  <div style="font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--or);margin-top:10px">${esc(titre)}</div></div>
  ${corps}
  <div style="display:flex;justify-content:space-between;margin-top:34px;font-size:12.5px;color:var(--gris)">
    <div>Établi par : <b>${esc(userCourant)}</b><br>Le ${new Date().toLocaleDateString("fr-FR")}</div>
    <div style="text-align:center">Cachet & signature ULTEx<br><br>____________________</div>
    <div style="text-align:center">Signature client<br><br>____________________</div>
  </div></div></div>`;
}
function tableDoc(lignes){
  return `<table style="width:100%;border-collapse:collapse;font-size:13px">`+lignes.map(l=>`<tr><td style="padding:7px 10px;border:1px solid #ccc;${l[2]?"font-weight:700;background:#EAF2EE":""}">${l[0]}</td><td style="padding:7px 10px;border:1px solid #ccc;text-align:right;${l[2]?"font-weight:700;background:#EAF2EE":""}">${l[1]}</td></tr>`).join("")+`</table>`;
}
function rendreDocFF(type, ref){
  let f, retour, corps="", titre="";
  const parFacture = code => DB.facturesFinales.find(x=>x.code===code);
  if(["facture","reliquat","releve","recu"].includes(type)) f = parFacture(ref);
  if(type==="avoir"){ const a=DB.avoirsFF.find(x=>x.code===ref); f=a&&parFacture(a.facture);
    if(a&&f){ titre="AVOIR N° "+a.code;
      corps = `<p style="margin-bottom:10px">Client : <b>${esc(refLabel("clients",f.client,"nom"))}</b> · Dossier : ${esc(f.dossier)} · Facture : ${esc(f.code)}</p>`+
        tableDoc([["Motif de l'avoir", esc(a.motif)],["Date", esc(a.date)],["MONTANT DE L'AVOIR", fmtMAD(a.montant), 1]]); retour="ficheFF:"+f.code; } }
  else if(["impaye","echeancier","med"].includes(type)){ const i=DB.impayes.find(x=>x.code===ref); f=i&&parFacture(i.facture);
    if(i&&f){ const c=calculFF(f); retour="ficheFF:"+f.code;
      if(type==="impaye"){ titre="ÉTAT D'IMPAYÉ N° "+i.code;
        corps = `<p style="margin-bottom:10px">Client : <b>${esc(refLabel("clients",f.client,"nom"))}</b> · Dossier ${esc(f.dossier)} · Facture ${esc(f.code)} · Échéance ${esc(f.echeance||"—")}</p>`+
          tableDoc([["Montant échu",fmtMAD(i.montantEchu)],["Jours de retard","J+"+c.joursRetard],["Relances effectuées",(i.relances||[]).length+((i.relances||[]).length?" — dernière le "+esc(i.relances[i.relances.length-1].date):"")],["Mise en demeure",esc(i.miseEnDemeure||"Non envoyée")],["Avocat / huissier",esc(i.avocat||"—")],["Promesse de paiement",esc(i.promesse||"—")],["Montant recouvré",fmtMAD(i.recouvre)],["Montant irrécouvrable",fmtMAD(i.irrecouvrable)],["RESTE À RECOUVRER",fmtMAD(Math.max(0,(+i.montantEchu||0)-(+i.recouvre||0)-(+i.irrecouvrable||0))),1]]); }
      else if(type==="echeancier"){ titre="ÉCHÉANCIER DE PAIEMENT — "+i.code;
        const lignes = (i.echeancier||"").split("\n").filter(x=>x.trim()).map(l=>{const p=l.split(/[—-]/); return [esc((p[0]||"").trim()), esc((p[1]||"").trim())];});
        corps = `<p style="margin-bottom:10px">Client : <b>${esc(refLabel("clients",f.client,"nom"))}</b> · Facture ${esc(f.code)} · Montant échu : ${fmtMAD(i.montantEchu)}</p>`+
          (lignes.length?tableDoc(lignes.concat([["TOTAL", fmtMAD(i.montantEchu),1]])):"<p>Échéancier à définir dans la fiche impayé.</p>"); }
      else { titre="MISE EN DEMEURE — "+i.code;
        corps = `<p style="line-height:1.9">À l'attention de <b>${esc(refLabel("clients",f.client,"nom"))}</b>,<br><br>
        Malgré nos relances (${(i.relances||[]).length}), le solde de la facture <b>${esc(f.code)}</b> relative au dossier ${esc(f.dossier)}, d'un montant de <b>${fmtMAD(i.montantEchu)}</b>, échu depuis le ${esc(f.echeance||"—")} (J+${c.joursRetard}), demeure impayé.<br><br>
        Par la présente, la société ULTEx vous met en demeure de régler l'intégralité de cette somme sous <b>huit (8) jours</b> à compter de la réception de ce courrier. À défaut, nous nous réservons le droit d'engager toute procédure de recouvrement (huissier, action judiciaire), les frais étant à votre charge, et d'exercer notre droit de rétention sur la marchandise.<br><br>
        Veuillez agréer nos salutations distinguées.</p>`; } } }
  else if(["abandon","perte"].includes(type)){ const a=DB.abandons.find(x=>x.code===ref); f=a&&parFacture(a.facture);
    if(a&&f){ const c=calculFF(f); retour="ficheFF:"+f.code;
      const paye = c.paiementsRecus;
      const perteProv = Math.max(0,(+a.montantRestantDu||0)-(+a.valeurEstimee||0));
      if(type==="abandon"){ titre="ÉTAT FINANCIER D'ABANDON / REPRISE DE MARCHANDISE — "+a.code;
        corps = `<p style="margin-bottom:10px">Client : <b>${esc(refLabel("clients",f.client,"nom"))}</b> · Dossier ${esc(f.dossier)} · ${esc(a.type||"Abandon par le client")} le ${esc(a.dateAbandon)} — Motif : ${esc(a.motif)}</p>`+
          tableDoc([["Total facturé au dossier (TTC)",fmtMAD(c.totalTTC)],["Frais déjà payés par ULTEx",fmtMAD(a.fraisPayesUltex)],["Total payé par le client",fmtMAD(paye)],["Solde dû",fmtMAD(a.montantRestantDu)],["Valeur récupérable de la marchandise",fmtMAD(a.valeurEstimee)],["Lieu / coût de stockage",esc(a.lieuStockage||"—")+" · "+fmtMAD(a.coutStockage)+"/mois"],["Propriétaire économique (constat)",esc(a.proprietaireEco||"—")],["Statut juridique",esc(a.statutJuridique||"À confirmer")],["Validation Direction",a.valideeDirection?esc("Validée le "+a.valideeDirectionLe+" par "+a.valideeDirectionPar):"NON VALIDÉE"],["Mainlevée / Mise en demeure",esc(a.mainlevee||"—")+" / "+esc(a.miseEnDemeure||"—")],["Statut contentieux",esc(a.statutContentieux||"Aucun")],["PERTE PROVISOIRE",fmtMAD(perteProv),1],["PERTE FINALE"+(a.perteValidee?" (validée Direction)":" (non validée)"),fmtMAD(a.perteFinale),1],["Décision de la Direction",esc(a.decisionDirection||"—")]]); }
      else { titre="NOTE DE PERTE — "+a.code;
        corps = `<p style="margin-bottom:10px">Dossier ${esc(f.dossier)} · Client ${esc(refLabel("clients",f.client,"nom"))} · Facture ${esc(f.code)}</p>`+
          tableDoc([["Motif",esc(a.motif)],["Perte provisoire",fmtMAD(perteProv)],["PERTE FINALE SUPPORTÉE PAR ULTEx",fmtMAD(a.perteFinale),1],["Validation Direction",a.perteValidee?esc(a.perteValideePar+" le "+a.perteValideeLe):"NON VALIDÉE"]])+
          `<p style="margin-top:10px;font-size:12px;color:var(--gris)">Cette note alimente le Registre des erreurs et la comptabilité analytique du dossier.</p>`; } } }
  else if(f){
    const c = calculFF(f); retour="ficheFF:"+f.code;
    const cl = refLabel("clients",f.client,"nom");
    const actives = c.actives;
    if(type==="facture"){ titre="A. FACTURE FINALE N° "+f.code;
      corps = `<p style="margin-bottom:10px">Client : <b>${esc(cl)}</b> · Dossier : ${esc(f.dossier)} · Échéance : ${esc(f.echeance||"—")}</p>`+
        tableDoc(actives.map(l=>[esc(l.designation)+(l.quantite!==1?" (x"+l.quantite+")":""), fmtMAD(l.montantHT)]).concat([
          ["TOTAL HT",fmtMAD(c.totalHT),1],["TOTAL TVA",fmtMAD(c.totalTVA),1],["TOTAL TTC",fmtMAD(c.totalTTC),1]
        ]))+
        `<p style="margin-top:10px;font-size:12px;color:var(--gris)">Devis initial (référence informative, non inclus dans ce total) : ${fmtMAD(f.devisInitial)}${c.ecartDevisPct!==null?` — écart ${c.ecartDevisPct>0?"+":""}${c.ecartDevisPct}%`:""}.</p>`+
        (f.validee?"":`<p style="color:var(--rouge);margin-top:6px;font-size:12px">⚠ Document provisoire — facture non validée.</p>`); }
    else if(type==="reliquat"){
      f.reliquats = f.reliquats||[];
      let rel = f.reliquats[f.reliquats.length-1];
      if(!rel || Math.round(rel.montant)!==Math.round(c.soldeDu)){
        rel = {code:genCode("REL"), date:new Date().toLocaleDateString("fr-FR"), montant:Math.round(c.soldeDu)};
        f.reliquats.push(rel);
        audit("Facturation finale","État de reliquat généré",rel.code,"montant","—",fmtMAD(rel.montant),f.dossier);
        sauver();
      }
      titre="B. ÉTAT DE COMPTE / RELIQUAT N° "+rel.code;
      corps = `<p style="margin-bottom:10px">Client : <b>${esc(cl)}</b> · Dossier : ${esc(f.dossier)} · Facture finale : ${esc(f.code)}</p>`+
        tableDoc([["Total facturé (TTC)",fmtMAD(c.totalTTC)],["Réductions validées","− "+fmtMAD(c.reducValidees)],["Avoirs émis","− "+fmtMAD(c.avoirs)],["Paiements reçus","− "+fmtMAD(c.paiementsRecus)],["Remboursements effectués","+ "+fmtMAD(c.remboursements)],["SOLDE DÛ",fmtMAD(Math.round(c.soldeDu)),1],["Échéance",esc(f.echeance||"—")]]); }
    else if(type==="releve"){ titre="RELEVÉ CLIENT — "+esc(cl);
      const fs2 = DB.facturesFinales.filter(x=>x.client===f.client);
      const lignes = fs2.map(x=>{const cx=calculFF(x); return [esc(x.code)+" · "+esc(x.dossier), fmtMAD(Math.round(cx.soldeDu))];});
      const tot = fs2.reduce((s,x)=>s+calculFF(x).soldeDu,0);
      const pays = DB.paiements.filter(p=>p.statut==="Payé" && fs2.some(x=>x.dossier===p.dossier));
      corps = `<p style="margin-bottom:10px">Situation au ${new Date().toLocaleDateString("fr-FR")} — ${fs2.length} facture(s) finale(s), ${pays.length} paiement(s) reçus.</p>`+
        tableDoc(lignes.concat([["TOTAL DÛ PAR LE CLIENT",fmtMAD(Math.round(tot)),1]])); }
    else if(type==="recu"){ titre="REÇU DE PAIEMENTS — Facture "+f.code;
      const pays = DB.paiements.filter(p=>p.dossier===f.dossier && p.statut==="Payé" && ["Acompte","Solde","Reliquat"].includes(p.nature));
      corps = `<p style="margin-bottom:10px">Reçu de : <b>${esc(cl)}</b> · Dossier ${esc(f.dossier)}</p>`+
        tableDoc(pays.map(p=>[esc(p.code+" · "+p.nature+" · "+(p.paye_le||p.echeance||"")), fmtMAD(p.montant)]).concat((c.paiementsHorsSysteme)?[["Paiements hors système",fmtMAD(c.paiementsHorsSysteme)]]:[]).concat([["TOTAL REÇU",fmtMAD(c.paiementsRecus),1]]))+
        `<p style="margin-top:8px">ULTEx atteste avoir reçu la somme totale de <b>${fmtMAD(c.paiementsRecus)}</b>.</p>`; }
  }
  if(!corps){ document.getElementById("main").innerHTML = topbar("Document") + `<div class="panneau"><div class="vide"><b>Document introuvable</b></div></div>`; return; }
  audit("Facturation finale","Génération document",ref,"type","—",titre, f?f.dossier:"");
  document.getElementById("main").innerHTML = docCadre(titre, corps, retour||"facturation");
}
/* --- Vue Direction : Factures & Risques clients --- */
function rendreRisquesClients(){
  let h = topbar("Factures finales & Risques clients");
  if(!estDirection()){ h += `<div class="panneau"><div class="note-verrou"><b>Réservé à la Direction</b></div></div>`; document.getElementById("main").innerHTML=h; return; }
  const fs2 = DB.facturesFinales;
  const calc = fs2.map(f=>({f, c:calculFF(f)}));
  const totalSolde = calc.filter(x=>x.c.soldeDu<=0.01).reduce((s,x)=>s+x.c.totalTTC,0);
  const totalRestant = calc.filter(x=>x.c.soldeDu>0.01).reduce((s,x)=>s+x.c.soldeDu,0);
  const totalImpaye = calc.filter(x=>x.c.soldeDu>0.01 && x.c.joursRetard>0).reduce((s,x)=>s+x.c.soldeDu,0);
  const totalReduc = calc.reduce((s,x)=>s+x.c.reducValidees,0);
  const totalPertes = DB.abandons.reduce((s,a)=>s+(+a.perteFinale||0),0);
  const abandonnees = fs2.filter(f=>f.statutMarchandise==="Abandonnée par le client").length;
  const stockees = fs2.filter(f=>f.statutMarchandise==="Stockée par ULTEx").length;
  const contentieux = fs2.filter(f=>f.statutFinal==="Dossier en contentieux"||f.statutMarchandise==="En contentieux").length + DB.abandons.filter(a=>a.statutContentieux && !["Aucun","Clos"].includes(a.statutContentieux)).length;
  const parClient = {};
  calc.forEach(x=>{ if(x.c.soldeDu>0.01){ parClient[x.f.client]=(parClient[x.f.client]||0)+x.c.soldeDu; } });
  const top = Object.entries(parClient).sort((a,b)=>b[1]-a[1]).slice(0,10);
  h += `<div class="outils"><span style="flex:1;color:var(--gris)">${fs2.length} facture(s) finale(s) émise(s)</span><button class="btn or" onclick="window.print()">🖨 Imprimer</button></div>`;
  h += enteteImpression("Factures finales & Risques clients");
  h += `<div class="stats">
    <div class="stat"><b>${fs2.length}</b><span>Factures finales émises</span></div>
    <div class="stat"><b>${Math.round(totalSolde).toLocaleString("fr-FR")}</b><span>Total soldé (MAD)</span></div>
    <div class="stat ${totalRestant?"alerte":""}"><b>${Math.round(totalRestant).toLocaleString("fr-FR")}</b><span>Total restant dû (MAD)</span></div>
    <div class="stat ${totalImpaye?"alerte":""}"><b>${Math.round(totalImpaye).toLocaleString("fr-FR")}</b><span>Total impayé (MAD)</span></div>
    <div class="stat"><b>${Math.round(totalReduc).toLocaleString("fr-FR")}</b><span>Total réductions (MAD)</span></div>
    <div class="stat ${totalPertes?"alerte":""}"><b>${Math.round(totalPertes).toLocaleString("fr-FR")}</b><span>Total pertes (MAD)</span></div>
    <div class="stat ${abandonnees?"alerte":""}"><b>${abandonnees}</b><span>Marchandises abandonnées</span></div>
    <div class="stat"><b>${stockees}</b><span>Stockées par ULTEx</span></div>
    <div class="stat ${contentieux?"alerte":""}"><b>${contentieux}</b><span>Dossiers en contentieux</span></div>
  </div>`;
  h += `<div class="deux-col"><div>`;
  h += tableFiche("Top clients débiteurs", top.map(([cl,m])=>({cl,m})), [
    ["Client",o=>`<a class="lien" href="#ficheClient:${esc(o.cl)}">${esc(refLabel("clients",o.cl,"nom"))}</a>`],["Solde dû",o=>`<b style="color:var(--rouge)">${fmtMAD(Math.round(o.m))}</b>`]]);
  h += `</div><div>`;
  h += tableFiche("Impayés en cours", DB.impayes.filter(i=>i.statut!=="Clos"), [
    ["Code",o=>`<span class="pill p-gris">${esc(o.code)}</span>`],["Client",o=>esc(refLabel("clients",o.client,"nom")).slice(0,20)],["Échu",o=>fmtMAD(o.montantEchu)],["Relances",o=>(o.relances||[]).length]]);
  h += `</div></div>`;
  h += tableFiche("Toutes les factures finales", calc.map(x=>x.f), [
    ["Code",o=>`<a class="lien" href="#ficheFF:${esc(o.code)}">${esc(o.code)}</a>`],["Client",o=>esc(refLabel("clients",o.client,"nom")).slice(0,22)],["Dossier",o=>esc(o.dossier)],["Total TTC",o=>fmtMAD(calculFF(o).totalTTC)],["Solde dû",o=>{const s=calculFF(o).soldeDu;return `<b style="color:${s>0.01?"var(--rouge)":"var(--ok)"}">${fmtMAD(Math.round(s))}</b>`}],["Marchandise",o=>esc(o.statutMarchandise||"—")],["Statut",o=>esc(o.statutFinal||"—")]], true);
  document.getElementById("main").innerHTML = h;
}

let ASSIST_ETAT = null; // {code, pasActuel, data:{}, erreurs:{}}

function cleBrouillon(code){ return "ubos_brouillon_dossiers_"+(code||"nouveau")+"_"+(SESSION?SESSION.identifiant:"anon"); }
function sauverBrouillonDossier(){
  if(!ASSIST_ETAT) return;

function supprimerBrouillonDossier(code){ try{ localStorage.removeItem(cleBrouillon(code)); }catch(e){} }
function lireBrouillonDossier(code){

function assistantOuvrirDossier(code){

function demarrerAssistantDossier(code, existant, brouillonJSON){

  const base = existant ? Object.assign({}, existant) : {};
  ASSIST_ETAT = {
    code: code||"nouveau",
    codeExistant: code||"",
    data: brouillon ? brouillon.data : base,
    pasActuel: brouillon ? brouillon.pas : 0,

  };

function assistantValeur(k){ return ASSIST_ETAT.data[k] ?? ""; }
function assistantMaj(k, v){ ASSIST_ETAT.data[k] = v; sauverBrouillonDossier(); }

/* Intelligence : pré-remplissage depuis l'historique du client (#17) */
function suggestionsClient(codeClient){
  const doss = DB.dossiers.filter(d=>d.client===codeClient);
  if(!doss.length) return null;
  const frequent = arr => { const c={}; arr.filter(Boolean).forEach(v=>c[v]=(c[v]||0)+1); const e=Object.entries(c).sort((a,b)=>b[1]-a[1])[0]; return e?e[0]:""; };
  return {
    fournisseur: frequent(doss.map(d=>d.fournisseur)),
    paysOrigine: frequent(doss.map(d=>d.paysOrigine)),
    incoterm: frequent(doss.map(d=>d.incoterm)),
    modeTransport: frequent(doss.map(d=>d.modeTransport)),
    portDepart: frequent(doss.map(d=>d.portDepart))
  };
}
function assistantClientChoisi(code){
  assistantMaj("client", code);
  if(!code) return;
  const s = suggestionsClient(code);
  if(!s) return;
  let applique = [];
  ["fournisseur","paysOrigine","incoterm","modeTransport","portDepart"].forEach(k=>{
    if(s[k] && !ASSIST_ETAT.data[k]){ ASSIST_ETAT.data[k] = s[k]; applique.push(k); }
  });
  if(applique.length){ sauverBrouillonDossier(); toast("Pré-rempli depuis l'historique du client : "+applique.length+" champ(s)"); rendreAssistantDossier(); }
}

function champsEtape(idxEtape){
  const g = k => MODS.dossiers.champs.find(f=>f.k===k);
  if(idxEtape===0) return ["client","nouveauClient","demande","commande","produit","responsable"].map(g);
  if(idxEtape===1) return ["fournisseur","montantVente","montantAchat"].map(g);
  if(idxEtape===2) return ["importateurOfficiel","proprietaireMarchandise","formuleUltex"].map(g);
  if(idxEtape===3){
    const mode = assistantValeur("modeTransport")||"Maritime — FCL 20 pieds";
    const champsBase = [g("incoterm"), g("paysOrigine"), g("modeTransport")];
    if(mode.startsWith("Maritime")) champsBase.push({k:"portDepart",l:"Port de départ",t:"port",aide:"Port d'embarquement de la marchandise."},{k:"portArrivee",l:"Port d'arrivée",t:"port"});
    else if(mode.startsWith("Aérien")) champsBase.push({k:"portDepart",l:"Aéroport de départ",t:"aeroport"},{k:"portArrivee",l:"Aéroport d'arrivée",t:"aeroport"});
    else if(mode.startsWith("Aucun transport")){ /* pas de champs port/ville */ }
    else champsBase.push({k:"portDepart",l:"Ville / adresse de départ",t:"text"},{k:"portArrivee",l:"Ville / adresse d'arrivée",t:"text"});
    champsBase.push(g("cbm"), g("poids"));
    return champsBase;
  }
  if(idxEtape===4) return ["etape","responsable","statut","actionSuivante","respActionSuivante","echeanceActionSuivante"].map(g).filter((f,i,arr)=>arr.findIndex(x=>x.k===f.k)===i);
  return [];
}

function rendreEtapeServices(){

        : `sélectionnez d'abord un client existant à l'étape 1, ou complétez sa fiche (ICE/IF/RC) dans Profil Client 360°.`)+`</div>`;

  <p style="color:var(--gris);font-size:11.5px;margin-bottom:10px">Choisir un package coche automatiquement les services correspondants — vous pouvez ensuite ajouter ou retirer un service librement.</p>

  <div class="grille-cases" style="grid-template-columns:1fr 1fr 1fr;max-height:220px">`+
  SERVICES_ULTEX.map(s=>`<label><input type="checkbox" onclick="toggleServiceAssistant('${s.replace(/'/g,"\\'")}')" ${services.includes(s)?"checked":""}> ${esc(s)}</label>`).join("")+`</div>`;
  return h;

function assistantValiderEtape(idx){
  const champs = champsEtape(idx);
  const err = [];
  if(idx===0 && !assistantValeur("client") && !assistantValeur("nouveauClient")) err.push("Indiquez un client existant ou un nouveau client.");
  if(idx===0 && !assistantValeur("commande") && !ASSIST_ETAT.codeExistant && assistantValeur("creationDirecteAutorisee")!=="oui") err.push("Un dossier s'ouvre depuis une commande confirmée — ou cochez « Création directe autorisée » avec un motif.");
  if(idx===0 && assistantValeur("creationDirecteAutorisee")==="oui" && !assistantValeur("motifCreationDirecte")) err.push("Précisez le motif de la création directe.");
  champs.forEach(f=>{ if(f && f.req && !assistantValeur(f.k)) err.push("Champ obligatoire : "+f.l); });
  if(idx===0 && !assistantValeur("produit")) err.push("Le produit / la marchandise est obligatoire.");
  if(idx===2 && !(ASSIST_ETAT.data.servicesInclus||[]).length) err.push("Sélectionnez au moins un service ULTEx (ou un package raccourci).");
  return err;
}
function assistantSuivant(){
  const err = assistantValiderEtape(ASSIST_ETAT.pasActuel);
  if(err.length){ ASSIST_ETAT.erreurs[ASSIST_ETAT.pasActuel] = err; rendreAssistantDossier(); return; }
  ASSIST_ETAT.erreurs[ASSIST_ETAT.pasActuel] = null;
  if(ASSIST_ETAT.pasActuel < ETAPES_ASSISTANT_DOSSIER.length-1){ ASSIST_ETAT.pasActuel++; sauverBrouillonDossier(); rendreAssistantDossier(); }
}
function assistantPrecedent(){
  if(ASSIST_ETAT.pasActuel>0){ ASSIST_ETAT.pasActuel--; sauverBrouillonDossier(); rendreAssistantDossier(); }
}
function assistantAllerEtape(idx){
  if(idx <= ASSIST_ETAT.pasActuel){ ASSIST_ETAT.pasActuel = idx; rendreAssistantDossier(); }
}
function assistantContinuerPlusTard(){
  sauverBrouillonDossier();
  toast("Brouillon enregistré — vous pourrez le reprendre plus tard");
  fermer(); ASSIST_ETAT = null;
}
function assistantAnnuler(){
  if(confirm("Fermer l'assistant ? Le brouillon reste enregistré et pourra être repris.")){
    sauverBrouillonDossier();
    fermer(); ASSIST_ETAT = null;
  }
}
function assistantConfirmer(){
  const nouv = Object.assign({}, ASSIST_ETAT.data);
  const code = ASSIST_ETAT.codeExistant;
  const M = MODS.dossiers;
  if(code && !peut("modifier")){ toast("Permission refusée : modification non autorisée."); return; }
  if(!code && !peut("ajouter")){ toast("Permission refusée : ajout non autorisé."); return; }
  const propre = {};
  M.champs.forEach(f=>{ propre[f.k] = nouv[f.k] ?? ""; });
  ["portDepart","portArrivee"].forEach(k=>{ if(nouv[k]!==undefined) propre[k]=nouv[k]; });
  propre.servicesInclus = (nouv.servicesInclus||[]).slice();
  if(M.avantSauve && M.avantSauve(propre) === false) return;
  let dossierFinal;
  if(code){
    const obj = DB.dossiers.find(x=>x.code===code);
    const ancien = Object.assign({}, obj);
    for(const k in propre){
      if(k==="servicesInclus") continue;
      if(String(obj[k]??"") !== String(propre[k]??"")){ audit(M.label,"Modification",obj.code, k, obj[k], propre[k], obj.code); }
      obj[k] = propre[k];
    }
    if(JSON.stringify(obj.servicesInclus||[])!==JSON.stringify(propre.servicesInclus)){
      audit(M.label,"Modification",obj.code,"servicesInclus",(obj.servicesInclus||[]).join(", "),propre.servicesInclus.join(", "),obj.code);
      obj.servicesInclus = propre.servicesInclus;
    }
    if(M.apresSauve) M.apresSauve(obj, ancien);
    dossierFinal = obj;
    toast(obj.code+" mis à jour");
  } else {
    propre.code = genCode("DOS");
    propre.ts = Date.now(); propre.par = userCourant;
    if(nouv.lignesACreer && nouv.lignesACreer.length){
      propre.lignes = nouv.lignesACreer.map((l,i)=>Object.assign({id:"do"+(i+1)+"_"+Date.now()}, l));
    }
    DB.dossiers.push(propre);
    recalculerProduitDossier(propre);
    audit(M.label,"Création",propre.code,"—","—", propre.produit, propre.code);
    if(propre.lignes && propre.lignes.length) audit(M.label,"Lignes créées depuis la commande",propre.code,"lignes","—",propre.lignes.length+" ligne(s)",propre.code);
    if(M.apresSauve) M.apresSauve(propre, null);
    dossierFinal = propre;
    toast(propre.code+" créé");
  }
  dossierFinal.servicesResponsabilites = dossierFinal.servicesResponsabilites||[];
  dossierFinal.servicesInclus.forEach(srv=>{
    if(!dossierFinal.servicesResponsabilites.some(r=>r.service===srv)){
      dossierFinal.servicesResponsabilites.push({service:srv, responsable:"", statut:"À définir", dateDebut:"", echeance:"",
        modePrix:"Forfaitaire", prixForfaitaire:"", pourcentage:"", coutReel:"", remise:"", tvaPct:20, statutFacturation:"Non facturé",
        documentAttendu:"", resultat:"", validation:""});
    }
  });
  const nbTaches = genererTachesDepuisServices(dossierFinal);
  if(nbTaches) toast(nbTaches+" tâche(s) créée(s) automatiquement pour les services sélectionnés");
  detecterMentions(propre.remarque, code||dossierFinal.code);
  supprimerBrouillonDossier(ASSIST_ETAT.code);
  sauver(); fermer(); ASSIST_ETAT = null; rendre();
}
function rendreAssistantDossier(){
  const A = ASSIST_ETAT;

  m.classList.add("large");
  let corps = "";
  if(etape.id==="services"){
    corps = rendreEtapeServices();

    if(err && err.length) corps += err.map(e=>`<div class="assist-err">${esc(e)}</div>`).join("");
  } else if(etape.id!=="validation"){
    const champs = champsEtape(idx);
    corps = `<div class="assist-grille">` + champs.map(f=>{
      if(!f) return "";
      const v = assistantValeur(f.k);

        return `<div class="champ"><label>Client existant</label><select id="af_client" onchange="assistantClientChoisi(this.value)"><option value="">—</option>${DB.clients.map(c=>`<option value="${esc(c.code)}" ${c.code===v?"selected":""}>${esc(c.nom)} · ${esc(c.code)}</option>`).join("")}</select></div>`;

      return html.replace(`id="f_${f.k}"`, `id="af_${f.k}" onchange="assistantMaj('${f.k}', this.value)" oninput="assistantMaj('${f.k}', this.value)"`);
    }).join("") + `</div>`;
    const err = A.erreurs[idx];
    if(err && err.length) corps += err.map(e=>`<div class="assist-err">${esc(e)}</div>`).join("");
    if(idx===0){
      const s = assistantValeur("client") ? suggestionsClient(assistantValeur("client")) : null;
      if(s && Object.values(s).some(Boolean)) corps += `<div class="banniere-brouillon">💡 Ce client a déjà un historique : fournisseur, pays, incoterm et mode de transport habituels ont été suggérés à l'étape Transport.</div>`;
      if(!assistantValeur("commande") && !ASSIST_ETAT.codeExistant){

          <label style="display:block;margin-top:6px"><input type="checkbox" id="af_creationDirecte" ${assistantValeur("creationDirecteAutorisee")?"checked":""} onchange="assistantMaj('creationDirecteAutorisee', this.checked?'oui':'')"> Création directe autorisée (migration historique / cas exceptionnel)</label>
          <input id="af_motifCreationDirecte" placeholder="Motif" value="${esc(assistantValeur("motifCreationDirecte"))}" oninput="assistantMaj('motifCreationDirecte', this.value)" style="margin-top:6px;width:100%;padding:8px;border:1px solid var(--bord);border-radius:8px"></div>`;
      }
    }
  } else {
    const cl = DB.clients.find(c=>c.code===assistantValeur("client"));
    const champsTous = MODS.dossiers.champs;
    const services = ASSIST_ETAT.data.servicesInclus||[];

    corps = `<div class="kv">` + champsTous.filter(f=>f.k!=="nouveauClient").map(f=>{
      let v = assistantValeur(f.k);
      if(f.k==="client") v = cl ? cl.nom+" ("+cl.code+")" : (assistantValeur("nouveauClient")||"—");
      if(f.k==="incoterm") v = v ? labelIncoterm(v) : "—";
      return `<div>${esc(f.l.replace(" *",""))}</div><div>${esc(v||"—")}</div>`;
    }).join("") +
    `<div>Services inclus (${services.length})</div><div>${services.map(s=>pill(s,"p-vert")).join(" ")||"—"}</div>
    <div>Services exclus</div><div style="color:var(--gris)">${exclus.map(s=>pill(s,"p-gris")).join(" ")}</div>`
    + `</div>
    <p style="margin-top:14px;color:var(--gris);font-size:12.5px">Vérifiez ce récapitulatif. La création du dossier (et, le cas échéant, du client) n'aura lieu qu'après votre confirmation. Les tâches correspondant aux services sélectionnés seront créées automatiquement.</p>`;
  }
  m.innerHTML = `
    <header><h3>${A.codeExistant?"Modifier le dossier "+esc(A.codeExistant):"Nouveau dossier"} — Assistant</h3><button onclick="assistantAnnuler()">✕</button></header>
    <div class="assist-barre">${ETAPES_ASSISTANT_DOSSIER.map((e,i)=>`<div class="assist-pas ${i<idx?"fait":i===idx?"actif":""}"></div>`).join("")}</div>
    <div class="assist-etapes">${ETAPES_ASSISTANT_DOSSIER.map((e,i)=>`<span class="${i===idx?"actif":""}" ${i<idx?`style="cursor:pointer" onclick="assistantAllerEtape(${i})"`:""}>${i+1}. ${esc(e.titre)}</span>`).join("")}</div>
    <div class="assist-corps"><h3>${esc(etape.titre)}</h3><div class="sous">${esc(etape.sous)}</div>${corps}</div>
    <div class="assist-pied">
      <div>${idx>0?`<button class="btn doux" onclick="assistantPrecedent()">← Précédent</button>`:""}</div>

  document.getElementById("voile").classList.add("on");

function sauverLigneDemande(codeDemande, idLigne){
  if(!peut("modifier") && !peut("ajouter")){ toast("Permission refusée."); return; }
  const d = DB.demandes.find(x=>x.code===codeDemande); if(!d) return;
  const produit = document.getElementById("ld_produit").value.trim();
  if(!produit){ toast("Le produit / service est obligatoire."); return; }
  const routes = [...document.querySelectorAll(".ld_route")].filter(c=>c.checked).map(c=>c.value);
  const data = {produitService:produit, description:document.getElementById("ld_desc").value.trim(), usage:document.getElementById("ld_usage").value.trim(),
    quantite:document.getElementById("ld_qte").value, unite:document.getElementById("ld_unite").value.trim(), marqueModele:document.getElementById("ld_marque").value.trim(),
    caracteristiques:document.getElementById("ld_carac").value.trim(), photos:document.getElementById("ld_photos").value.trim(), documents:document.getElementById("ld_docs").value.trim(),
    budgetEstime:document.getElementById("ld_budget").value, paysSouhaite:document.getElementById("ld_pays").value.trim(),
    fournisseurConnu:document.getElementById("ld_fourconnu").value, proformaDisponible:document.getElementById("ld_proforma").value,
    priorite:document.getElementById("ld_priorite").value, statut:document.getElementById("ld_statut").value,
    responsable:document.getElementById("ld_resp").value, echeance:document.getElementById("ld_echeance").value, route:routes};
  d.lignes = d.lignes||[];
  if(idLigne){
    const l = d.lignes.find(x=>x.id===idLigne);
    Object.assign(l, data);
    audit("Demandes","Ligne modifiée",codeDemande,l.code,"—",produit);
  } else {
    const l = Object.assign({id:"dl"+(d.lignes.length+1)+"_"+Date.now(), code:genCodeLigneDemande(codeDemande, d), consultationsFournisseurs:[], selection:null, statutConfirmation:"Non confirmée", ts:Date.now()}, data);
    d.lignes.push(l);
    audit("Demandes","Ligne ajoutée",codeDemande,l.code,"—",produit);
    routes.forEach(r=>{ if(data.responsable) notifier(data.responsable, `Nouvelle ligne ${l.code} (${produit}) routée vers ${r}.`, "Demandes"); });
  }
  sauver(); fermer(); rendre(); toast("Ligne enregistrée");
}
function dupliquerLigneDemande(codeDemande, idLigne){
  const d = DB.demandes.find(x=>x.code===codeDemande); if(!d) return;
  const l = (d.lignes||[]).find(x=>x.id===idLigne); if(!l) return;
  const copie = Object.assign({}, l, {id:"dl"+(d.lignes.length+1)+"_"+Date.now(), code:genCodeLigneDemande(codeDemande, d), consultationsFournisseurs:(l.consultationsFournisseurs||[]).map(c=>Object.assign({},c,{id:"cf"+Date.now()+Math.random().toString(36).slice(2,6)})), selection:null, statutConfirmation:"Non confirmée"});
  d.lignes.push(copie);
  audit("Demandes","Ligne dupliquée",codeDemande,copie.code,l.code,"copie de "+l.code);
  sauver(); rendre(); toast("Ligne dupliquée : "+copie.code);
}
function supprimerLigneDemande(codeDemande, idLigne){
  if(!peut("supprimer")){ toast("Permission refusée."); return; }
  const d = DB.demandes.find(x=>x.code===codeDemande); if(!d) return;
  const l = (d.lignes||[]).find(x=>x.id===idLigne); if(!l) return;
  if(l.statutConfirmation==="Confirmée"){ toast("Impossible de supprimer une ligne déjà confirmée en commande."); return; }
  if(!confirm("Supprimer la ligne "+l.code+" ?")) return;
  d.lignes = d.lignes.filter(x=>x.id!==idLigne);
  audit("Demandes","Ligne supprimée",codeDemande,l.code,l.produitService,"supprimée avant confirmation");
  sauver(); rendre();
}
function cloturerLigneDemande(codeDemande, idLigne){
  const d = DB.demandes.find(x=>x.code===codeDemande); if(!d) return;
  const l = (d.lignes||[]).find(x=>x.id===idLigne); if(!l) return;
